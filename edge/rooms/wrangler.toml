# Wrangler config for the rooms Worker, fdfpv-rooms. See edge/rooms/do.js
# and docs/MULTIPLAYER-PLAN.md.
#
#     npx wrangler deploy --config edge/rooms/wrangler.toml
#     npx wrangler dev --config edge/rooms/wrangler.toml
#
# No wrangler in package.json, for the reason edge/wrangler.toml gives.
# Separate from the router and from the tracks server on purpose: rooms hold
# sockets and nothing else, and share no storage with either.

name = "fdfpv-rooms"
main = "do.js"
compatibility_date = "2026-08-01"
workers_dev = true

# Off, so connecting addresses never land in logs (docs/MULTIPLAYER-PLAN.md
# section 9, "What a kick remembers").
[observability]
enabled = false

# Public rooms per map (edge/rooms/lobby.js), opened by Phase 5 once its
# safety checks passed (rooms:selftest, the two page check). "off" closes
# them again without a code change.
[vars]
PUBLIC_ROOMS = "on"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[durable_objects.bindings]]
name = "LOBBY"
class_name = "Lobby"

# SQLite backed, the only kind the Free plan has.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

# Named for its phase, not numbered: phases are built in parallel, and two
# branches that each added "v2" would collide at the second deploy.
[[migrations]]
tag = "phase5-lobby"
new_sqlite_classes = ["Lobby"]
