[Service]
# Measured 2026-10-01 on this VM (systemctl show -p MemoryPeak, the same
# number as the cgroup's memory.peak): 172 MB over the 2.8 days since
# Postgres last started (2026-09-29 13:52 UTC), live use plus the board's
# live checks, page cache included; 144 MB over two runs of
# board-live-check.js before that. What cannot be reclaimed is far less:
# 2 MB anonymous and 6 MB shared at the reading, swap peak 32 MB. The stock
# config can grow it: shared_buffers 128 MB (the database is 67 MB on disk
# today), the board's pool of 4 connections at work_mem 4 MB, and an
# autovacuum at maintenance_work_mem 64 MB.
#
# 256M is about one and a half times the measured peak and holds all of
# that at once. At the ceiling the kernel takes back page cache first and
# then swaps (no MemorySwapMax), so the ceiling slows Postgres rather than
# killing it, and the board, which Requires= it, with it.
#
# Every ceiling on the VM (5.6 GB): rooms, tracks and board 256M each,
# coturn 128M, this 256M, 1,152 MB together; Caddy has none and peaked at
# 92 MB.
MemoryMax=256M
