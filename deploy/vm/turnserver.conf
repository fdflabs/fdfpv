# turnserver.conf: coturn, the TURN relay for voice chat (src/share/voice.js),
# installed by deploy/vm/turn-install.sh as /etc/coturn/turnserver.conf with
# three lines added on the VM: external-ip (the VM's public address and the
# private one Oracle maps it to), and static-auth-secret, which is the
# TURN_SECRET in /etc/fdfpv/turn.env and never in this repository.
#
# Voice goes pilot to pilot. This relay is only for the pilots whose networks
# will not let a direct link through (a symmetric NAT, a strict firewall),
# and the client asks for it only after a direct try has failed.
#
# The rooms server mints each pilot a credential that expires by itself
# (edge/rooms/turn.js, the TURN REST scheme): nothing about a pilot is
# stored here, and there is no user database.
#
# This file is part of the Paraguayan Drone Combat Simulator.
