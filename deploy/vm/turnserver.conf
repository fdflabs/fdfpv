# STUN and TURN over UDP and TCP on 3478, TURN over TLS on 5349. RFC 5780
# NAT discovery, which would need two more ports and no browser uses, is
# off by default (coturn 4.7 on).
listening-port=3478
tls-listening-port=5349

# The relay's ports, one per allocation: 41, exactly the range opened in
# firewalld (turn-install.sh) and in Oracle's security list. A browser
# allocates once for each network interface it has, so a relayed voice link
# takes one or two ports at each end that relays: the range carries
# somewhere between ten and forty relayed links at once, and a full range
# answers 508, Insufficient Capacity (seen when coturn.conf's load test
# filled it). The client asks for
# the relay only when a direct link has failed, one transport at a time.
min-port=49160
max-port=49200

# Credentials minted by the rooms server (edge/rooms/turn.js).
use-auth-secret
realm=129.151.39.48
fingerprint

# One pilot's credential holds 16 allocations at most: a full public room's
# 15 links from one network interface, and never the whole relay. A session
# is one voice stream, 5.2 kB/s (41.6 kb/s) on the wire
# while talking, measured by scripts/voicechat-two-page.js; 16 kB/s is room
# for that and for Opus at its loudest, and none for using this relay as a
# general proxy.
user-quota=16
max-bps=16000

# Relay UDP only, the way WebRTC uses it; clients may still reach the
# server itself over TCP or TLS.
no-tcp-relay

# Never relay into this machine or any private network: a TURN relay that
# will send to 127.0.0.1, 10.0.0.0/8 or 169.254.169.254 (the cloud's
# metadata service) is a door into the VM's own network.
no-multicast-peers
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.0.2.0-192.0.2.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=198.51.100.0-198.51.100.255
denied-peer-ip=203.0.113.0-203.0.113.255
denied-peer-ip=224.0.0.0-255.255.255.255
denied-peer-ip=::1
denied-peer-ip=64:ff9b::-64:ff9b::ffff:ffff
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff

# Caddy's Let's Encrypt certificate for the address, copied here by
# fdfpv-turn-cert.service (root:coturn, 0640) and reloaded on renewal.
# Until the first copy there is no TLS listener; UDP and TCP still work.
cert=/etc/coturn/tls/cert.pem
pkey=/etc/coturn/tls/key.pem

# No log. coturn's log names every client address and every peer, and
# nothing about who talked to whom is kept on this server (privacy.html).
# To diagnose, stop the unit and run turnserver -c ... in a terminal with
# --log-file=stdout.
log-file=/dev/null
simple-log

# No version in answers. (The telnet admin console is off by default
# since coturn 4.6; the old no-cli line is an error there.)
no-software-attribute
