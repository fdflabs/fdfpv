[Service]
# The package restarts only on an abort; like the rooms server, always.
Restart=always
RestartSec=2
# Measured 2026-09-30 with this config in an Oracle Linux 9 container held
# to one CPU, as the VM has (coturn 4.17.2, x86_64; the VM gets 4.18.0,
# aarch64): 23 MB resident idle, 28.6 MB peak with the relay's whole port
# range allocated and carrying 50 packets a second each. About four and a
# half times that.
MemoryMax=128M
