# Publish the simulator to GitHub Pages on every push to main.
#
# The shell is a static site: index.html, src/, dist/sim.wasm (committed),
# assets/, configs/ and tests/lib/, which main.js imports the WASM loader
# from. Nothing is built here. The Betaflight submodule is not checked out
# because nothing served needs it, and vendor/ is left out of the artifact
# for the same reason. Pages serves .wasm as application/wasm, which the
# streaming instantiate in tests/lib/simmod.js requires.
#
# The one change to the staged tree is the version stamp: every module the
# shell pages import is named at ?v=<commit> in their import maps, and
# version.json carries the same commit for src/ui/update.js to poll. Pages
# sends max-age=600 on every file, so without it a tab or a reload could run
# modules from two deploys at once. See scripts/stamp-version.js.
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Stage the site
        run: |
          scripts/stage-site.sh /tmp/site
          # The custom domain. A Pages site deployed by a workflow takes
          # its domain from Settings > Pages only and ignores this file; it
          # is published so the served tree says where it lives, and so a
          # move back to branch publishing would keep the domain.
          grep -qx paraguayandronecombatsimulator.com /tmp/site/CNAME
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Stamp the version
        run: node scripts/stamp-version.js /tmp/site "${GITHUB_SHA::12}"
      # After the stamp: the policy allows the stamped import map by its hash.
      # Pages sends no header a site chooses, so it is a meta tag (scripts/csp.js).
      - name: Write the Content-Security-Policy
        run: node scripts/csp.js /tmp/site
      - uses: actions/upload-pages-artifact@v5
        with:
          path: /tmp/site
      - id: deployment
        uses: actions/deploy-pages@v5
