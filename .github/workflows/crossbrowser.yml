name: crossbrowser

on:
  schedule:
    - cron: '30 7 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - scripts/xbrowser-check.js
      - .github/workflows/crossbrowser.yml

jobs:
  engine:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        engine: [firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.engine }}
      # Headful on Xvfb: with no GPU, headless Firefox gets no WebGL at all.
      - run: xvfb-run -a npm run xbrowser:check -- ${{ matrix.engine }}
        env:
          XBROWSER_HEADFUL: '1'
