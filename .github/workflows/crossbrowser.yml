# Firefox and WebKit (Safari's engine) through the shell: boot, the title's
# menus, a short flight and a room (scripts/xbrowser-check.js). Not in
# checks.yml: the two engines' boots on a runner without a GPU take minutes
# each, and checks.yml already runs 30 to 55. So it runs nightly, by hand,
# and on a pull request that changes the check itself. A red run says which
# engine broke what; docs/CROSSBROWSER.md keeps the known state.
