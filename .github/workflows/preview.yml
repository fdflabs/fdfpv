# A flyable preview of every pull request, before it merges (docs/PREVIEWS.md).
#
# GitHub Pages publishes one site per repository, so the preview lives on
# Cloudflare Pages, free, on its own host: pr-<n>.fdfpv-preview.pages.dev.
# The tree is staged and stamped exactly as pages.yml stages main, from the
# merge of the pull request into main, which is what would go live.
#
# A preview is solo only. On a host that is not the game's own
# (src/share/api.js SITE_HOSTS) the page asks no rooms, tracks, accounts or
# board server, and the rooms server refuses the origin anyway
# (edge/rooms/front.js), so a build nobody merged never writes real data.
#
# Pull requests from forks get no secrets and are skipped. Until the
# CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets exist the job stages
# and stamps, then says in its summary that there is nowhere to publish.
