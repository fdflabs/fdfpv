name: preview

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PR: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v7
      - name: Stage the site
        run: scripts/stage-site.sh /tmp/site
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Stamp the version
        run: node scripts/stamp-version.js /tmp/site "${HEAD_SHA::12}"
      - name: Nowhere to publish yet
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "::warning::No CLOUDFLARE_API_TOKEN secret, so no preview was published (docs/PREVIEWS.md)."
      - name: Publish to Cloudflare Pages
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx --yes wrangler@4 pages deploy /tmp/site --project-name fdfpv-preview --branch "pr-$PR" --commit-hash "$HEAD_SHA" --commit-dirty=true
      - name: Link it on the pull request
        if: env.CLOUDFLARE_API_TOKEN != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/preview-comment.js
