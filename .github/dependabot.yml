version: 2
updates:
  # ws and nodemailer: the VM's rooms and tracks servers. A merged bump
  # reaches them only with the next deploy/vm/deploy.sh.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Asuncion
    groups:
      npm:
        patterns: ["*"]
    open-pull-requests-limit: 2
    commit-message:
      prefix: deps
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Asuncion
    groups:
      actions:
        patterns: ["*"]
    open-pull-requests-limit: 2
    commit-message:
      prefix: deps
