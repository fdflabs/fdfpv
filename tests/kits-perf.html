<html>
<head>
<meta charset="utf-8">
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<style>html, body { margin: 0; background: #000; }</style>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { buildPeerCraft } from '../src/render/peers.js';

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(1280, 720);
document.body.append(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b0d16);
scene.fog = new THREE.Fog(0x0b0d16, 20, 160);
scene.add(new THREE.HemisphereLight(0x33405a, 0x10100c, 0.35));
const ground = new THREE.Mesh(new THREE.PlaneGeometry(400, 400), new THREE.MeshLambertMaterial({ color: 0x1c2216 }));
ground.rotation.x = -Math.PI / 2;
scene.add(ground);
const camera = new THREE.PerspectiveCamera(70, 1280 / 720, 0.05, 500);
camera.position.set(0, 3, 12);
camera.lookAt(0, 1.5, 0);

const QUADS = ['7inch', '10inch', 'interceptor', '7inch'];
const PLANES = ['sky1800', 'p51d1450', 'f16878', 'radian2000'];
const LED = { v: 1, led: '#00b7ff', pattern: 'chase' };
const NAV = { v: 1, nav: true, strobe: true };

function field(lit) {
  const group = new THREE.Group();
  const rigs = [];
  [...QUADS, ...PLANES].forEach((airframe, i) => {
    const quad = i < QUADS.length;
    const livery = lit ? { lights: quad ? LED : NAV } : null;
    const rig = buildPeerCraft({ airframe, map: 'interior', figure: 0, parts: null, livery });
    const at = { px: (i % 4 - 1.5) * (quad ? 2.5 : 4), py: quad ? 2 : 1.2, pz: quad ? 0 : -6, qx: 0, qy: 0, qz: 0, qw: 1 };
    rig.pose(at, sample, 0.016, 0, 720, 70);
    group.add(rig.group);
    rigs.push({ rig, at });
  });
  return { group, rigs };
}

const gl = renderer.getContext();
const ext = gl.getExtension('EXT_disjoint_timer_query_webgl2');
const sample = { flags: 0, c0: 0, c1: 0, c2: 0, c3: 0, motor: 0, flaps: 0, vx: 0, vy: 0, vz: 0 };

/* Median GPU ms a frame over n frames, the rigs' lights run each frame
 * as a room runs them. */
async function time(f, n) {
  const ms = [];
  for (let k = 0; k < n; k += 1) {
    for (const { rig, at } of f.rigs) {
      rig.pose(at, sample, 0.016, k * 0.0167, 720, 70);
    }
    const q = gl.createQuery();
    gl.beginQuery(ext.TIME_ELAPSED_EXT, q);
    renderer.render(scene, camera);
    gl.endQuery(ext.TIME_ELAPSED_EXT);
    await new Promise((r) => requestAnimationFrame(r));
    await new Promise((r) => setTimeout(r, 0));
    for (let w = 0; w < 50 && !gl.getQueryParameter(q, gl.QUERY_RESULT_AVAILABLE); w += 1) {
      await new Promise((r) => setTimeout(r, 2));
    }
    if (!gl.getParameter(ext.GPU_DISJOINT_EXT)) {
      ms.push(gl.getQueryParameter(q, gl.QUERY_RESULT) / 1e6);
    }
    gl.deleteQuery(q);
  }
  ms.sort((a, b) => a - b);
  return ms[Math.floor(ms.length / 2)];
}

/* One lit field, its light meshes shown and hidden on alternate frames,
 * so each pair of frames differs only by the lights: the median paired
 * difference is the lights' cost, free of the drift between rounds. */
const REPEAT = 20;
async function frameMs(f, k) {
  for (const { rig, at } of f.rigs) {
    rig.pose(at, sample, 0.016, k * 0.0167, 720, 70);
  }
  const q = gl.createQuery();
  /* REPEAT draws in one query keep the GPU busy, so its clocks stay up
   * and the timer reads the work, not an idle GPU waking (a single small
   * frame read 10 ms give or take 2.5 at idle clocks). */
  gl.beginQuery(ext.TIME_ELAPSED_EXT, q);
  for (let r = 0; r < REPEAT; r += 1) {
    renderer.render(scene, camera);
  }
  gl.endQuery(ext.TIME_ELAPSED_EXT);
  await new Promise((r) => requestAnimationFrame(r));
  for (let w = 0; w < 100 && !gl.getQueryParameter(q, gl.QUERY_RESULT_AVAILABLE); w += 1) {
    await new Promise((r) => setTimeout(r, 1));
  }
  const ms = gl.getParameter(ext.GPU_DISJOINT_EXT) ? null : gl.getQueryParameter(q, gl.QUERY_RESULT) / 1e6 / REPEAT;
  gl.deleteQuery(q);
  return ms;
}

window.kitsPerf = async (pairs = 600) => {
  if (!ext) {
    return { error: 'no EXT_disjoint_timer_query_webgl2' };
  }
  const f = field(true);
  scene.add(f.group);
  const lights = [];
  f.group.traverse((o) => {
    if (/^(led|nav|strobe)-/.test(o.name)) {
      lights.push(o);
    }
  });
  const show = (on) => {
    for (const o of lights) {
      o.userData.kitsPerfOff = !on;
      o.layers.set(on ? 0 : 1);
    }
  };
  const calls = {};
  for (const on of [false, true]) {
    show(on);
    renderer.render(scene, camera);
    calls[on ? 'on' : 'off'] = renderer.info.render.calls;
  }
  for (let k = 0; k < 30; k += 1) {
    await frameMs(f, k);
  }
  const off = [];
  const on = [];
  const diff = [];
  for (let k = 0; k < pairs; k += 1) {
    const first = k % 2 === 0;
    show(!first);
    const a = await frameMs(f, k);
    show(first);
    const b = await frameMs(f, k);
    if (a === null || b === null) {
      continue;
    }
    const [x, y] = first ? [a, b] : [b, a];
    off.push(x);
    on.push(y);
    diff.push(y - x);
  }
  return { off, on, diff, calls, lights: lights.length };
};
window.kitsPerfReady = true;
</script>
</body>
</html>
