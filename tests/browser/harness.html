<html lang="en">
<meta charset="utf-8" />
<title>FDFPV verification harness</title>
<!-- No favicon fetch: its 404 would be a console error in check 13. -->
<link rel="icon" href="data:," />
<script>
  window.__simHarnessResult = new Promise((settle) => {
    window.__simHarnessResolve = settle;
  });
</script>
