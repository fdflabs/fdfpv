  arrived, and writes nothing to the console on its own: the selftest prints

<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>page selftest fixture</title>
    <link rel="icon" href="data:," />
    <style>
      body { margin: 0; background: #123; }
      #target { position: absolute; left: 200px; top: 100px; width: 50px; height: 30px; background: #fc0; }
    </style>
  </head>
  <body>
    <div id="pdcs-loader" hidden></div>
    <div id="target"></div>
    <script>
      window.__seen = { keys: [], mouse: [], seeds: window.__seeds ? window.__seeds.slice() : null, pads: navigator.getGamepads().length };
      for (const type of ['keydown', 'keyup']) {
        window.addEventListener(type, (e) => {
          window.__seen.keys.push({ type, key: e.key, code: e.code, keyCode: e.keyCode });
        });
      }
      for (const type of ['mousedown', 'mouseup', 'click']) {
        document.getElementById('target').addEventListener(type, (e) => {
          window.__seen.mouse.push({ type, x: e.clientX, y: e.clientY, button: e.button });
        });
      }
      window.__later = false;
      setTimeout(() => { window.__later = true; }, 300);
    </script>
  </body>
</html>
