         through it. The cursor is the same bar and colour the menu rows
         use, turned on its side: a sakura edge and a lift, never a slab. */
      /* Symmetric, so the row list sits under the middle of the card grid
         rather than pushed right by a help column with no counterweight. */
      .screen-maps .menu-stage {
        grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
        /* 100%, not 96vw, for the reason on the shared rule above. This one
         * also sits LATER in the sheet than the narrow-window override, so
         * a vw width here won that fight and put the Race room's rows off
         * the right of every phone and tablet. */
        width: 100%;
        max-width: 1200px;
        margin: 10px auto 0;
      }
      .screen-maps .menu { grid-column: 2; min-width: min(320px, 86vw); }
      .screen-maps .menu-help { grid-column: 3; max-width: 22em; }
      .screen-courses .menu-scroll { max-height: none; }
      .map-cards {
        display: flex; gap: 20px; flex-wrap: wrap; justify-content: center;
        margin: 18px 0 10px; pointer-events: auto;
        width: 100%;
      }
      .map-card {
        width: min(340px, 82vw); cursor: pointer; border-radius: 4px;
        overflow: hidden; position: relative;
        background: rgba(16, 22, 17, 0.72);
        border-top: 2px solid rgba(232, 168, 184, 0.28);
        box-shadow: inset 0 0 0 1px rgba(244, 236, 214, 0.10);
        transition: transform 0.14s ease, box-shadow 0.14s ease, border-color 0.14s ease;
      }
      .map-card.on {
        transform: translateY(-4px);
        border-top-color: var(--sakura);
        box-shadow: inset 0 0 0 2px var(--sakura), 0 12px 28px rgba(0, 0, 0, 0.45);
      }
      /* The card whose actions are showing below the strip. It has to read as
         chosen even when the cursor has moved off it onto its own list, which
         is the whole reason the list is not floating free any more. Mint
         rather than sakura: sakura is the cursor, and two pinks a card apart
         would be one state drawn twice. */
      .map-card.chosen {
        border-top-color: var(--mint);
        box-shadow: inset 0 0 0 2px var(--mint), 0 12px 28px rgba(0, 0, 0, 0.45);
      }
      .map-card.chosen.on {
        box-shadow: inset 0 0 0 2px var(--sakura), 0 0 0 3px var(--mint),
          0 12px 28px rgba(0, 0, 0, 0.45);
      }
      .map-card.chosen .map-card-name { color: var(--mint); }
      /* 16 by 9, so the thumbnail is the shape of the thing it is a
         thumbnail of. A looping clip of the title shot fills this box. */
      .map-reel {
        display: block; width: 100%; aspect-ratio: 16 / 9; background: #1a241c;
        position: relative; overflow: hidden;
      }
      .map-reel-view {
        position: absolute; inset: 0; width: 100%; height: 100%;
        border: 0; display: block; object-fit: cover; pointer-events: none;
        z-index: 0;
      }
      /*
       * The poster: the still a world wears until its clip exists.
       *
       * A rendered frame of the world itself, from scripts/posters.js. The
       * URL arrives as --poster, set on the card by src/ui/ui.js, because
       * two boxes read it: the reel paints it, and so does the wait panel,
       * which sits over the opaque recorder iframe and would otherwise be a
       * scrim over nothing. A background rather than an <img> so that the
       * recorder's three `replaceChildren` calls cannot throw the picture
       * away, and so that a missing file degrades to the dark rectangle the
       * card always was.
       */
      .map-card.has-poster .map-reel {
        background-image: var(--poster);
        background-size: cover;
        background-position: center;
      }
      .map-card-still {
        position: absolute; left: 0; right: 0; top: 0; aspect-ratio: 16 / 9;
        display: flex; align-items: center; justify-content: center;
        padding: 0 18px; box-sizing: border-box; text-align: center;
        color: var(--slate); font-size: 13px; line-height: 1.5;
        z-index: 3;
      }
      /* Over a poster this sentence is type on a photograph, and slate on a
         cream frontage is not type at all. Cream with a shadow reads on
         both, so it is set once rather than twice. */
      .map-card.has-poster .map-card-still {
        color: var(--cream); text-shadow: 0 1px 4px rgba(8, 12, 9, 0.9);
      }
      .map-card-still:empty { display: none; }
      /* First-time clip wait. Same copy as the boot screen: "loading"
         and a joke. Cached visits never see it. */
      .map-reel-wait {
        position: absolute; inset: 0; z-index: 2;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        gap: 8px;
        padding: 12px 16px;
        box-sizing: border-box;
        text-align: center;
        background: radial-gradient(120% 90% at 50% 42%, #1e2a20, #101610);
        pointer-events: none;
      }
      /*
       * With a poster the wait is a caption on a photograph rather than a
       * screen of its own, so the flat panel becomes a scrim over the same
       * picture and the copy moves off the middle of it. Dark at the foot,
       * where the type is, and thin at the top, where the world is.
       */
      .map-card.has-poster .map-reel-wait {
        background:
          linear-gradient(
            to top,
            rgba(9, 14, 10, 0.90) 0%,
            rgba(9, 14, 10, 0.62) 42%,
            rgba(9, 14, 10, 0.16) 100%
          ),
          var(--poster) center / cover no-repeat;
        justify-content: flex-end;
      }
      .map-reel-wait-stage {
        font-size: 13px; letter-spacing: 0.06em; color: var(--cream);
      }
      .map-reel-wait-joke {
        font-size: 12px; line-height: 1.4; font-style: italic;
        color: var(--slate); max-width: 22em; min-height: 2.8em;
      }
      .map-card-body {
        display: flex; align-items: baseline; gap: 10px;
        padding: 10px 14px 12px;
      }
      .map-card-name { color: var(--cream); font-size: 17px; font-weight: 600; }
      .map-card.on .map-card-name { color: var(--sakura); }
      .map-card-tag {
        margin-left: auto; color: var(--mint); font-size: 11px;
        letter-spacing: 0.1em; text-transform: uppercase;
      }

      /*
       * My tracks, and the Freestyle room, which shares its card strip.
       * Each track card wears the photograph of its world.
       */
      /* The PAGE scrolls, not a box inside it. Two card strips and seven
         rows do not fit a 900 px window, and a nested scroller inside a
         screen that is already too tall is two scrollbars arguing. The
         cursor's scrollIntoView drives this one. */
      /* The bottom bar is drawn over this scroller, so its padding and the
         cursor's scroll both clear it: at 3vh alone the last row of a
         card's list scrolled to the window's edge and sat under the bar. */
      .screen-courses {
        justify-content: flex-start;
        padding-top: 4vh;
        padding-bottom: calc(var(--bar-bot) + 3vh);
        scroll-padding-bottom: calc(var(--bar-bot) + 8px);
        overflow-y: auto;
        overscroll-behavior: contain;
        pointer-events: auto;
        scrollbar-width: thin;
        scrollbar-color: rgba(232, 168, 184, 0.45) rgba(16, 22, 17, 0.55);
      }
      .screen-courses > * { flex: 0 0 auto; }
      .card-strip { width: 100%; margin-bottom: 6px; }
      .strip-label {
        margin: 10px 0 2px;
        font-size: 11px; font-weight: 700;
        letter-spacing: 0.18em; text-transform: uppercase;
        color: var(--sakura);
        text-align: center;
      }
      .screen-courses .map-cards { margin: 8px 0 2px; gap: 16px; }
      .screen-courses .map-card { width: min(236px, 82vw); }
      .screen-courses .map-card-name { font-size: 16px; }
      .course-card .map-reel { background: #0b1119; }
      .map-card-meta {
        padding: 0 14px 12px;
        color: var(--slate); font-size: 12px; letter-spacing: 0.02em;
      }
      .map-card-meta:empty { display: none; }

      .board-note {
        width: 100%; margin: 4px 0 0; text-align: center;
        color: var(--slate); font-size: 13px;
      }
      .board-note:empty { display: none; }

      /*
       * How to fly. A CONTROL, NOT AN ESSAY.
       *
       * This screen was two definition lists over a two hundred word centred
       * paragraph, and the product already owned the thing that teaches a
       * stick: the gimbal pair the flight overlay and the calibration screen
       * both draw. So the sticks here are live, fed the same channels as the
       * quad, and the prose is cut to what a picture cannot say. One source
       * at a time: a keyboard pilot does not need the radio's five lines.
       */
      .howto-lede {
        max-width: 46em; margin: 0 0 18px;
        color: rgba(235, 230, 215, 0.78);
        font-size: 15px; line-height: 1.6; text-align: center;
      }
      .howto-tabs { display: flex; gap: 8px; pointer-events: auto; }
      .howto-tab {
        appearance: none; border: 0; border-radius: 3px;
        background: rgba(16, 22, 17, 0.72);
        box-shadow: inset 0 0 0 1px rgba(244, 236, 214, 0.14);
        color: rgba(238, 232, 216, 0.72);
        font: inherit; font-size: 13px; font-weight: 650;
        letter-spacing: 0.1em; text-transform: uppercase;
        padding: 7px 16px; cursor: pointer;
      }
      .howto-tab:hover { color: var(--cream); }
      .howto-tab.on {
        background: rgba(232, 168, 184, 0.16);
        box-shadow: inset 0 0 0 1px var(--sakura);
        color: var(--cream);
      }
      .howto-body {
        display: flex; align-items: center; justify-content: center;
        gap: clamp(24px, 5vw, 64px); flex-wrap: wrap;
        margin: 22px 0 4px;
      }
      .howto-rig { display: flex; flex-direction: column; align-items: center; }
      .howto-sticks { display: flex; gap: 28px; align-items: flex-end; }
      .screen-howto .osd-gimbal-plate {
        width: clamp(96px, 12vw, 132px);
        height: clamp(96px, 12vw, 132px);
        background: rgba(12, 18, 14, 0.55);
      }
      .howto-live {
        margin-top: 12px; font-size: 12px; letter-spacing: 0.08em;
        text-transform: uppercase; color: var(--amber); text-align: center;
      }
      .howto-keys { margin: 0; max-width: 34em; min-width: min(100%, 22em); }
      .howto-keys dt { color: var(--cream); font-size: 15px; font-weight: 600; margin-top: 12px; }
      .howto-keys dt:first-child { margin-top: 0; }
      .howto-keys dd { margin: 2px 0 0; color: var(--slate); font-size: 14px; line-height: 1.5; }
      .howto-mode {
        max-width: 52em; margin: 20px auto 0;
        color: rgba(235, 230, 215, 0.62);
        font-size: 13.5px; line-height: 1.6; text-align: center;
      }
      .howto-wiki {
        display: block; margin: 14px auto 0; padding: 8px 14px;
        border: 0; border-radius: 4px; cursor: pointer; pointer-events: auto;
        background: rgba(232, 168, 184, 0.16); color: var(--cream);
        font: inherit; font-size: 14px;
      }
      .howto-wiki:hover, .howto-wiki:focus-visible {
        background: rgba(232, 168, 184, 0.28);
      }

      .cols { display: flex; gap: 6vw; flex-wrap: wrap; justify-content: center; }
      .col { max-width: 30em; }
      .col dl { margin: 0; }
      .col dt { color: var(--cream); font-size: 15px; font-weight: 600; margin-top: 12px; }
      .col dd { margin: 2px 0 0; color: var(--slate); font-size: 14px; line-height: 1.5; }
      .lede {
        max-width: 58em; margin: 24px auto 0; color: var(--slate);
        font-size: 15px; line-height: 1.65; text-align: center;
      }

      /* Credits. A race programme over the live world, not a second
         landscape. Sections are ruled like a printed page, the beta roll
         is a start list with a slot number under each face, and every
         card that names a person opens that person's channel.

         WHY THE CARD CARRIES THE HOVER AND NOT THE HEADING. credits.js
         stretches the heading anchor's ::after over the whole card, so
         the pointer is over a live target anywhere on it. If only the
         heading lit up, most of that target would look dead. Hover is
         therefore a card state, and :focus-within is the same state
         arriving by keyboard. */
      .screen-credits {
        justify-content: flex-start;
        align-items: stretch;
        overflow-y: auto;
        overscroll-behavior: contain;
        pointer-events: auto;
        padding: 5vh 4vw 4vh;
      }
      .screen-credits h2 {
        align-self: center;
        margin-bottom: 8px;
      }
      .screen-credits h2::after {
        content: "";
        display: block;
        width: 36px; height: 2px;
        background: var(--sakura);
        margin: 10px auto 0;
      }
      .credits-roll {
        width: min(760px, 94vw);
        margin: 0 auto;
        pointer-events: auto;
      }
      .credits-lede {
        max-width: 46em;
        margin: 10px auto 26px;
        color: var(--slate);
        font-size: 15px;
        line-height: 1.65;
        text-align: center;
      }
      .credit-block { margin: 0 0 26px; }
      /* The kicker's rule runs out to the margin and fades there, so a
         section reads as a band across the page rather than a label
         floating above a box. */
      .credit-kicker {
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--sakura);
        margin-bottom: 10px;
      }
      .credit-kicker::after {
        content: "";
        flex: 1 1 auto;
        height: 1px;
        background: linear-gradient(90deg, rgba(232, 168, 184, 0.42), rgba(232, 168, 184, 0));
      }
      .credit-block h3 {
        margin: 0 0 14px;
        font-size: 17px;
        font-weight: 600;
        letter-spacing: 0.01em;
        text-transform: none;
        color: var(--cream);
      }
      /* A credit list, the parks' sources: one line each and the note
         underneath. A list rather than a card each, because names on cards
         read as an advert and the point here is the credit. */
      .credit-rooms {
        background: rgba(16, 22, 17, 0.72);
        border-radius: 4px;
        border-top: 2px solid rgba(232, 168, 184, 0.28);
        box-shadow: inset 0 0 0 1px rgba(244, 236, 214, 0.10);
        padding: 14px 16px 16px;
      }
      .credit-room { margin: 0 0 6px; color: var(--cream); }
      .credit-room b { color: var(--cream); font-weight: 600; }
      .credit-room-note { margin: 12px 0 0; color: var(--slate); font-size: 14px; }
      .credit {
        position: relative;
        display: flex;
        flex-direction: column;
        gap: 10px;
        padding: 14px 16px 16px;
        margin-bottom: 10px;
        background: rgba(16, 22, 17, 0.72);
        border-radius: 4px;
        border-top: 2px solid rgba(232, 168, 184, 0.28);
        box-shadow: inset 0 0 0 1px rgba(244, 236, 214, 0.10);
      }
      /* A person card puts the face and the slot number in a left rail
         with the copy beside it. A project card keeps its mark across
         the top, because a wordmark wants the width. */
      .credit.person {
        display: grid;
        grid-template-columns: 64px 1fr;
        gap: 16px;
        align-items: start;
        padding: 16px;
      }
      /* The maker card is the one hero on the page, so it takes the
         brighter edge and the wider rail. */
      .credit.maker {
        grid-template-columns: 84px 1fr;
        padding: 20px;
        border-top-color: rgba(232, 168, 184, 0.55);
      }
      .credit.is-link {
        transition:
          transform 0.16s ease,
          border-top-color 0.16s ease,
          box-shadow 0.16s ease;
      }
      .credit.is-link:hover,
      .credit.is-link:focus-within {
        transform: translateY(-2px);
        border-top-color: var(--sakura);
        box-shadow:
          inset 0 0 0 1px rgba(244, 236, 214, 0.20),
          0 8px 20px rgba(6, 10, 7, 0.55);
      }
      .credit.is-link:focus-within {
        outline: 1px solid var(--sakura);
        outline-offset: 3px;
      }
      .credit.is-link h4 a { color: var(--cream); text-decoration: none; }
      /* The stretched anchor. Everything it covers is text, so nothing
         is buried that wanted a click of its own. The ring is on the
         card above, which is why the anchor drops its own. */
      .credit.is-link h4 a::after {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: 4px;
      }
      .credit.is-link h4 a:focus-visible { outline: none; }
      .credit-stack {
        display: grid;
        justify-items: center;
        gap: 7px;
      }
      .credit-face {
        display: block;
        width: 64px;
        height: 64px;
        border-radius: 4px;
        overflow: hidden;
        background: rgba(12, 18, 14, 0.55);
        box-shadow: 0 0 0 1px rgba(244, 236, 214, 0.16);
        transition: box-shadow 0.16s ease;
      }
      .credit.maker .credit-face { width: 84px; height: 84px; }
      .credit-face img { display: block; width: 100%; height: 100%; object-fit: cover; }
      .credit-face.is-blank {
        display: grid;
        place-items: center;
        box-shadow: inset 0 0 0 1px rgba(232, 168, 184, 0.45);
      }
      .credit-face-mark {
        color: var(--sakura);
        font-size: 17px;
        font-weight: 800;
        letter-spacing: 0.08em;
      }
      .credit.is-link:hover .credit-face,
      .credit.is-link:focus-within .credit-face {
        box-shadow: 0 0 0 1px var(--sakura);
      }
      /* The slot number is a start list's: the order they turned up, not
         a ranking. Amber because it is a reading off the page rather
         than a piece of chrome. */
      .credit-slot {
        font: 700 11px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
        letter-spacing: 0.14em;
        color: var(--amber);
      }
      .credit-row {
        display: grid;
        grid-template-columns: 1fr;
        gap: 10px;
      }
      @media (min-width: 640px) {
        .credit-row.pair { grid-template-columns: 1fr 1fr; }
      }
      /* The beta roll is one panel of ruled rows rather than four
         floating cards, because a start list is a list. Four identical
         boxes down a page say nothing about what they hold; four rows
         under one edge say these are the same kind of thing. */
      .credit-row.pilots {
        gap: 0;
        background: rgba(16, 22, 17, 0.72);
        border-radius: 4px;
        border-top: 2px solid rgba(232, 168, 184, 0.28);
        box-shadow: inset 0 0 0 1px rgba(244, 236, 214, 0.10);
        overflow: hidden;
      }
      /* A pilot row is a name, a number and a link out. Nothing is
         written under the name, so the copy sits against the middle of
         the face rather than starting level with the top of it. */
      .credit.pilot {
        margin: 0;
        padding: 14px 18px 14px 16px;
        align-items: center;
        background: none;
        border-top: 0;
        border-radius: 0;
        box-shadow: none;
      }
      .credit.pilot .credit-copy h4 { margin-bottom: 0; }
      .credit.pilot .credit-handle { margin-top: 7px; }
      .credit.pilot + .credit.pilot { border-top: 1px solid rgba(244, 236, 214, 0.09); }
      /* A row's affordance is a bar down its leading edge, not a lift: a
         row in a list has nowhere to lift to without breaking the rules
         above and below it. */
      .credit.pilot::before {
        content: "";
        position: absolute;
        left: 0;
        top: 0;
        bottom: 0;
        width: 2px;
        background: var(--sakura);
        transform: scaleY(0);
        transform-origin: 50% 0;
        transition: transform 0.16s ease;
      }
      .credit.pilot.is-link:hover,
      .credit.pilot.is-link:focus-within {
        transform: none;
        background: rgba(232, 168, 184, 0.055);
        border-top-color: rgba(244, 236, 214, 0.09);
        box-shadow: none;
      }
      .credit.pilot.is-link:hover::before,
      .credit.pilot.is-link:focus-within::before { transform: scaleY(1); }
      /* The panel clips, so the focus ring has to be drawn inside it. */
      .credit.pilot.is-link:focus-within { outline-offset: -3px; }
      .credit-logo {
        display: flex;
        align-items: center;
        justify-content: flex-start;
        min-height: 44px;
      }
      .credit-logo img, .credit-logo svg {
        display: block;
        height: 40px;
        width: auto;
        max-width: min(100%, 280px);
        object-fit: contain;
      }
      .credit-logo.light {
        background: var(--cream);
        border-radius: 4px;
        padding: 10px 14px;
        min-height: 0;
        align-self: flex-start;
      }
      .credit-logo.light img, .credit-logo.light svg { height: 32px; }
      /* The mark is the card's title, so when the fetch fails the words
         that replace it have to carry a title's weight. */
      .credit-logo-fallback {
        color: var(--cream);
        font-size: 18px;
        font-weight: 700;
        letter-spacing: 0.02em;
      }
      .credit-title {
        display: flex;
        align-items: center;
        gap: 14px;
        margin: 0;
        font-size: inherit;
        font-weight: inherit;
      }
      .credit.project { gap: 14px; }
      .credit-title a {
        display: inline-flex;
        align-items: center;
        gap: 14px;
        text-decoration: none;
        border-radius: 4px;
      }
      /* Only for a mark that is a symbol rather than a name. Claude's
         starburst does not spell anything, so the word sits beside it. */
      .credit-title-text {
        font-size: 20px;
        font-weight: 700;
        letter-spacing: 0.02em;
        color: var(--cream);
      }
      .credit-title .credit-logo {
        opacity: 0.92;
        transition: opacity 0.16s ease;
      }
      .credit-title a:hover .credit-logo,
      .credit-title a:focus-visible .credit-logo { opacity: 1; }
      .credit-title a:focus-visible {
        outline: 1px solid var(--sakura);
        outline-offset: 4px;
      }
      .maker-mark {
        font-size: 30px;
        font-weight: 800;
        letter-spacing: 0.06em;
        color: var(--cream);
        line-height: 1;
        text-shadow: 2px 2px 0 rgba(20, 28, 20, 0.82);
      }
      .maker-mark .fpv { color: var(--sakura); }
      .credit-copy h4 {
        margin: 0 0 7px;
        font-size: 18px;
        font-weight: 700;
        letter-spacing: 0.02em;
        color: var(--cream);
      }
      .credit.maker .credit-copy h4 { margin-bottom: 10px; }
      .credit-copy p {
        margin: 0;
        color: var(--slate);
        font-size: 14px;
        line-height: 1.55;
      }
      /* Where the card goes. The play triangle is drawn here rather than
         fetched, so the line can say video without borrowing anybody's
         mark to do it. */
      .credit-handle {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        margin-top: 12px;
        font: 600 12px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
        color: var(--slate);
        transition: color 0.16s ease;
      }
      .credit-handle::before {
        content: "";
        width: 0;
        height: 0;
        border-left: 8px solid currentColor;
        border-top: 5px solid transparent;
        border-bottom: 5px solid transparent;
      }
      .credit.is-link:hover .credit-handle,
      .credit.is-link:focus-within .credit-handle { color: var(--sakura); }
      .credit-copy a, .credits-legal a, .credits-lede a {
        color: var(--sakura);
        text-decoration: none;
      }
      .credit-copy a:hover, .credits-legal a:hover, .credits-lede a:hover { color: var(--cream); }
      .credits-legal {
        margin: 14px 0 6px;
        color: rgba(235, 230, 215, 0.55);
        font-size: 12px;
        line-height: 1.55;
        text-align: center;
      }
      /* Reduced motion drops the travel, never the state: the lift, the
         bar and the ring all still say the card is live, they just
         arrive without moving. */
      @media (prefers-reduced-motion: reduce) {
        .credit.is-link,
        .credit.is-link:hover,
        .credit.is-link:focus-within {
          transition: none;
          transform: none;
        }
        .credit.pilot::before { transition: none; }
      }
      /* Under about 560 the left rail costs more than the face is worth,
         so both shrink rather than the copy going to four words a line. */
      @media (max-width: 560px) {
        .credit.person {
          grid-template-columns: 52px 1fr;
          gap: 12px;
          padding: 14px;
        }
        .credit.maker { grid-template-columns: 64px 1fr; }
        .credit-face { width: 52px; height: 52px; }
        .credit.maker .credit-face { width: 64px; height: 64px; }
        .credit-face-mark { font-size: 15px; }
        .maker-mark { font-size: 24px; }
        .credit-copy h4 { font-size: 17px; }
      }
      .screen-credits .menu-stage {
        width: min(760px, 94vw);
        margin: 12px auto 0;
        display: block;
      }
      .screen-credits .menu {
        min-width: 0;
        width: 100%;
        margin-top: 0;
      }
      .screen-credits .hint { margin-left: auto; margin-right: auto; }

      .screen-modal { background: rgba(12, 18, 14, 0.72); }

      /* Finish. Same HUD hole as the title: the frozen craft and the
         course sit in the open side, the times own the left (or the
         bottom on a phone). */
      .screen-results {
        display: flex;
        flex-direction: column;
        align-items: stretch;
        justify-content: stretch;
        width: 100%;
        height: 100%;
        padding: 4.5vh 4vw 3vh;
        background:
          linear-gradient(90deg, rgba(12, 18, 14, 0.84) 0%, rgba(12, 18, 14, 0.50) 28%, rgba(12, 18, 14, 0.10) 54%, rgba(12, 18, 14, 0.12) 100%),
          linear-gradient(180deg, rgba(12, 18, 14, 0.28) 0%, transparent 22%, transparent 64%, rgba(12, 18, 14, 0.40) 100%);
      }
      .results-copy {
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        width: min(38em, 46vw);
        height: 100%;
        min-width: 0;
        min-height: 0;
        z-index: 1;
        align-self: flex-start;
      }
      .results-top { min-height: 0; }
      .results-kicker {
        display: flex; align-items: center; gap: 12px;
        font-size: clamp(13px, 1.4vw, 16px); color: #d8d2c0;
        letter-spacing: 0.28em; text-transform: uppercase;
        text-shadow: 0 1px 8px rgba(0, 0, 0, 0.75);
      }
      .results-kicker:empty { display: none; }
      .results-kicker::before {
        content: "";
        width: 36px; height: 2px; flex: 0 0 auto;
        background: var(--sakura);
      }
      .screen-results .results-head {
        margin: 14px 0 0; font-size: clamp(22px, 3.2vw, 36px); font-weight: 700;
        letter-spacing: 0.04em; color: var(--cream);
        text-shadow: 2px 2px 0 rgba(20, 28, 20, 0.82), 0 8px 22px rgba(0, 0, 0, 0.32);
      }
      .screen-results.is-record .results-head { color: var(--mint); }
      .results-hero { margin-top: 10px; }
      .screen-results.is-empty .results-hero { display: none; }
      .results-hero-cap {
        font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase;
        color: var(--slate);
      }
      .results-hero-time {
        margin-top: 2px;
        font-size: clamp(56px, 9vw, 112px); font-weight: 800;
        letter-spacing: 0.02em; line-height: 0.92; color: var(--cream);
        text-shadow: 3px 3px 0 rgba(20, 28, 20, 0.82), 0 10px 28px rgba(0, 0, 0, 0.32);
      }
      .screen-results.is-record .results-hero-time {
        color: var(--mint);
        text-shadow: 3px 3px 0 rgba(20, 28, 20, 0.82), 0 0 32px rgba(125, 255, 180, 0.28);
      }
      .results-hero-meta {
        margin-top: 10px; font-size: 15px; color: var(--slate);
        letter-spacing: 0.03em;
        text-shadow: 0 1px 8px rgba(0, 0, 0, 0.65);
      }
      .results-hero-meta.gain { color: var(--mint); }
      .results-hero-meta.off { color: var(--sakura); }
      .results {
        min-width: 0; width: 100%;
        margin: 18px 0 0;
        max-height: min(calc(32vh - var(--bars)), 16em);
        overflow-y: auto;
        overscroll-behavior: contain;
        scrollbar-width: thin;
        scrollbar-color: rgba(232, 168, 184, 0.45) rgba(16, 22, 17, 0.55);
      }
      .results-empty {
        margin: 0; color: var(--slate); font-size: 15px; line-height: 1.55;
        max-width: 34em;
      }
      /* One line about the ghost that was chased, under the lap rows. Mint
         for the same reason the ghost itself is: it is a record, flying. */
      .results-ghost {
        margin: 10px 0 0; color: var(--mint); font-size: 14px; line-height: 1.5;
      }
      .result-row {
        padding: 8px 0 10px;
        border-bottom: 1px solid rgba(244, 236, 214, 0.12);
      }
      .result-main {
        display: flex; align-items: baseline; gap: 12px; font-size: 18px;
      }
      .result-label { color: var(--slate); min-width: 4.6em; }
      .result-time { color: var(--cream); font-weight: 600; margin-left: auto; }
      .result-tag { color: var(--mint); font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; }
      .result-row.void .result-time { color: #93a7ba; font-weight: 400; }
      .result-why { color: #7f95ab; font-size: 12px; letter-spacing: 0.06em; max-width: 16em; }
      .result-row.total { border-bottom: none; margin-top: 4px; }
      .result-row.total .result-time { color: var(--sakura); }
      .result-bar {
        height: 3px; margin-top: 7px; border-radius: 2px;
        background: rgba(12, 18, 14, 0.55);
        box-shadow: inset 0 0 0 1px rgba(157, 179, 200, 0.22);
        overflow: hidden;
      }
      .result-bar-fill {
        height: 100%; width: 0; background: rgba(243, 234, 212, 0.55);
      }
      .result-row.fastest .result-bar-fill { background: var(--mint); }
      .results-note {
        margin: 14px 0 0; color: rgba(235, 230, 215, 0.72);
        font-size: 13.5px; line-height: 1.55; max-width: 34em;
        text-shadow: 0 1px 8px rgba(0, 0, 0, 0.65);
      }
      .results-note:empty { display: none; }
      .results-foot {
        display: flex;
        flex-direction: column;
        align-items: stretch;
        justify-content: flex-end;
        gap: 14px;
        width: 100%;
        margin-top: auto;
        position: relative;
      }
      .screen-results .menu-stage {
        display: block;
        position: static;
        width: 100%;
        margin-top: 0;
        flex: 0 0 auto;
      }
      .screen-results .menu {
        min-width: 0; width: 100%; margin-top: 0;
        background: rgba(16, 22, 17, 0.55);
      }
      .screen-results .menu-scroll { max-height: min(calc(34vh - var(--bars)), 16em); }
      .screen-results .menu-help {
        position: absolute;
        left: 0; right: 0; bottom: 100%;
        width: auto; max-width: none;
        margin: 0; padding: 0 4px 10px;
        height: auto; text-align: left; border: none;
        overflow: visible; pointer-events: none;
        grid-column: auto; grid-row: auto;
        text-shadow: 0 1px 8px rgba(0, 0, 0, 0.65);
      }
      .screen-results .menu-help:empty { padding: 0; }
      @keyframes results-rise {
        from { opacity: 0; transform: translateY(12px); }
        to { opacity: 1; transform: none; }
      }
      .screen-results.is-in .results-top {
        animation: results-rise 0.48s ease both;
      }
      @media (prefers-reduced-motion: reduce) {
        .screen-results.is-in .results-top { animation: none; }
      }
      @media (max-width: 860px) {
        .screen-results {
          padding: 2.6vh 4.5vw 2vh;
          background:
            linear-gradient(180deg, rgba(12, 18, 14, 0.28) 0%, rgba(12, 18, 14, 0.08) 18%, rgba(12, 18, 14, 0.10) 42%, rgba(12, 18, 14, 0.88) 100%);
        }
        .results-copy { width: 100%; }
        .results-hero-time { font-size: clamp(44px, 16vw, 76px); }
        .results { max-height: min(22vh, 10em); }
        .screen-results .menu-scroll { max-height: min(28vh, 12em); }
      }
      @media (max-height: 520px) {
        .screen-results .results-kicker,
        .screen-results .results-note,
        .screen-results .results-hero-cap {
          display: none;
        }
        .results-hero-time { font-size: clamp(36px, 12vh, 56px); }
        .results { max-height: min(18vh, 7em); }
        .screen-results .menu-scroll { max-height: min(36vh, 9em); }
      }

      /* Loading. This markup is STATIC, and that is the point: it paints on
         the first layout, before the import map has resolved a single module,
         so the three.js fetch is a stage the player can see rather than a
         blank page. src/ui/loading.js only ever writes into it.

         THE PICTURE IS THE GAME'S. assets/loading/ is a frame of the Itaipu
         map at sunset with a war Striker banking past the spillway,
         rendered by the shell itself (scripts/loading-art.js) and graded
         (tools/loading-art/grade.py). Its own file for a phone's portrait,
         composed on its own, because no crop of the wide frame holds both
         the Striker and the dam. The colour under it is the frame's own
         darkest tone, so the screen reads as finished before the picture
         lands and does not flash when it does: the preload in the head
         starts it early, and nothing on this screen waits for it. */
      #loading {
        position: fixed; inset: 0; z-index: 10;
        background: #0c0e0d url("assets/loading/wide.webp") 30% 50% / cover no-repeat;
        font-family: var(--ui-font); color: var(--cream);
        font-variant-numeric: tabular-nums;
        transition: opacity 0.3s ease;
      }
      /* The grade the type needs and the picture does not: the right hand
         third and the foot darkened under the words, the rest left as
         rendered. */
      #loading::before {
        content: ""; position: absolute; inset: 0; pointer-events: none;
        background:
          linear-gradient(90deg, rgba(8, 10, 9, 0) 34%, rgba(8, 10, 9, 0.52) 64%, rgba(8, 10, 9, 0.74) 100%),
          linear-gradient(0deg, rgba(8, 10, 9, 0.62) 0%, rgba(8, 10, 9, 0) 34%);
      }
      #loading[hidden] { display: none; }
      /*
       * One column on the right, over the dam and the sky, clear of the
       * Striker on the left: the name in the middle of it and the load at
       * its foot. It scrolls only while the failure panel is open (below),
       * because a scroller clips sideways too and would cut the slash.
       */
      .loading-col {
        position: absolute; top: 0; bottom: 0; right: 6vw;
        width: min(40vw, 700px);
        display: flex; flex-direction: column;
        padding: 7vh 0 7vh; box-sizing: border-box;
      }
      /* The name (the .lockup rules), in the middle of the column, sized
         to its width: COMBAT, the widest line, is about 3.9 of its em. */
      .loading-brand { margin: auto 0; }
      #loading .lockup { font-size: clamp(56px, 8.5vw, 170px); }
      .loading-tag {
        margin-top: 1.6em;
        font-size: clamp(11px, 0.9vw, 16px); font-weight: 500; line-height: 1;
        letter-spacing: 0.3em; text-transform: uppercase; white-space: nowrap;
        color: rgba(243, 234, 212, 0.7);
        text-shadow: 0 1px 8px rgba(0, 0, 0, 0.6);
      }
      .loading-status { width: 100%; }
      .loading-row {
        display: flex; align-items: baseline; justify-content: space-between;
        gap: 14px;
      }
      .loading-stage {
        font-size: clamp(12px, 0.72vw, 14px); font-weight: 600; line-height: 1.35;
        letter-spacing: 0.2em; text-transform: uppercase;
        color: var(--cream);
        text-shadow: 0 1px 6px rgba(0, 0, 0, 0.7);
      }
      .loading-joke {
        margin-top: 12px; font-size: clamp(14px, 0.86vw, 17px); line-height: 1.45;
        font-style: italic; color: rgba(214, 222, 228, 0.78);
        min-height: 2.9em;
        text-shadow: 0 1px 6px rgba(0, 0, 0, 0.7);
      }
      /* The failure panel. Only ever painted by fail(), which is why it
         carries its own type sizes rather than inheriting the calm ones
         above: this is the one moment the screen has to be read rather
         than glanced at. */
      .loading-help {
        margin-top: 20px; text-align: left;
        padding: 16px 18px; border-radius: 4px;
        background: rgba(8, 10, 9, 0.82);
        color: var(--cream); font-size: 14.5px; line-height: 1.55;
      }
      .loading-help h3 {
        margin: 0 0 10px; font-size: 13px; font-weight: 700;
        letter-spacing: 0.14em; text-transform: uppercase; color: var(--amber);
      }
      .loading-help ol { margin: 0; padding-left: 1.3em; }
      .loading-help li { margin-bottom: 9px; }
      .loading-help li:last-child { margin-bottom: 0; }
      .loading-help b { color: var(--cream); font-weight: 700; }
      .loading-help .loading-why {
        margin: 0 0 14px; color: var(--slate);
      }
      .loading-help .loading-detail {
        margin-top: 16px; padding-top: 12px;
        border-top: 1px solid rgba(244, 236, 214, 0.16);
        font-family: ui-monospace, "SFMono-Regular", Menlo, monospace;
        font-size: 11.5px; color: #7f9188; word-break: break-word;
      }
      .loading-actions { display: flex; gap: 10px; margin-top: 18px; flex-wrap: wrap; }
      .loading-actions button {
        font: inherit; font-size: 14.5px; font-weight: 700;
        padding: 10px 20px; border: 0; border-radius: 3px; cursor: pointer;
        background: var(--mint); color: var(--deep);
      }
      .loading-actions button.quiet {
        background: transparent; color: var(--cream); font-weight: 600;
        box-shadow: inset 0 0 0 1px rgba(244, 236, 214, 0.3);
      }
      .loading-actions button:focus-visible {
        outline: 2px solid var(--cream); outline-offset: 2px;
      }
      .loading-joke.is-error {
        font-style: normal; color: #ff8f8f;
      }
      .loading-track {
        position: relative;
        width: 100%; height: 2px;
        margin-top: 10px;
        background: rgba(243, 234, 212, 0.16);
        overflow: hidden;
      }
      /*
       * TRANSFORM, NOT WIDTH, AND IT IS THE WHOLE FIX.
       *
       * Building a world is seconds of synchronous work on the main thread:
       * about nineteen thousand meshes for the town, every sign and fascia
       * painted with Canvas2D as it goes. While that runs, nothing driven
       * from JavaScript moves and neither does a width transition, because
       * width is layout and layout is the main thread's. So the bar sat at
       * the end of the last cheap stage, and then jumped to full when the
       * thread came back. Reported, in those words: fifteen percent for a
       * while and then straight to a hundred.
       *
       * A transform transition is composited. It keeps running through a
       * blocked main thread, which is exactly the window where a loading
       * screen has to prove it is alive. See aim() in src/ui/loading.js for
       * what it is aimed at and why it never reaches the end of a stage it
       * cannot measure.
       */
      .loading-fill {
        position: absolute; inset: 0;
        transform: scaleX(0);
        transform-origin: left center;
        background: var(--cream);
        transition: transform 0.18s linear;
        will-change: transform;
      }
      /*
       * The sweep. It says nothing about progress and is not pretending to:
       * it says the page is still alive, which during a blocked second is
       * the only true thing there is to say. Same argument, same mechanism
       * and same reason as the landing page's boot sweep.
       */
      .loading-sweep {
        position: absolute; inset: 0;
        background: linear-gradient(90deg,
          transparent, rgba(243, 234, 212, 0.55), transparent);
        transform: translateX(-100%);
        animation: loading-sweep 1.35s linear infinite;
        will-change: transform;
      }
      @keyframes loading-sweep { to { transform: translateX(100%); } }
      /*
       * What is happening, how far through the load it is, and how long it
       * has taken. The step count is what gives the wait a shape: a stage
       * that outstays its slot is still one of six, and the next one is
       * still coming. The seconds stop counting while the thread is blocked
       * and catch up when it returns, which is honest and is why the bar
       * and the sweep are the ones carrying that window.
       */
      .loading-meta {
        display: flex; gap: 10px; align-items: baseline; flex: none;
        font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase;
        color: rgba(214, 222, 228, 0.7);
        text-shadow: 0 1px 6px rgba(0, 0, 0, 0.7);
      }
      .loading-meta .loading-elapsed { color: rgba(214, 222, 228, 0.48); }
      @media (prefers-reduced-motion: reduce) {
        /* The sweep is decoration and goes. The fill is not: it is the one
           thing on this screen carrying how far through the load we are, so
           it keeps its transition. */
        .loading-sweep { animation: none; opacity: 0; }
      }
      /* A failure is read, not glanced at: the name steps back to make the
         room the steps need. */
      #loading.is-failed .loading-col { overflow-y: auto; scrollbar-width: none; }
      #loading.is-failed .loading-brand { margin: 0 0 4vh; }
      #loading.is-failed .loading-tag { display: none; }
      #loading.is-failed .lockup { font-size: clamp(36px, 4vw, 60px); }
      /*
       * A phone, or any window taller than it is wide: the portrait frame,
       * the name over the sky at the top, the load at the foot, both the
       * full width less a thumb's margin.
       */
      @media (max-aspect-ratio: 4/5) {
        #loading { background-image: url("assets/loading/tall.webp"); background-position: 50% 50%; }
        #loading::before {
          background:
            linear-gradient(180deg, rgba(8, 10, 9, 0.62) 0%, rgba(8, 10, 9, 0) 30%),
            linear-gradient(0deg, rgba(8, 10, 9, 0.86) 0%, rgba(8, 10, 9, 0.5) 22%, rgba(8, 10, 9, 0) 40%);
        }
        .loading-col {
          left: max(22px, env(safe-area-inset-left)); right: max(22px, env(safe-area-inset-right)); width: auto;
          padding: max(8vh, env(safe-area-inset-top)) 0 max(5vh, env(safe-area-inset-bottom));
        }
        .loading-brand { margin: 0 0 auto; }
        /* Over the sky and clear of the Striker below it, which is why
           the tagline sits this one out. */
        #loading .lockup { font-size: clamp(44px, 15vw, 100px); }
        .loading-tag { display: none; }
      }
      /* A landscape phone: the column is short, so the name shrinks rather
         than pushing the bar off the bottom. */
      @media (max-height: 520px) and (min-aspect-ratio: 4/5) {
        .loading-col { padding: 4vh 0; }
        #loading .lockup { font-size: clamp(40px, 13vh, 72px); }
        .loading-joke { min-height: 0; }
      }

      /* Discard, on the unsaved guard. The only button in this product

      .name-dialog-btn.danger { color: #ff8f8f; border-color: rgba(255, 143, 143, 0.35); }

      .name-dialog-btn:focus-visible { outline: 2px solid var(--cream); outline-offset: 2px; }

      .name-dialog-box.campaign-box {

      }

      .name-dialog:has(.campaign-box) {

      /*
       * The flight feel question's answers are CHIPS, not a select, because
       * the whole form is meant to be answered in two clicks and a select
       * hides its options behind one of them. Same surface treatment as the
       * dialog inputs; the chosen chip goes mint like the Send button, so
       * "chosen" and "go" read as the same colour system.

      .feel-chips {
        display: flex; flex-wrap: wrap; gap: 6px;
        margin: 8px 0 4px;
      }
      .feel-chip {
        appearance: none; border: 1px solid rgba(244, 236, 214, 0.16);
        background: #121a14; color: var(--cream); font: inherit;
        font-size: 13px; padding: 6px 11px; border-radius: 999px;
        cursor: pointer;
      }
      .feel-chip:hover { border-color: var(--sakura); }
      .feel-chip.on {
        background: var(--mint); border-color: var(--mint);
        color: var(--deep); font-weight: 600;
      }
      /*
         The answer to "throttle is touchy", shown when that chip is ticked
         and the pilot has no throttle limit on. Amber because it is an
         instrument reading rather than a record: it is telling the pilot a
         number about their own quad, which is what amber is for everywhere
         else on this page.
      */
      .feel-hint {

        padding: 2px 0 2px 10px; margin: 8px 0 2px;

      /*
         Screenshots on a report (src/ui/bugshots.js). The dashed box is the
         place to click before Ctrl+V, and it lights sakura like a focused
         input when it has focus or a file is dragged over. Each image is a
         chip like the feel chips, with its thumbnail, its [Image n] and an
         x; a chip still being shrunk for the board is dimmed.
      */
      .shot-drop {
        display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px;
        margin: 8px 0 4px; padding: 10px 12px;
        border: 1px dashed rgba(244, 236, 214, 0.28); border-radius: 4px;
        background: #121a14; color: var(--slate); font-size: 13px;
        cursor: text;
      }
      .shot-drop:focus, .shot-drop.over { outline: none; border-color: var(--sakura); color: var(--cream); }
      .shot-drop-text { flex: 1 1 16em; }
      .shot-pick {
        appearance: none; border: 1px solid rgba(244, 236, 214, 0.16);
        background: transparent; color: var(--cream); font: inherit; font-size: 12px;
        padding: 5px 10px; border-radius: 4px; cursor: pointer;
      }
      .shot-pick:hover { border-color: var(--sakura); }
      .shot-chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0 0; }
      .shot-chip {
        display: inline-flex; align-items: center; gap: 6px;
        padding: 3px 4px 3px 3px; border-radius: 999px;
        border: 1px solid rgba(244, 236, 214, 0.16); background: #121a14;
        color: var(--cream); font-size: 13px;
      }
      .shot-chip.pending { opacity: 0.55; }
      .shot-thumb {
        width: 28px; height: 28px; object-fit: cover; border-radius: 999px;
        background: rgba(244, 236, 214, 0.08);
      }
      .shot-x {

        font: inherit; font-size: 16px; line-height: 1; padding: 0 6px; cursor: pointer;

      .shot-err { min-height: 0; margin: 4px 0 0; color: #ff8f8f; font-size: 12px; }
      .shot-err:empty { display: none; }
      /*
         THE FLOATING CHIPS. Report bug in the first slot on every screen
         but the title, Pause in the second and only in flight.

         THE NAME IS WRONG AND IT STAYS. Three buttons wear this class and
         only one of them is the bug chip, so it was renamed to
         .corner-chip, and that rename broke the shell twice for a live
         pilot. Behind Cloudflare, fdfpv.example serves this file with
         max-age=0 and src/ui/ui.js with max-age=14400: the stylesheet
         updates on the next request and the script is four hours behind
         it. A class name is the contract between the two halves, so a
         renamed one leaves every chip in the old script with no rule at
         all, which drops three absolutely positioned buttons into document
         flow at the top left of a race.

         The whole JS graph is cached together, so it stays consistent with
         itself; HTML and CSS against JS is the one seam that can split. Do
         not rename a class the shell writes from script unless the browser
         cache TTL on that host has been fixed first.
      */
      .bug-chip {
        position: absolute; top: 16px; right: 16px; z-index: 7;
        pointer-events: auto;
        appearance: none; border: 1px solid rgba(232, 168, 184, 0.45);
        background: rgba(16, 22, 17, 0.82); color: var(--cream);
        font: 600 12px/1 var(--ui-font); letter-spacing: 0.06em;
        padding: 8px 12px; border-radius: 4px; cursor: pointer;
        box-shadow: 0 8px 18px rgba(0, 0, 0, 0.35);
      }
      /* Live flight: same corner, a shade quieter so the FPV frame still
         reads, still a real button. */
      .bug-chip.on-flight {
        background: rgba(16, 22, 17, 0.55);
        text-shadow: 0 1px 4px rgba(0, 0, 0, 0.85);
      }
      .bug-chip:hover { border-color: var(--sakura); color: var(--sakura); }
      .bug-chip[hidden] { display: none; }

      /* Music skip. Tiny, out of the FPV instruments. Menus park it at the
         top right, over the open world rather than over the list; it had
         the second slot there while the bug chip had the first, and it has
         the corner now. Flight puts it top left, away from the timer, the
         pack, and Pause. Buttons never take focus, so a click cannot steal
         Space from throttle. */
      /* The corner when nothing is above it, the second slot when the bug
         chip is. syncChips sets the class, because which screen carries the
         chip is a fact about the shell and not about the stylesheet. */
      .music-dock {
        position: absolute; right: 16px; top: 16px; z-index: 6;
        display: flex; align-items: center; gap: 4px;
        pointer-events: auto;
        padding: 3px 6px 3px 3px; border-radius: 4px;
        background: rgba(16, 22, 17, 0.50);
        box-shadow: inset 0 0 0 1px rgba(244, 236, 214, 0.16);
        text-shadow: 0 1px 4px rgba(0, 0, 0, 0.85);
      }

      /*
       * THE FLOATING CHIPS CLEAR THE STATUS BAR, ON EVERY WINDOW.
       *
       * The bug chip is fixed 16 px from the top right and the status bar's
       * context chips sit in the same corner. This used to be a max-width
       * 860 px rule, on the reading that only a phone was tight enough for
       * them to collide. That was wrong, and the width was never the
       * condition: the bar is 48 px tall and the chip spans 16 to 46, so
       * they overlap at EVERY width. Measured on a laptop at 1600 and at
       * 1280, the chip covered 125 px of "Flying 2022 AU Nationals", which
       * is the one thing in that corner a pilot actually wants to read.
       *
       * Nothing is hidden. The bar keeps the corner, because what you are
       * flying is worth more than a button that has a row on the title and
       * a key of its own, and the two floating chips drop below it.
       *
       * `bar-shown` is set in ui.js beside `frameTop.hidden`, so the chips
       * only move when there is something to move for: the title screen and
       * a live flight have no bar and keep the chip at 16 px. Reading
       * --bar-top alone would not do, because it stays 48 px on the title
       * where the bar is hidden.
       *
       * These have to sit AFTER the rules they override. Both are one class
       * deep, so source order decides, and the first draft of the old
       * version of this lived two thousand lines earlier and did nothing.
       */
      .bar-shown .bug-chip { top: calc(var(--bar-top) + 8px); }
      .bar-shown .music-dock { top: calc(var(--bar-top) + 8px); }
      .music-dock.under-chip { top: 52px; }
      .bar-shown .music-dock.under-chip { top: calc(var(--bar-top) + 44px); }
      /* The sign in chip's own slot, one below the music dock's: see the
         comment where .signin-chip is built for the two corners it moves
         between. This is the far one, under a bug chip already there. */
      .bar-shown .signin-chip { top: calc(var(--bar-top) + 80px); }

      /*
       * PAUSE, under the bug chip, at the same right edge and in the same
       * chip family. Exactly where src/input/touchsticks.js puts the one it
       * mounts for a thumb, so the layout is one layout whichever way you
       * are flying, and hidden when that overlay is up so there is never a
       * pair of them. Quieter than the bug chip only in that it is shorter:
       * this is the button that gets a pilot out of a map, so it is a real
       * button and not a hint.
       */
      .pause-chip { top: 52px; }
      .pause-chip[hidden] { display: none; }
      .touch-fly-on .pause-chip { display: none; }
      /* The swap in place, under Pause, the same chip. The thumb sticks
         mount their own at the same spot. */
      .swap-chip { top: 88px; }
      .swap-chip[hidden] { display: none; }
      .touch-fly-on .swap-chip { display: none; }
      .touch-fly .touch-swap { top: 88px; }

      /*
       * SIGN IN, the bug chip's mirror image: see the long comment in
       * ui.js where it is built. Never in flight, so it never has to
       * share a corner with Pause or the swap chip, and shown on the
       * title, where the bug chip is not. Third slot by default, under
       * the bug chip and the music dock; first slot (16px, no bar-shown
       * variant needed because the title never shows the bar) on the one
       * screen with no bug chip to share it with. syncChips sets which.
       */
      .signin-chip { top: 88px; }
      .signin-chip.first-slot { top: 16px; }
      .signin-chip[hidden] { display: none; }

      /* A newer deploy is out: src/ui/update.js. Bottom centre over the
         command bar, away from the chip stack in the top right, in the same
         chip family. Menus and Paused only; syncChips hides it in flight. */
      .update-bar {
        position: absolute; left: 50%; bottom: calc(var(--bar-bot) + 12px); z-index: 7;
        transform: translateX(-50%); max-width: calc(100% - 32px); box-sizing: border-box;
        display: flex; align-items: center; gap: 12px;
        pointer-events: auto;
        border: 1px solid rgba(232, 168, 184, 0.45);
        background: rgba(16, 22, 17, 0.9); color: var(--cream);
        font: 600 12px/1.3 var(--ui-font); letter-spacing: 0.06em;
        padding: 6px 6px 6px 14px; border-radius: 4px;
        box-shadow: 0 8px 18px rgba(0, 0, 0, 0.35);
      }
      .update-bar[hidden] { display: none; }
      /* The room's bar (src/ui/ui.js setRoomBar) sits over the update bar,
       * so both can be up at once. */
      .room-bar { bottom: calc(var(--bar-bot) + 58px); border-color: rgba(168, 214, 232, 0.5); }
      .room-bar .update-reload[hidden] { display: none; }
      .update-reload {
        appearance: none; border: 1px solid var(--sakura); border-radius: 3px;
        background: transparent; color: var(--sakura); cursor: pointer;
        font: inherit; padding: 5px 10px;
      }
      .update-reload:hover { background: var(--sakura); color: #101611; }

      /*
       * THE AIRCRAFT PICKER (src/ui/carousel.js). The models are drawn in
       * the canvas UNDER all of this (src/render/carousel3d.js), so the
       * stage is a hole: no background on it or on anything over it, and
       * every other part of the UI hidden while it is up so nothing sits
       * in front of the models. The dimming of the world is the canvas's
       * too, for the same reason.
       */
      #ui.carousel-open > :not(.carousel) { visibility: hidden; }
      .carousel {
        position: absolute; inset: 0; z-index: 9;
        display: flex; justify-content: center;
        pointer-events: auto; user-select: none;
        font-family: var(--ui-font); color: var(--cream);
      }
      .carousel[hidden] { display: none; }
      .carousel-panel {
        display: grid; grid-template-rows: auto minmax(150px, 1fr) auto auto;
        width: min(1080px, 100%); box-sizing: border-box; gap: 10px;
        padding: max(18px, env(safe-area-inset-top)) 16px max(18px, env(safe-area-inset-bottom));
      }
      .carousel-head {
        display: flex; align-items: center; justify-content: space-between;
        gap: 12px; flex-wrap: wrap;
      }
      .carousel-title {
        font-size: clamp(20px, 2.8vw, 28px); font-weight: 700; letter-spacing: 0.01em;
        text-shadow: 0 2px 10px rgba(0, 0, 0, 0.6);
      }
      .carousel-tabs {

      .carousel-tab-mine { position: relative; margin-left: 9px; }

      .carousel-mine-tools { margin-top: 8px; }
      .carousel-mine-form { display: flex; flex-direction: column; align-items: center; gap: 8px; }

        padding: 8px 14px; border-radius: 999px; text-shadow: none;

      .carousel-mine-ask { margin: 0; font-size: 18px; font-weight: 700; }

      .carousel-name-field {

        font: 700 clamp(18px, 2.6vw, 26px)/1.2 var(--ui-font); color: var(--cream);

      .carousel-arrow {
        position: absolute; top: 50%; transform: translateY(-50%);

      .carousel-facts { display: flex; justify-content: center; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
      .carousel-fact {
        font: 600 13px/1 var(--ui-font); letter-spacing: 0.04em; color: var(--amber);

        padding: 12px 30px; border-radius: 999px; cursor: pointer;

      .carousel-back:hover { border-color: var(--cream); }

      /* In flight: a band across the lower part of the paused picture, so the
         pilot still sees where they are and which way they face. */
      .carousel.compact { align-items: flex-end; }
      .carousel.compact .carousel-panel {
        grid-template-rows: auto minmax(120px, 36vh) auto auto; gap: 6px;
        padding-top: 12px;

      }

        .carousel-choose, .carousel-back { padding: 11px 18px; }

      /*
       * THE HANGAR (src/ui/hangar.js). The plane and its set are drawn in the
       * canvas under all of this (src/render/carousel3d.js, hangarstage.js),
       * opaque, so the stage is a hole and the rest of the UI is hidden while
       * it is up. The side panel is the one solid thing, a dark glass card.
       *
       * Motion is short and springy and never a hard cut: the header drops
       * in, the panel slides in, its tiles pop in one after another, a tab
       * slides its content across, a swatch springs up under the cursor. The
       * springs are one curve, --hg-spring; a pilot who asks the system for
       * less motion gets none of it.
       */
      #ui.hangar-open > :not(.hangar) { visibility: hidden; }
      .hangar {
        --hg-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
        --hg-ease: cubic-bezier(0.2, 0.9, 0.25, 1);
        position: absolute; inset: 0; z-index: 9;
        display: flex; justify-content: center;
        pointer-events: auto; user-select: none;
        font-family: var(--ui-font); color: var(--cream);
      }
      .hangar[hidden] { display: none; }
      .hangar-panel {
        display: grid; grid-template-rows: auto minmax(0, 1fr) auto;
        width: min(1320px, 100%); height: 100%; box-sizing: border-box; gap: 14px;
        padding: max(20px, env(safe-area-inset-top)) 20px max(14px, env(safe-area-inset-bottom));
      }
      .hangar-head {
        display: flex; align-items: flex-end; justify-content: space-between;
        gap: 12px; flex-wrap: wrap; text-shadow: 0 2px 12px rgba(0, 0, 0, 0.7);
      }
      .hangar-title {
        display: flex; align-items: center; gap: 10px;
        font: 700 12px/1 var(--ui-font); letter-spacing: 0.24em; text-transform: uppercase; color: var(--amber);
      }
      .hangar-title::before {
        content: ""; width: 22px; height: 2px; border-radius: 1px; background: var(--amber);
      }
      .hangar-name {
        margin-top: 8px; font-size: clamp(28px, 4vw, 46px); font-weight: 800; letter-spacing: 0.005em; line-height: 1;
      }
      .hangar-facts { justify-content: flex-start; margin-top: 12px; }
      /* The Floats toggle, a pill beside the span and the weight: outlined
         off, filled on. */
      .hangar-floats {
        display: inline-flex; align-items: center; gap: 8px; cursor: pointer;
        font: 600 13px/1 var(--ui-font); letter-spacing: 0.04em; color: var(--cream);
        padding: 6px 12px; border-radius: 999px;
        background: rgba(12, 18, 14, 0.55); border: 1px solid rgba(243, 234, 212, 0.45);
      }
      .hangar-floats::before {
        content: ''; width: 22px; height: 12px; border-radius: 999px;
        background: rgba(243, 234, 212, 0.25) radial-gradient(circle at 6px 6px, var(--cream) 4px, transparent 5px);
        transition: background-color 160ms;
      }
      .hangar-floats.on { color: var(--amber); border-color: rgba(255, 212, 92, 0.7); }
      .hangar-floats.on::before { background: var(--amber) radial-gradient(circle at 16px 6px, #10160f 4px, transparent 5px); }
      .hangar-floats:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
      /* The picker's switch is built once and hidden on a card with no float
         version; inline-flex above would otherwise outrank [hidden]. */
      .hangar-floats[hidden] { display: none; }
      .hangar-tabs { position: relative; }
      .hangar-tab-pill {
        position: absolute; top: 3px; left: 3px; height: calc(100% - 6px); width: 0;
        border-radius: 999px; background: var(--cream);
        box-shadow: 0 2px 12px rgba(243, 234, 212, 0.25);
        transition: transform 360ms var(--hg-spring), width 360ms var(--hg-spring);
      }
      .hangar-tabs .hangar-tab-btn { position: relative; z-index: 1; padding: 10px 22px; font-size: 14px; transition: color 200ms; }
      .hangar-tabs .hangar-tab-btn.on { background: transparent; color: var(--deep); }
      .hangar-body {
        display: grid; grid-template-columns: minmax(0, 1fr) minmax(320px, 410px);
        gap: 20px; min-height: 0;
      }
      .hangar-stage { position: relative; min-height: 0; cursor: grab; }
      .hangar-stage:active { cursor: grabbing; }
      .hangar-side {
        min-height: 0; overflow-y: auto; overflow-x: hidden; box-sizing: border-box; padding: 16px 18px 18px;
        border-radius: 16px;
        background: linear-gradient(180deg, rgba(22, 30, 24, 0.9), rgba(10, 14, 11, 0.92));
        border: 1px solid rgba(243, 234, 212, 0.12);
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(243, 234, 212, 0.06);
        scrollbar-width: thin; scrollbar-color: rgba(243, 234, 212, 0.25) transparent;
        scroll-behavior: smooth;
      }
      .hangar-tab.from-right { animation: hg-from-right 320ms var(--hg-ease) both; }
      .hangar-tab.from-left { animation: hg-from-left 320ms var(--hg-ease) both; }
      .hangar-h {
        display: flex; align-items: center; gap: 10px;
        margin: 20px 0 10px; font: 700 11px/1 var(--ui-font); letter-spacing: 0.18em;
        text-transform: uppercase; color: var(--slate);
      }
      .hangar-h::after { content: ""; flex: 1; height: 1px; background: rgba(157, 179, 200, 0.18); }
      .hangar-tab > .hangar-h:first-child { margin-top: 2px; }
      .hangar-schemes { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
      .hangar-scheme, .hangar-card {
        appearance: none; text-align: left; display: flex; flex-direction: column; gap: 8px;
        padding: 10px 11px; border-radius: 11px; cursor: pointer; color: var(--cream);
        border: 1px solid rgba(243, 234, 212, 0.14); background: rgba(243, 234, 212, 0.035);
        font: 600 13px/1.25 var(--ui-font);
        transition: transform 240ms var(--hg-spring), border-color 160ms, background 160ms;
      }
      .hangar-scheme:hover, .hangar-card:hover, .hangar-scheme:focus-visible, .hangar-card:focus-visible {
        transform: translateY(-2px); border-color: rgba(243, 234, 212, 0.5); background: rgba(243, 234, 212, 0.07);
      }
      .hangar-scheme.on, .hangar-card.on {
        border-color: var(--mint); background: rgba(125, 255, 180, 0.1);

      }

      }
      .hangar-strip-bar { flex: 1; }
      .hangar-strip-bar.film, .hangar-dot.film { opacity: 0.8; }
      .hangar-scheme-tag {

      }
      .hangar-note { margin: 16px 0 0; font-size: 14px; line-height: 1.45; color: var(--cream); opacity: 0.85; }
      .hangar-source { margin: 10px 0 0; font-size: 12px; line-height: 1.45; color: var(--slate); }
      .hangar-regions { display: flex; flex-wrap: wrap; gap: 6px; }
      .hangar-region {
        appearance: none; display: flex; align-items: center; gap: 8px;
        padding: 6px 13px 6px 6px; border-radius: 999px; cursor: pointer;
        border: 1px solid rgba(243, 234, 212, 0.18); background: rgba(243, 234, 212, 0.03); color: var(--cream);
        font: 600 13px/1 var(--ui-font);
        transition: transform 240ms var(--hg-spring), background 160ms, border-color 160ms, color 160ms;
      }
      .hangar-region:hover, .hangar-region:focus-visible { transform: translateY(-1px); border-color: rgba(243, 234, 212, 0.55); }
      .hangar-region.on { background: var(--cream); border-color: var(--cream); color: var(--deep); }
      .hangar-dot {
        width: 20px; height: 20px; border-radius: 50%; flex: none;
        box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.4), 0 0 0 1px rgba(243, 234, 212, 0.3);
      }
      .hangar-colour { display: flex; align-items: center; gap: 12px; margin: 16px 0 12px; }
      .hangar-colour-chip {
        width: 40px; height: 40px; border-radius: 10px; flex: none; background: var(--swatch);
        box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.35), 0 4px 14px rgba(0, 0, 0, 0.35);
      }
      .hangar-colour-words { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
      .hangar-colour-brand {
        font: 700 10px/1 var(--ui-font); letter-spacing: 0.16em; text-transform: uppercase; color: var(--slate);
      }
      .hangar-colour-name { font: 700 17px/1.15 var(--ui-font); }
      .hangar-palette { display: grid; grid-template-columns: repeat(auto-fill, minmax(36px, 1fr)); gap: 8px; }
      .hangar-swatch {
        appearance: none; aspect-ratio: 1; padding: 0; border: 0; border-radius: 9px; cursor: pointer;
        background: var(--swatch);
        box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.35), inset 0 10px 14px -10px rgba(255, 255, 255, 0.35);
        transition: transform 220ms var(--hg-spring), box-shadow 160ms;
      }
      /* A see through film over the ribs of a wing, lit from behind: the
       * swatch shows the film's colour with the wood through it. */
      .hangar-swatch.film, .hangar-colour-chip.film {
        background:
          linear-gradient(color-mix(in srgb, var(--swatch) 76%, transparent), color-mix(in srgb, var(--swatch) 76%, transparent)),
          repeating-linear-gradient(90deg, #6b5334 0 3px, #fff7e2 3px 11px);
      }
      .hangar-swatch:hover, .hangar-swatch:focus-visible {
        transform: scale(1.18); z-index: 1;
        box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.35), 0 6px 16px rgba(0, 0, 0, 0.5);
      }
      .hangar-swatch.on {
        transform: scale(1.06);
        box-shadow: 0 0 0 2px var(--deep), 0 0 0 4px var(--mint), 0 6px 16px rgba(125, 255, 180, 0.25);
      }
      .hangar-swatch-custom {
        background: conic-gradient(#e33, #ec3, #3c6, #3cd, #36e, #c3d, #e33);
        color: #fff; font: 700 20px/1 var(--ui-font); text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8);
      }
      .hangar-custom-input { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
      .hangar-cards { display: grid; gap: 8px; }
      .hangar-cards-small { grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); }
      .hangar-card-name { font: 700 15px/1.25 var(--ui-font); }
      .hangar-card-detail { font: 500 12px/1.4 var(--ui-font); color: var(--slate); }
      /* Two tiles across, not three: a value like "65 km/h" at 24px is about
       * 100px wide, and three tiles across this panel gave each 91px, so the
       * speed wrapped onto two lines and the fourth tile sat alone below. */
      .hangar-stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-top: 20px; }
      .hangar-stat {
        display: flex; flex-direction: column; gap: 6px; padding: 12px 13px 11px; border-radius: 12px;
        background: rgba(0, 0, 0, 0.3); border: 1px solid rgba(255, 212, 92, 0.22);

        font: 700 10px/1 var(--ui-font); letter-spacing: 0.16em; text-transform: uppercase; color: var(--slate);

      .hangar-stat-bar { display: block; height: 4px; border-radius: 2px; background: rgba(243, 234, 212, 0.1); overflow: hidden; }
      .hangar-stat-fill {
        display: block; height: 100%; border-radius: 2px; transform-origin: left center;
        background: linear-gradient(90deg, #ffb43c, var(--amber));
      }
      .hangar-stat-delta { min-height: 12px; font: 700 12px/1 var(--ui-font); color: var(--mint); }
      /* The Parts tab (src/ui/hangar-parts.js): an add-on is a toggle with a

        content: ""; position: absolute; top: 12px; right: 11px; width: 10px; height: 10px; border-radius: 50%;

        font: 700 12px/1 var(--ui-font); transition: transform 220ms var(--hg-spring), background 160ms, border-color 160ms;
      }
      .parts-act:hover, .parts-act:focus-visible { transform: translateY(-1px); border-color: var(--cream); background: rgba(243, 234, 212, 0.14); }
      .parts-act.tape { border-color: rgba(201, 205, 209, 0.5); color: #dfe3e6; }

      .hangar-foot { display: flex; flex-direction: column; gap: 8px; }
      .hangar-warn[hidden] { display: none; }
      .hangar-buttons { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
      .hangar-buttons-end { display: flex; gap: 10px; }

        color: var(--slate); font: 600 14px/1 var(--ui-font);

      }

      .hangar .carousel-choose, .hangar .carousel-back { transition: transform 220ms var(--hg-spring), box-shadow 200ms, background 160ms; }
      .hangar .carousel-choose:hover, .hangar .carousel-back:hover,

      .hangar .carousel-hint { text-align: center; }
