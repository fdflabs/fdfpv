<!doctype html>
<!--
  Paraguayan Drone Combat Simulator: the page. A canvas for the world, an
  overlay for the product shell (title, how to fly, credits, settings,
  pause, results, and the flight display). The overlay's structure is built
  in src/ui/ui.js; its styling lives here with the rest of the page's CSS.

  Colour rule: light is warm, shadow is cool. Cream for lit type. Sakura
  for chrome (menus). Amber for instruments that have to read over live
  footage. Mint for a record. Recessed type stays a
  cool mist so it still recedes on grass and sky. The title and the
  finish screen do not paint a second landscape and do not load a
  webfont: the world behind the menu is the picture, and the overlay
  is CSS. Mint on the finish hero is a record.

  This file is part of WebFPVSimulator.

<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- viewport-fit is for flight on a phone: the thumb stick margins read
         the safe-area insets on notched screens.

         maximum-scale=1 used to be here as well, to stop a double-tap zoom
         mid-race, and it was the wrong tool twice over. It blocks pinch zoom
         on every menu, note and results screen, which is a genuine barrier
         for anyone who needs to magnify text, and iOS Safari has ignored it
         since iOS 10, so it did not even do the job on the platform it was
         aimed at. What actually stops a double-tap during a run is
         touch-action, which the flight surfaces already carry, and the menu
         root now carries touch-action: manipulation, which stops the
         double-tap and keeps the pinch. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Paraguayan Drone Combat Simulator</title>
    <meta name="author" content="fdflabs.com" />
    <meta name="description" content="Fly a five inch quad in a browser, on a real Betaflight control loop compiled to WebAssembly. Build a track, set a lap, put it on the public board." />
    <!--
      A link to this page posted anywhere renders a 1200 by 630 card, and
      og.png is a frame of the real shell rather than a drawing of one, so it
      cannot disagree with the thing it advertises. scripts/og.js in the
      simulator's repository regenerates it, and the URL is absolute because a
      crawler does not resolve a relative one.

      No animated card. Facebook, Messenger, X, LinkedIn, WhatsApp and iMessage
      all flatten a link preview to one still frame; Discord is the only place
      that would animate it, which is not worth a second asset.
    -->
    <link rel="canonical" href="https://fdflabs.github.io/fdfpv/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Paraguayan Drone Combat Simulator" />
    <meta property="og:url" content="https://fdflabs.github.io/fdfpv/" />
    <meta property="og:title" content="Paraguayan Drone Combat Simulator, fly it in your browser" />
    <meta property="og:description" content="A real Betaflight control loop compiled to WebAssembly, a race track, and a lap timer. Plug in a gamepad and go." />
    <meta property="og:image" content="https://fdflabs.github.io/fdfpv/og.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The Paraguayan Drone Combat Simulator name, with a red, white and blue slash, beside a delta wing drone banking past the spillway of the Itaipu dam at sunset." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Paraguayan Drone Combat Simulator, fly it in your browser" />
    <meta name="twitter:description" content="A real Betaflight control loop compiled to WebAssembly, a race track, and a lap timer. Plug in a gamepad and go." />
    <meta name="twitter:image" content="https://fdflabs.github.io/fdfpv/og.png" />
    <meta name="twitter:image:alt" content="The Paraguayan Drone Combat Simulator name, with a red, white and blue slash, beside a delta wing drone banking past the spillway of the Itaipu dam at sunset." />

    <!--
      The mark is four propellers, an X frame and the stack in the middle, one
      shape shared by all four pages in the family with one accent each, so a
      pilot with the simulator, the builder and the board open at once can
      tell three tabs apart without reading them. This one is sakura, the
      shell's chrome colour. scripts/icons.js draws them all.
    -->
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="icon" href="favicon.ico" sizes="32x32" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <meta name="theme-color" content="#141c16" />
    <!--
      The loading screen's picture (the #loading rule below), asked for
      before the stylesheet is even parsed so it is usually there for the
      screen's first paint. One file per shape, and the media queries are
      the stylesheet's, so a page fetches only the one it shows. It is
      130 KB against the renderer's 1.2 MB, and the boot never waits on
      it: the screen paints its dark fallback first either way.
    -->
    <link rel="preload" as="image" type="image/webp" href="assets/loading/wide.webp" media="not all and (max-aspect-ratio: 4/5)" />
    <link rel="preload" as="image" type="image/webp" href="assets/loading/tall.webp" media="(max-aspect-ratio: 4/5)" />
    <style>
      :root {
        --cream: #f3ead4;
        --sakura: #e8a8b8;
        --amber: #ffd45c;
        --mint: #7dffb4;
        --slate: #9db3c8;
        --deep: #141c16;
        /*
         * THE FRAME'S TWO BARS, as tokens rather than as numbers typed into
         * seventeen places.
         *
         * Every scroller cap in this sheet is a hand tuned vh, and seven of
         * them say in their own comments which window they were measured
         * against. Adding a status bar and a command bar without telling
         * those caps about it puts the Rates screen 52 px under its own bar
         * at 1280x720, measured. So the caps subtract these, and a screen
         * that hides a bar sets its own value to zero rather than fighting
         * the cap.
         */
        --bar-top: 36px;
        --bar-bot: 44px;
        --bars: calc(var(--bar-top) + var(--bar-bot));
        --panel: #1a241c;
        --ink: rgba(12, 18, 14, 0.86);
        --ui-font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      }
      /* overscroll-behavior is for phones: a drag that starts on the world
         must not become a pull-to-refresh mid-flight. */
      html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: var(--deep); overscroll-behavior: none; }
      #view {
        display: block; position: fixed; inset: 0;
        width: 100%; height: 100%;
      }
      #ui {
        position: fixed; inset: 0; pointer-events: none; user-select: none;
        font-family: var(--ui-font); color: var(--cream);
        font-variant-numeric: tabular-nums;
      }

      /* Flight display. Thin warm type over a dark edge, the way an OSD
         reads over any background. */
      .osd { position: absolute; inset: 0; }
      .osd.dim { opacity: 0.4; }
      .osd-top {
        position: absolute; top: 18px; left: 50%; transform: translateX(-50%);
        text-align: center; text-shadow: 0 2px 6px rgba(0,0,0,0.85);
      }
      .osd-timer { font-size: 46px; font-weight: 600; letter-spacing: 0.02em; line-height: 1; }
      .osd-timer.waiting { color: #b9c9d8; }
      .osd-label {
        font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase;
        color: var(--slate); margin-bottom: 2px;
      }
      .osd-value { font-size: 20px; font-weight: 600; }
      .osd-sub { font-size: 13px; color: var(--slate); margin-top: 1px; margin-bottom: 8px; }
      .osd-gate { font-size: 15px; color: var(--amber); margin-top: 6px; letter-spacing: 0.08em; text-transform: uppercase; }
      .osd-best { font-size: 14px; color: var(--slate); margin-top: 3px; }
      /* The gap to the ghost, lit for a moment after each gate. Mint when
         the pilot is ahead of it, amber when it is ahead, the same reading
         the rest of this overlay teaches: mint is the good news. */
      .osd-ghost { font-size: 15px; font-weight: 600; margin-top: 4px; letter-spacing: 0.04em; }
      .osd-ghost.is-off { display: none; }
      .osd-ghost.ahead { color: var(--mint); }
      .osd-ghost.behind { color: var(--amber); }
      .osd-corner {
        position: absolute; bottom: 20px; width: 190px;
        text-shadow: 0 2px 6px rgba(0,0,0,0.85); font-size: 15px;
      }
      .osd-left { left: 22px; }
      .osd-right { right: 22px; text-align: right; }
      .osd-mode { letter-spacing: 0.14em; text-transform: uppercase; color: var(--amber); }
      .osd-launch {
        position: absolute; left: 50%; top: 16%;
        transform: translate(-50%, 0);
        font-size: clamp(28px, 4.2vw, 46px); font-weight: 700;
        letter-spacing: 0.18em; text-transform: uppercase;
        color: var(--amber);
        text-shadow: 0 3px 14px rgba(0, 0, 0, 0.92);
        pointer-events: none;
      }
      .osd-launch.is-off { display: none; }
      .osd-launch.is-hot { animation: launch-blink 0.32s step-end infinite; }
      .osd-launch.is-go {
        color: #8dffb0;
        letter-spacing: 0.32em;
        font-size: clamp(40px, 6vw, 64px);
      }
      @keyframes launch-blink {
        50% { opacity: 0.2; }
      }

      /* FREESTYLE SCORE, down the left. See src/ui/scorehud.js for why it
         is here and not anywhere else: the top centre, both bottom corners
         and the bottom centre are already spoken for by the flight OSD.
         Everything that moves is a keyframe on a node that removes itself,
         so this costs no frame time when nothing has happened. */
      .score-hud { position: absolute; inset: 0; pointer-events: none; }
      .score-hud.is-off { display: none; }
      /* A ROOM'S RACE, down the left under the link readout (src/ui/
         roomhud.js): the right has the flight buttons and the throttle, the
         top centre the lap clock, and the left column's other tenant, the
         freestyle score, is never up in a race. */
      .room-race {
        position: absolute; left: 16px; top: calc(var(--bar-top) + 96px);
        min-width: 180px; max-width: 42vw; pointer-events: none;
        padding: 6px 10px; border-radius: 4px; background: rgba(16, 22, 17, 0.62);
        font-size: 13px; line-height: 1.45; text-shadow: 0 1px 3px rgba(0,0,0,0.85);
      }
      .room-race.is-off { display: none; }
      .room-race-title {
        font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase;
        color: var(--slate); margin-bottom: 2px;
      }
      /* A state of this pilot's in the match, a tag under the title (Catch
         the Ace's chase boost). */
      .room-race-chip {
        display: inline-block; margin: 1px 0 3px; padding: 0 6px; border-radius: 3px;
        font-size: 11px; font-weight: 700; letter-spacing: 0.06em; color: #1b1405; background: var(--amber);
      }
      .room-race-row { display: flex; gap: 8px; white-space: nowrap; }
      .room-race-row.is-me { color: var(--amber); }
      .room-race-place { width: 1.2em; text-align: right; }
      .room-race-name { flex: 1; overflow: hidden; text-overflow: ellipsis; }
      .room-race-value { font-variant-numeric: tabular-nums; }
      /* Clear of the music dock, which moves to the top left corner on the
         flight screen (.music-dock.on-flight) and is 30 px tall at 16 px.
         --bar-top is zero in flight, so this offset is measured from the
         top of the window there and from under the bar everywhere else. */
      .score-total {
        position: absolute; left: 22px; top: calc(var(--bar-top) + 58px);
        text-shadow: 0 2px 6px rgba(0,0,0,0.85);
      }
      .score-label {
        font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase;
        color: var(--slate); margin-bottom: 1px;
      }
      /* The scorer admits what it is, beside the word it qualifies. Amber
         is the instrument colour this overlay and the menus both use for a
         reading about the state of the machine rather than about the
         flying, and it is a shade smaller and a shade dimmer than the label
         so it reads as a footnote and never competes with the number.
         See the comment on totalBox in src/ui/scorehud.js. */
      .score-beta {
        margin-left: 6px; font-size: 9px; letter-spacing: 0.1em;
        color: var(--amber); opacity: 0.8;
      }
      /* A HARD OUTLINE, NOT A GLOW. Every other readout on this overlay
         uses a soft drop shadow, and a soft shadow works because the world
         behind the OSD is mostly sky or grass. The score sits over the
         town: cream on a pale road at midday, which measured as unreadable
         in the first capture. Four one pixel offsets give the glyph an
         edge whatever is behind it, and the blur underneath keeps it from
         looking stencilled. */
      .score-cut {
        text-shadow:
          -1px -1px 0 rgba(8, 12, 9, 0.92),  1px -1px 0 rgba(8, 12, 9, 0.92),
          -1px  1px 0 rgba(8, 12, 9, 0.92),  1px  1px 0 rgba(8, 12, 9, 0.92),
          0 2px 10px rgba(0, 0, 0, 0.9);
      }
      .score-value {
        font-size: clamp(26px, 3.4vw, 40px); font-weight: 700;
        line-height: 1; letter-spacing: 0.01em; color: var(--cream);
      }
      /* THE LAST TEN SECONDS of a freestyle run, on the OSD's own clock.
         Amber rather than red because nothing has gone wrong: the run is
         ending, and this is the window a pilot spends deciding whether to
         try the big line. It is the only thing on the flight overlay that
         changes colour without something having happened. */
      .osd-timer.is-late { color: var(--amber); }
      /* The name stack sits directly ON TOP OF the combo line and grows
         UPWARD, which is the Tony Hawk arrangement and not a stylistic
         choice: the newest trick has to be adjacent to the number it just
         changed, or the eye has to cross half the screen to connect them.
         The stack is anchored by its BOTTOM edge and laid out top down, so
         the newest name is appended last and lands nearest the combo line,
         and the older ones are pushed up and out. No JS: the container
         simply grows upward as rows arrive. */
      .score-names {
        position: absolute; left: 22px; bottom: calc(24vh + 62px);
        width: min(46vw, 340px);
        display: flex; flex-direction: column;
        align-items: flex-start; gap: 2px;
      }
      .score-name {
        display: flex; align-items: baseline; gap: 8px;
        font-size: clamp(15px, 1.85vw, 21px); font-weight: 700;
        letter-spacing: 0.06em; text-transform: uppercase;
        color: var(--cream);
        white-space: nowrap;
        animation: score-name-in 2.2s ease-out forwards;
      }
      .score-name.is-sloppy { color: var(--amber); }
      .score-name.is-bump { color: var(--sakura); }
      .score-name-points { font-size: 0.8em; color: var(--cream); opacity: 0.7; font-weight: 500; }
      .score-name-tag {
        font-size: 0.62em; letter-spacing: 0.14em; color: var(--slate);
        opacity: 0.85;
      }
      @keyframes score-name-in {
        0%   { opacity: 0; transform: translateX(-14px); }
        7%   { opacity: 1; transform: translateX(0); }
        75%  { opacity: 1; }
        100% { opacity: 0; transform: translateY(-10px); }
      }
      /* The live combo. Under the names, and it is the number the pilot is
         gambling: it reads big on purpose. */
      .score-combo {
        position: absolute; left: 22px; bottom: 24vh;
        text-shadow: 0 2px 8px rgba(0,0,0,0.9);
      }
      .score-combo.is-off { display: none; }
      .score-combo-line {
        display: flex; align-items: baseline; gap: 6px;
        font-size: clamp(22px, 2.8vw, 34px); font-weight: 700; line-height: 1;
        color: var(--amber);
      }
      .score-combo-mult { font-size: 0.82em; color: var(--mint); }
      .score-combo-bar {
        margin-top: 6px; height: 4px; width: clamp(90px, 12vw, 150px);
        border-radius: 2px; background: rgba(12, 22, 34, 0.65);
        box-shadow: inset 0 0 0 1px rgba(157, 179, 200, 0.3);
        overflow: hidden;
      }
      .score-combo-fill {
        height: 100%; width: 100%; background: var(--amber);
        transform-origin: left center; transform: scaleX(1);
      }
      /* Banked or bailed. Centre screen for one beat, because it is the one
         moment worth looking away from the quad for. */
      .score-verdict {
        position: absolute; left: 50%; top: 38%;
        transform: translate(-50%, -50%);
        font-size: clamp(30px, 4.6vw, 54px); font-weight: 700;
        letter-spacing: 0.14em; text-transform: uppercase;
        opacity: 0;
      }
      .score-verdict.is-on { animation: score-verdict 1.15s ease-out forwards; }
      .score-verdict.is-bank { color: var(--mint); }
      /* A saturated sakura rather than the token. --sakura is the brand's
         blossom pink and it is a pale one by design; over a lit road it
         read as decoration rather than as a loss. Same hue, enough
         saturation to mean something. */
      .score-verdict.is-bail { color: #ff7d96; }
      @keyframes score-verdict {
        0%   { opacity: 0; transform: translate(-50%, -50%) scale(0.82); }
        14%  { opacity: 1; transform: translate(-50%, -50%) scale(1.06); }
        24%  { transform: translate(-50%, -50%) scale(1); }
        70%  { opacity: 1; }
        100% { opacity: 0; transform: translate(-50%, -74%) scale(1); }
      }
      /* Phones fly with the touch sticks up and a much shorter screen, so
         the combo climbs out of their way and the stack keeps two rows. */
      @media (max-height: 560px) {
        .score-combo { bottom: 34vh; }
        .score-names { bottom: calc(34vh + 52px); }
      }
      @media (prefers-reduced-motion: reduce) {
        .score-name, .score-verdict.is-on { animation-duration: 0.01s; }
      }
      /* ------------------------------------------------------------------
         THE ANIME LAYER.

         The town is cel shaded and the score was not: flat type fading in
         and out over a world drawn with hard ink lines. This is the same
         readout wearing the same clothes as the place it sits in.

         CEL SHADING IS A RULE, not a mood. Flat colour, hard edges, no
         blur, no soft glow, no gradient that is not a stack of hard stops.
         Every ray fan below is a repeating-conic-gradient whose stops sit
         on top of each other, so it renders as solid wedges rather than as
         a smear, which is exactly what an ink burst is.

         AND IT STILL ASKS FOR NO FRAMES. Every moving thing here is a
         keyframe on a node that removes itself when the animation ends, the
         rule scorehud.js opens with. A rAF driven overlay competing with a
         1 kHz simulation is how a smooth sim gets a stutter nobody can find.
         ------------------------------------------------------------------ */

      /* The ray fan behind a trick name. Sixteen hard wedges in a ring,
         punched hollow in the middle so the type stays readable through it,
         and drawn TWICE: an ink fan and, inside it, the colour. Cel shading
         is a fill with a line round it, and over a pale sky the line is the
         half that makes the fill visible at all.

         The row is the thing it belongs to, so the row is what it is
         positioned against: the first version resolved against the whole
         overlay and threw its rays into empty sky halfway up the screen. */
      .score-name { position: relative; }
      /* The rays go behind the type by DOM ORDER, not by a negative
         z-index. z-index -1 on the burst took the whole row down with it,
         behind the world canvas, and the trick name vanished: a positioned
         child asking to paint below its parent's box asks to paint below
         everything the parent sits on. Positioning the spans instead puts
         them in the same group as the burst, where the one appended last
         wins, which is exactly what is wanted. */
      .score-name > span { position: relative; }
      .score-burst {
        position: absolute; left: -34px; top: 50%;
        width: 200px; height: 200px; margin-top: -100px;
        pointer-events: none;
        background: repeating-conic-gradient(#0b1116 0deg 8.4deg, transparent 8.4deg 22.5deg);
        -webkit-mask-image: radial-gradient(closest-side, transparent 0 30%, #000 33% 74%, transparent 78%);
        mask-image: radial-gradient(closest-side, transparent 0 30%, #000 33% 74%, transparent 78%);
        opacity: 0;
        animation: score-burst 480ms cubic-bezier(0.16, 0.9, 0.3, 1) forwards;
      }
      .score-burst::before {
        content: ''; position: absolute; inset: 0;
        background: repeating-conic-gradient(var(--burst, var(--cream)) 0deg 6.2deg, transparent 6.2deg 22.5deg);
        -webkit-mask-image: radial-gradient(closest-side, transparent 0 32%, #000 35% 71%, transparent 75%);
        mask-image: radial-gradient(closest-side, transparent 0 32%, #000 35% 71%, transparent 75%);
      }
      @keyframes score-burst {
        0%   { opacity: 0.95; transform: scale(0.25) rotate(-9deg); }
        60%  { opacity: 0.35; }
        100% { opacity: 0; transform: scale(1.25) rotate(5deg); }
      }

      /* The name slams in. Overshoot, a touch of shear, and a hard stop:
         an anime title card lands, it does not arrive. */
      .score-hud .score-name { animation: score-name-slam 2.2s cubic-bezier(0.14, 1, 0.3, 1) forwards; }
      @keyframes score-name-slam {
        0%   { opacity: 0; transform: translateX(-42px) skewX(-16deg) scale(1.38); }
        9%   { opacity: 1; transform: translateX(3px) skewX(4deg) scale(0.96); }
        15%  { transform: translateX(0) skewX(0) scale(1); }
        76%  { opacity: 1; transform: translateX(0); }
        100% { opacity: 0; transform: translateY(-14px); }
      }
      /* The points on a name pop a beat after the name, so the eye reads
         the trick and then the number rather than both at once. */
      .score-name-points { animation: score-pop 620ms cubic-bezier(0.1, 1.5, 0.4, 1) 90ms backwards; }
      @keyframes score-pop {
        0%   { transform: scale(2.1); opacity: 0; }
        30%  { opacity: 1; }
        100% { transform: scale(1); opacity: 0.7; }
      }

      /* THE COMBO TIER. The number is the thing at risk, so as the chain
         grows it gets louder in three ways at once: colour, weight and a
         chevron that only appears when there is something to lose. */
      .score-combo-line { transition: color 140ms linear; }
      .score-combo.tier-2 .score-combo-line { color: var(--amber); }
      .score-combo.tier-3 .score-combo-line { color: #ffc46b; }
      .score-combo.tier-4 .score-combo-line { color: #ff9f5a; }
      .score-combo.tier-5 .score-combo-line { color: #ff7d96; }
      .score-combo.tier-3 .score-combo-line,
      .score-combo.tier-4 .score-combo-line,
      .score-combo.tier-5 .score-combo-line { animation: score-throb 620ms ease-in-out infinite alternate; }
      @keyframes score-throb {
        from { transform: scale(1); }
        to   { transform: scale(1.045); }
      }
      /* The tier badge: an English word for what it is and a Japanese one
         for where it is. The town is a Japanese one and reads its own
         signage; this is the score speaking the same language. */
      .score-tier {
        display: inline-flex; align-items: baseline; gap: 6px;
        margin-left: 10px; padding: 2px 8px;
        font-size: 0.44em; font-weight: 700; letter-spacing: 0.18em;
        text-transform: uppercase; white-space: nowrap;
        /* INHERITS the tier's colour and paints itself with it, so the
           badge is a solid chip of whatever the number has just become and
           the words are punched out of it. Setting a colour here instead
           was dark ink on a dark chip and read as a black bar. */
        background: currentColor;
        box-shadow: 0 0 0 2px rgba(8, 12, 9, 0.9);
        animation: score-tier-in 420ms cubic-bezier(0.1, 1.4, 0.4, 1);
      }
      .score-tier > span { color: #0b1116; }
      .score-tier .score-tier-jp { letter-spacing: 0.05em; opacity: 0.72; }
      @keyframes score-tier-in {
        0%   { transform: scale(0.4) rotate(-8deg); opacity: 0; }
        60%  { transform: scale(1.12) rotate(2deg); opacity: 1; }
        100% { transform: scale(1) rotate(0); }
      }

      /* BANKED. A hard ring, not a bloom: one 3 px stroke expanding once.
         Cel shading has no falloff, so neither does this. */
      .score-ring {
        position: absolute; left: 50%; top: 38%;
        width: 90px; height: 90px; margin: -45px 0 0 -45px;
        border: 3px solid var(--mint); border-radius: 50%;
        opacity: 0; pointer-events: none;
        animation: score-ring 620ms cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
      }
      .score-ring.is-bail { border-color: #ff7d96; }
      .score-ring.is-late { animation-delay: 110ms; }
      @keyframes score-ring {
        0%   { opacity: 0.9; transform: scale(0.35); border-width: 5px; }
        100% { opacity: 0; transform: scale(3.4); border-width: 1px; }
      }
      /* The verdict itself lands harder than it used to, and a bail SHAKES:
         losing a chain should feel like a hit, not like a fade. */
      .score-verdict.is-bank { animation: score-verdict-bank 1.15s cubic-bezier(0.1, 1.3, 0.3, 1) forwards; }
      @keyframes score-verdict-bank {
        0%   { opacity: 0; transform: translate(-50%, -50%) scale(0.5) rotate(-5deg); }
        12%  { opacity: 1; transform: translate(-50%, -50%) scale(1.22) rotate(2deg); }
        22%  { transform: translate(-50%, -50%) scale(1) rotate(0); }
        68%  { opacity: 1; }
        100% { opacity: 0; transform: translate(-50%, -96%) scale(1); }
      }
      .score-verdict.is-bail { animation: score-verdict-bail 1.15s ease-out forwards; }
      @keyframes score-verdict-bail {
        0%   { opacity: 0; transform: translate(-50%, -50%) scale(1.5) skewX(-14deg); }
        8%   { opacity: 1; transform: translate(-52%, -50%) scale(1) skewX(0); }
        13%  { transform: translate(-48%, -50%); }
        18%  { transform: translate(-51%, -50%); }
        23%  { transform: translate(-50%, -50%); }
        70%  { opacity: 1; }
        100% { opacity: 0; transform: translate(-50%, -50%) scale(0.94); }
      }

      /* SPEED LINES down both edges, and ONLY while a chain is worth
         something. Two flat strips of hard vertical stripes, so the frame
         gets busier exactly as the pilot has more to lose. Nothing here
         reads a value: it is a class the combo tier already computes. */
      .score-lines {
        position: absolute; inset: 0; pointer-events: none; opacity: 0;
        transition: opacity 220ms linear;
        background:
          repeating-linear-gradient(90deg, var(--cream) 0 2px, transparent 2px 13px) left  / 11vw 100% no-repeat,
          repeating-linear-gradient(90deg, var(--cream) 0 2px, transparent 2px 13px) right / 11vw 100% no-repeat;
        -webkit-mask-image: linear-gradient(90deg, #000 0, transparent 12vw, transparent calc(100% - 12vw), #000 100%);
        mask-image: linear-gradient(90deg, #000 0, transparent 12vw, transparent calc(100% - 12vw), #000 100%);
      }
      .score-hud.tier-3 .score-lines { opacity: 0.16; }
      .score-hud.tier-4 .score-lines { opacity: 0.24; }
      .score-hud.tier-5 .score-lines { opacity: 0.34; animation: score-lines 900ms steps(2) infinite; }
      @keyframes score-lines {
        from { transform: translateX(0); }
        to   { transform: translateX(6px); }
      }

      @media (prefers-reduced-motion: reduce) {
        .score-name, .score-verdict.is-on { animation-duration: 0.01s; }
        /* NOTHING THAT CARRIES MEANING IS HIDDEN. The tier colour, the
           badge and the score all stay; what goes is the movement, which is
           the same contract the rest of this overlay keeps. */
        .score-hud .score-name, .score-verdict.is-bank, .score-verdict.is-bail,
        .score-name-points, .score-tier { animation-duration: 0.01s; }
        .score-burst, .score-ring { display: none; }
        .score-combo.tier-3 .score-combo-line,
        .score-combo.tier-4 .score-combo-line,
        .score-combo.tier-5 .score-combo-line { animation: none; }
        .score-hud.tier-5 .score-lines { animation: none; }
      }

      .bar {
        height: 5px; margin-top: 7px; border-radius: 3px;
        background: rgba(12, 22, 34, 0.65);
        box-shadow: inset 0 0 0 1px rgba(157, 179, 200, 0.35);
        overflow: hidden;
      }
      .bar-fill { height: 100%; width: 0%; background: var(--mint); transition: width 0.12s linear; }
      .bar-fill.warm { background: var(--amber); }
      .osd-hits { margin-top: 10px; margin-bottom: 0; }
      .osd-hits.warn { color: var(--amber); }


      /* Keyboard stick ghost. Two Mode 2 gimbals: left is yaw and
         throttle, right is roll and pitch. Shown only when the keyboard
         is the stick source, so a radio does not grow a second pair of
         sticks. Transparent enough to read a gate through. */
      .osd-sticks {
        position: absolute; left: 50%; bottom: 18px;
        transform: translateX(-50%);
        display: flex; align-items: flex-end; gap: 14px;
        pointer-events: none;
        /*
         * ABOVE THE THUMB ZONES, and this was found by hit test, not by eye.
         * The touch overlay is the last child of #ui so its catchment beats
         * every screen, and its two zones are 44 percent of the width each
         * from the bottom up. On an 844 by 390 phone that put
         * elementFromPoint at the Got it button on .touch-zone-left and at
         * the track's right end on .touch-zone-right: a thumb could neither
         * dismiss the card nor reach Sinky, which is the end the report
         * asked for. 1 is enough to beat an overlay at auto and stays under
         * the chips at 6 and 7 and the dialogs at 8. Only the track and the
         * button take pointer events, so a thumb landing anywhere else in
         * this block still falls through to the zone beneath it. While
         * paused .osd.dim has opacity under 1, which makes it a stacking
         * context and keeps this value inside the OSD, under the menu,
         * where it belongs.
         */
        z-index: 1;
      }
      .osd-sticks.is-off { display: none; }
      .osd-gimbal.is-off { display: none; }
      .osd-gimbal-plate {
        position: relative;
        width: clamp(64px, 11vw, 88px);
        height: clamp(64px, 11vw, 88px);
        border-radius: 4px;
        background: rgba(12, 18, 14, 0.28);
        box-shadow: inset 0 0 0 1px rgba(243, 234, 212, 0.32);
      }
      .osd-cross-x, .osd-cross-y {
        position: absolute;
        background: rgba(157, 179, 200, 0.32);
      }
      .osd-cross-x { left: 10%; right: 10%; height: 1px; top: 50%; }
      .osd-cross-y { top: 10%; bottom: 10%; width: 1px; left: 50%; }
      .osd-nub {
        position: absolute; left: 50%; top: 50%;
        width: 11px; height: 11px;
        border-radius: 50%;
        background: var(--amber);
        box-shadow: 0 0 0 1px rgba(12, 18, 14, 0.55), 0 1px 6px rgba(0, 0, 0, 0.45);
        transform: translate(-50%, -50%);
      }
      .osd-gimbal-cap {
        margin-top: 6px;
        font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase;
        color: var(--slate); text-align: center;
        text-shadow: 0 1px 4px rgba(0, 0, 0, 0.85);
      }

      /*
       * THE AIR SLIDER, between the sticks, because that is where the hands
       * already are and because the thing it changes is only legible while
       * flying.
       *
       * It rides inside .osd-sticks so the two gimbals sit either side of it
       * and the whole block stays one centred row, which is why .osd-sticks
       * is no longer hidden as a unit: the GIMBALS carry their own is-off
       * now and the container is shown whenever either half has something to
       * say. The gap drops to 14px because the slider is the wide part.
       *
       * Amber, which on this overlay means an instrument rather than a
       * record: it reads a number about the pilot's own quad, the same job
       * the throttle bar and the pack gauge do. The track is the only thing
       * on this overlay that takes a pointer, so it turns events back on for
       * itself against .osd-sticks' none.
       */
      .osd-air {
        position: relative;
        display: flex; flex-direction: column; align-items: center;
        gap: 2px; padding-bottom: 2px;
        text-shadow: 0 1px 4px rgba(0, 0, 0, 0.85);
      }
      .osd-air.is-off { display: none; }
      .osd-air-row { display: flex; align-items: center; gap: 8px; }
      .osd-air-end {
        font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase;
        color: var(--slate); white-space: nowrap;
      }
      /*
         Reuses .row-range for the track and thumb geometry, so the menu's
         slider and this one are the same control; only the colour differs,
         the same way .screen-fc recolours it. Two rules here are load bearing
         and both were learned the hard way in this file:

         THE SELECTOR CARRIES TWO CLASSES. .row-range is declared later in
         this sheet, so a bare .osd-air-range ties on specificity and loses on
         source order, and the first build of this control came out with the
         menu's mint thumb over a cream track, which on an OSD means a record
         rather than an instrument.

         AND THE VENDOR PREFIXES ARE WRITTEN OUT SEPARATELY. A shared selector
         list is dropped whole by any engine that does not know one of them.

         The track is darkened as well as tinted: this one sits over a lit
         world rather than over a panel, and the menu's 0.22 cream vanished
         against grass.
      */
      .osd-air-range { width: clamp(90px, 13vw, 150px); }
      .osd-air .osd-air-range::-webkit-slider-runnable-track {
        background: rgba(12, 18, 14, 0.55);
        box-shadow: inset 0 0 0 1px rgba(255, 212, 92, 0.35);
      }
      .osd-air .osd-air-range::-moz-range-track {
        background: rgba(12, 18, 14, 0.55);
        box-shadow: inset 0 0 0 1px rgba(255, 212, 92, 0.35);
      }
      .osd-air .osd-air-range::-webkit-slider-thumb { background: var(--amber); }
      .osd-air .osd-air-range::-moz-range-thumb { background: var(--amber); }
      .osd-air .osd-air-range:focus-visible { outline-color: var(--amber); }
      .osd-air-cap {
        font-size: 11px; letter-spacing: 0.08em;
        color: var(--amber); white-space: nowrap;
      }
      .osd-air-cap.is-stock { color: var(--slate); }
      /*
       * THE ONE TIME IT EXPLAINS ITSELF.
       *
       * A slider with no label is furniture, and a label long enough to say
       * what this one does would sit over the track for the rest of the
       * pilot's life. So it says it once, on the first flight this browser
       * has ever seen, and never again: the seen flag is its own localStorage
       * key rather than a field in the settings blob, because saving settings
       * is what detectFirstRun reads to decide somebody is a returning pilot,
       * and dismissing a hint is not the same as having been here before.
       *
       * It is pinned ABOVE the slider and pointer-events are on for the
       * button alone, so the hint can be read and dismissed without ever
       * being able to swallow a stick input aimed past it.
       */
      .osd-air-hint {
        position: absolute; bottom: calc(100% + 10px); left: 50%;
        transform: translateX(-50%);
        width: max-content; max-width: min(78vw, 320px);
        padding: 10px 14px; border-radius: 6px;
        background: rgba(16, 22, 17, 0.94);
        box-shadow: inset 0 0 0 1px rgba(255, 212, 92, 0.42), 0 6px 20px rgba(0, 0, 0, 0.5);
        text-align: left; pointer-events: none;
      }
      .osd-air-hint[hidden] { display: none; }
      /* The pointer down at the track. A rotated square rather than a border
         triangle, so the one pixel hairline above can run around it. */
      .osd-air-hint::after {
        content: ''; position: absolute; left: 50%; bottom: -5px;
        width: 10px; height: 10px; margin-left: -5px;
        transform: rotate(45deg);
        background: rgba(16, 22, 17, 0.94);
        box-shadow: inset -1px -1px 0 0 rgba(255, 212, 92, 0.42);
      }
      .osd-air-hint-title {
        font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase;
        color: var(--amber); margin: 0 0 4px;
      }
      .osd-air-hint-body {
        font-size: 13px; line-height: 1.45; color: var(--cream); margin: 0;
      }
      .osd-air-hint-btn {
        appearance: none; border: 0; background: var(--amber); color: var(--deep);
        font: inherit; font-size: 12px; font-weight: 600;
        padding: 5px 12px; border-radius: 999px; margin-top: 9px;
        cursor: pointer; pointer-events: auto;
      }
      .osd-air-hint-btn:focus-visible { outline: 1px solid var(--cream); outline-offset: 2px; }
      /*
       * SHORT SCREEN: THE CARD HANGS BELOW THE SLIDER INSTEAD.
       *
       * Measured on an 844 by 390 landscape phone with the thumb sticks up.
       * The slider sits at y 155 there, the card is about 125 px, and the
       * world banner sits at 22 percent of the height, which is y 60 to 112:
       * above the slider the two land on each other and the hint is not
       * readable. Below it the card covers the stacked pack and flight
       * blocks for as long as it takes to read one sentence and tap Got it,
       * which is a trade worth making once, on one flight, ever.
       */
      @media (max-height: 560px) {
        .osd-air-hint {
          bottom: auto; top: calc(100% + 10px);
          font-size: 12px;
        }
        .osd-air-hint::after {
          bottom: auto; top: -5px;
          box-shadow: inset 1px 1px 0 0 rgba(255, 212, 92, 0.42);
        }
      }

      /*
       * Thumb sticks, src/input/touchsticks.js. The ZONES are the
       * catchment, most of each lower corner, invisible; the drawn gimbal
       * is an instrument inside them and takes no pointer events of its
       * own. The zones stop at 68 percent of the height so the chips and
       * the music dock along the top stay tappable even on a short phone,
       * and everything in them refuses text selection, callouts and
       * browser gestures: a thumb hold is a stick hold.
       */
      .touch-fly { position: absolute; inset: 0; pointer-events: none; }
      .touch-fly[hidden] { display: none; }
      .touch-zone {
        position: absolute; bottom: 0; height: 68%; width: 44%;
        pointer-events: auto; touch-action: none;
        -webkit-user-select: none; user-select: none;
        -webkit-touch-callout: none;
        display: flex; align-items: flex-end;
      }
      .touch-zone-left {
        left: 0; justify-content: flex-start;
        padding-left: max(16px, env(safe-area-inset-left));
      }
      .touch-zone-right {
        right: 0; justify-content: flex-end;
        padding-right: max(16px, env(safe-area-inset-right));
      }
      .touch-gimbal {
        pointer-events: none;
        padding-bottom: max(12px, env(safe-area-inset-bottom));
      }
      /* Doubled from 30vmin on the owner's phone report: a bigger box is
         more glass per degree, because the deflection travel in
         touchsticks.js scales off the drawn plate's width. Landscape only;
         the portrait block below keeps the smaller plates, because two
         doubled plates are wider than a portrait phone. */
      .touch-plate {
        width: clamp(200px, 60vmin, 300px);
        height: clamp(200px, 60vmin, 300px);
        background: rgba(12, 18, 14, 0.30);
        transition: background 0.15s ease, box-shadow 0.15s ease;
      }
      .touch-plate.is-held {
        background: rgba(12, 18, 14, 0.46);
        box-shadow: inset 0 0 0 1px rgba(232, 168, 184, 0.55);
      }
      .touch-nub { width: 24px; height: 24px; }
      /* Under the bug chip, same right edge: the two chips a pilot needs in
         flight on glass, stacked where the right thumb flicks up to. The
         two-class selector is load-bearing: .bug-chip sets top 16px LATER
         in this sheet, and a bare .touch-pause lost to it and stacked the
         two chips on the same pixels. */
      .touch-fly .touch-pause { top: 52px; }
      /* The rotate hint, only while the sticks are up and the phone is
         tall. It does not block anything: the sticks still work, the hint
         just says why everything is cramped. */
      .touch-rotate {
        display: none;
        position: absolute; left: 50%; top: 38%;
        transform: translate(-50%, -50%);
        padding: 10px 18px; border-radius: 999px;
        background: rgba(16, 22, 17, 0.85); color: var(--amber);
        box-shadow: inset 0 0 0 1px rgba(255, 212, 92, 0.4);
        font-size: 15px; letter-spacing: 0.06em; white-space: nowrap;
        pointer-events: none;
      }
      @media (orientation: portrait) {
        .touch-fly:not([hidden]) .touch-rotate { display: block; }
      }
      .turtle-on .touch-rotate { display: none !important; }
      /*
       * While the thumb sticks are up, the OSD corners STACK in the centre
       * column: the doubled plates own both lower corners outright, and
       * two side-by-side corner blocks no longer fit between them on a
       * common phone width (an 800 px landscape leaves 264 px of gap).
       * Stacked and centred they need one column 170 px wide, which every
       * phone this runs on has. The timer drops a size for the same
       * reason.
       */
      .touch-fly-on .osd-corner {
        bottom: 8px; width: 170px; font-size: 13px;
        text-align: center;
      }
      .touch-fly-on .osd-left { left: 50%; transform: translateX(-50%); bottom: 116px; }
      .touch-fly-on .osd-right { right: auto; left: 50%; transform: translateX(-50%); }
      .touch-fly-on .osd-timer { font-size: 30px; }
      .touch-fly-on .osd-value { font-size: 16px; }
      /*
       * The air slider goes ABOVE the stacked corners rather than into them.
       * Bottom 8px is the flight block and 116px is the pack block, and the
       * pack block is about 70px of type and bar, so the centre column is
       * spoken for up to roughly 186px. 196px clears it, and the doubled
       * thumb plates own the two corners rather than the middle, so the
       * width is there. Hidden on a portrait phone, where .touch-rotate is
       * already saying the screen is the wrong way round and the plates
       * shrink to reach across it.
       */
      .touch-fly-on .osd-sticks { bottom: 196px; }
      /* Portrait is the hinted-away state, but it still has to be tidy:
         the plates go back to the single size, because two doubled plates
         are wider than the screen, and the corners go back to a split pair
         riding above them. */
      @media (orientation: portrait) {
        .touch-plate {
          width: clamp(112px, 30vmin, 168px);
          height: clamp(112px, 30vmin, 168px);
        }
        .touch-fly-on .osd-sticks { display: none; }
        .touch-fly-on .osd-corner { bottom: 186px; }
        .touch-fly-on .osd-left { left: calc(50% - 164px); transform: none; text-align: left; }
        .touch-fly-on .osd-right { left: auto; right: calc(50% - 164px); transform: none; text-align: right; }
      }
      /* Eleven pause rows do not fit a phone held sideways. The modal list
         scrolls rather than running off the glass; thumbs already know how. */
      @media (max-height: 540px) {
        .screen-modal .menu { max-height: calc(66vh - var(--bars)); overflow-y: auto; }
      }

      /*
       * THE BANNER SCALES WITH THE WINDOW.
       *
       * It was a flat 30 px with a 92vw cap, which is right on a laptop and
       * absurd on a phone: at 390 px "Nothing has been built yet. Open the
       * track builder from the title screen, place some gates, then come
       * back." wrapped to TEN lines of 30 px type, centred, covering the
       * status bar, the airframe and half the list underneath it. The
       * launch card was unreadable behind it.
       *
       * One token, used by both the plain banner and the panelled one, so
       * the flight-time uses (the launch prompt, lap splits, a crash
       * notice) shrink on a phone by the same rule rather than needing
       * their own. 22 characters of 22em is still the line length cap; this
       * only decides how big those characters are.
       */
      :root { --banner-size: clamp(17px, 4.4vw, 30px); }

      .banner.panel {
        background: rgba(16, 22, 17, 0.92); border-radius: 4px;
        padding: 18px 24px; box-shadow: inset 0 0 0 1px rgba(255, 212, 92, 0.45);
        font-size: var(--banner-size); color: var(--cream); line-height: 1.35;
        max-width: min(92vw, 22em); white-space: pre-wrap; transition: none;
      }
      .banner {
        /* 22 percent, not 38. A regulation gate's aperture centre sits at
           0.762 m and the FPV camera is tilted up, so the target lands low in
           the frame, and a pilot found the launch banner drawn directly over
           the one thing they need to find. */
        /* And under the OSD's top block, not centred on 22 percent: at 22
           percent a two line banner (a lap's time and record, the launch
           prompt) landed on the block's last lap, record and ghost lines and
           the two read as one smear (2026-09-26). 150 px clears the block,
           as .edge found, and keeps the banner high in the frame. */
        position: absolute; left: 50%; top: calc(var(--bar-top) + 150px); transform: translate(-50%, 0);
        text-align: center; white-space: pre-wrap; font-size: var(--banner-size); font-weight: 600;
        letter-spacing: 0.04em; color: var(--amber); opacity: 0;
        transition: opacity 0.18s ease; text-shadow: 0 3px 10px rgba(0,0,0,0.9);
        max-width: min(92vw, 22em);
      }
      /* One line under the OSD's top block, for a message about a craft the
         camera is looking at. The panel sat over the middle third, and the
         chase camera aims at the wreck, so a pilot watching a crash settle
         watched a box instead. 150 px clears the top block with a race's
         gate, best and ghost lines under the timer. */
      .banner.edge {
        top: calc(var(--bar-top) + 150px); transform: translate(-50%, 0);
        font-size: clamp(14px, 1.9vw, 18px); letter-spacing: 0.03em; line-height: 1.3;
        padding: 3px 12px; border-radius: 4px; background: rgba(16, 22, 17, 0.62);
        max-width: min(92vw, 40em); width: max-content;
      }

      /* Screens. */
      .screen {
        position: absolute; inset: 0; pointer-events: none;
        display: flex; flex-direction: column; align-items: center;
        /* Stops the double-tap zoom that maximum-scale used to be here for,
           and keeps the pinch zoom it also blocked. See the viewport note in
           the head. */
        touch-action: manipulation;
        /*
         * SAFE CENTRE, not centre.
         *
         * A centred flex column whose content is taller than the box
         * overflows in BOTH directions, and the half that goes off the top
         * cannot be scrolled back to: that is the classic centring bug, and
         * on a 390 px phone it is most of a screen. `safe` falls back to
         * flex-start the moment the content stops fitting, which is the
         * only time the difference is visible.
         */
        justify-content: safe center;
        padding: calc(2vh + var(--bar-top)) 6vw calc(2vh + var(--bar-bot));
        box-sizing: border-box;
        /* Enough scrim to read type over a bright valley, not enough to
           turn a warm afternoon into night. Forest-tinted, not navy. */
        background:
          radial-gradient(120% 90% at 50% 42%, rgba(18, 26, 18, 0.58), rgba(12, 18, 14, 0.76));
      }
      /* The title is a HUD over the live map. Copy on the left (or top
         and bottom on a phone), the world and the flying airframe fill
         the rest. The wash is a hole, not a second landscape. */
      .screen-title {
        display: flex;
        flex-direction: column;
        align-items: stretch;
        justify-content: stretch;
        width: 100%;
        height: 100%;
        padding: 4.5vh 4vw calc(1.5vh + var(--bar-bot));
        background:
          linear-gradient(90deg, rgba(12, 18, 14, 0.78) 0%, rgba(12, 18, 14, 0.42) 26%, rgba(12, 18, 14, 0.08) 52%, rgba(12, 18, 14, 0.10) 100%),
          linear-gradient(180deg, rgba(12, 18, 14, 0.32) 0%, transparent 22%, transparent 64%, rgba(12, 18, 14, 0.38) 100%);
      }
      .title-copy {
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        width: min(36em, 46vw);
        height: 100%;
        min-width: 0;
        min-height: 0;
        z-index: 1;
      }
      /*
       * A PAGE SCREEN SCROLLS RATHER THAN LOSING WHAT IT CANNOT FIT.
       *
       * The flex fitting above and in the breakpoints keeps almost every
       * window from needing this. `Almost` is the problem: a 844 by 390
       * phone in landscape has 294 px of usable height, and the Rates
       * screen is a live curve, thirteen rows and a note. It cannot fit,
       * and before this the part that did not fit was simply gone, with no
       * scrollbar and no way to reach it.
       *
       * The Race and Freestyle rooms already scrolled, which is why their
       * card grids are usable on a phone. This is that, for every page.
       * `safe center` on .screen is the other half: without it the overflow
       * goes off the top as well and cannot be scrolled back to.
       *
       * overscroll-behavior stops a flick at the end of the list turning
       * into a pull-to-refresh on the page behind it.
       */
      .screen-page,
      .screen-modal {
        justify-content: safe center;
        overflow-y: auto;
        overscroll-behavior: contain;
      }
      /* One line under a screen's title, saying what the screen is showing
         when the screen is showing a filtered view of something. Slate,
         because it recedes: it is context, not an instruction. */
      .screen-lede {
        margin: -6px 0 14px;
        color: var(--slate);
        font-size: 13.5px;
        line-height: 1.5;
        max-width: 34em;
        text-shadow: 0 1px 8px rgba(0, 0, 0, 0.65);
      }
      .screen-lede:empty { display: none; }
      /*
       * The pause menu is a modal, not a page, and it had neither a
       * scroller of its own above 540 px of height nor a height cap. At
       * 1280 by 720 that put Quit to title 242 px below the window with no
       * way to reach it: a pilot who paused a run could not quit it.
       */

      /*
       * The flight-controller screen, restored. Configurator 10.10
       * (firmware 4.5.1 era): #ffbb00 header, #4d4d4d body, dark left
       * tabs. Homage: our layout, system fonts, no Vue, no MSP, no
       * iframe, and no CLI paste anywhere. Title and Settings stay cream
       * and sakura; this screen alone wears the yellow.
       */
      .screen-fc {
        --bf-accent: #ffbb00;
        --bf-ink: #1a1a1a;
        --bf-bg: #4d4d4d;
        --bf-header: #393b3e;
        --bf-panel: #414141;
        --bf-box: #3a3a3a;
        --bf-text: #ffffff;
        --bf-muted: #c5c5c5;
        --bf-grey: #9c9c9c;
        align-items: stretch;
        justify-content: flex-start;
        padding: 0;
        background: var(--bf-bg);
        color: var(--bf-text);
        font-family: "Segoe UI", system-ui, sans-serif;
      }
      .fc-head {
        flex: 0 0 auto;
        background: var(--bf-accent);
        color: var(--bf-ink);
        padding: 8px 14px 7px;
        pointer-events: auto;
      }
      .fc-brand { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
      .fc-wordmark { font-size: 22px; font-weight: 800; letter-spacing: 0.14em; line-height: 1; }
      .fc-fw, .fc-conn {
        font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase;
      }
      .fc-dirty {
        margin-left: auto; color: var(--bf-ink);
        font-size: 11px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase;
      }
      .fc-dirty:empty { display: none; }
      .fc-homage { margin: 4px 0 0; max-width: 86em; color: #3a3208; font-size: 11px; line-height: 1.4; }
      .fc-homage a { color: var(--bf-ink); font-weight: 700; pointer-events: auto; }
      .fc-exit {
        flex: 0 0 auto; display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
        padding: 8px 14px; background: #2a2a2a; border-bottom: 1px solid #1a1a1a;
        pointer-events: auto;
      }
      .fc-exit[hidden] { display: none !important; }
      .fc-exit-btn {
        border: 0; border-radius: 4px; font: inherit; font-size: 13px; font-weight: 800;
        letter-spacing: 0.02em; padding: 8px 14px; cursor: pointer;
      }
      .fc-exit-save { background: var(--bf-accent); color: var(--bf-ink); }
      .fc-exit-save:hover, .fc-exit-save:focus-visible { background: #ffd24d; outline: none; }
      .fc-exit-save[hidden] { display: none; }
      .fc-exit-leave { background: #5c5c5c; color: #fff; }
      .fc-exit-leave:hover, .fc-exit-leave:focus-visible { background: #6e6e6e; outline: none; }
      .fc-exit-hint {
        margin-left: auto; display: flex; align-items: center; gap: 8px;
        color: var(--bf-muted); font-size: 13px; font-weight: 650;
      }
      .fc-exit-hint kbd {
        display: inline-block; min-width: 1.6em; padding: 2px 6px; border-radius: 3px;
        background: #1a1a1a; color: var(--bf-accent);
        font: 700 12px/1.2 ui-monospace, "Cascadia Mono", monospace;
        text-align: center; box-shadow: 0 1px 0 #000;
      }
      .fc-body { display: flex; gap: 0; flex: 1 1 auto; min-height: 0; width: 100%; pointer-events: auto; }
      .fc-tabs {
        flex: 0 0 12.5em; overflow-y: auto; background: var(--bf-header); padding: 8px 0;
        pointer-events: auto; scrollbar-width: thin; scrollbar-color: #ffbb00 #2e2e2e;
      }
      .fc-tab {
        display: block; width: 100%; text-align: left; border: 0; background: transparent;
        color: var(--bf-text); font: inherit; font-size: 13px; padding: 7px 12px 7px 14px;
        cursor: pointer; border-left: 3px solid transparent;
      }
      .fc-tab:hover { background: rgba(255, 187, 0, 0.08); }
      .fc-tab.on {
        background: var(--bf-panel); border-left-color: var(--bf-accent);
        color: var(--bf-accent); font-weight: 650;
      }
      .fc-tab.grey { color: var(--bf-grey); }
      .fc-tab.grey.on { color: var(--bf-muted); border-left-color: var(--bf-grey); }
      .fc-work {
        flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column;
        min-height: 0; background: var(--bf-panel); overflow: auto;
      }
      .fc-pages {
        display: flex; gap: 0; flex: 0 0 auto; position: sticky; top: 0; z-index: 2;
        background: var(--bf-header); border-bottom: 1px solid #2a2a2a;
      }
      .fc-pages[hidden] { display: none !important; }
      .fc-page {
        border: 0; background: transparent; color: var(--bf-muted); font: inherit;
        font-size: 13px; font-weight: 650; letter-spacing: 0.03em;
        padding: 8px 12px; cursor: pointer; border-bottom: 3px solid transparent;
      }
      .fc-page.on { color: var(--bf-accent); border-bottom-color: var(--bf-accent); background: var(--bf-panel); }
      .screen-fc .menu-stage {
        display: grid;
        grid-template-columns: 1fr minmax(14em, 22em);
        align-items: stretch;
        flex: 1 1 0;
        min-height: 0;
        width: 100%;
        margin-top: 0;
      }
      .screen-fc .menu-stage .menu {
        grid-column: 1; background: var(--bf-box); border-top: 0; border-radius: 0;
        box-shadow: none; min-width: 0; width: 100%; height: 100%; margin-top: 0;
        /* A little air at the top. The header strip above overlaps the
         * first row by about ten pixels, which never showed while the first
         * row was a Tab picker under a page strip and does show the moment
         * a confirm panel puts a real row against the ceiling. */
        padding: 6px 0 12px;
      }
      .screen-fc .menu-scroll { max-height: none; height: 100%; scrollbar-color: #ffbb00 #2e2e2e; }
      .screen-fc .menu-help {
        grid-column: 2; color: var(--bf-muted); border-left: 1px solid #2a2a2a;
        background: var(--bf-header); padding: 12px 14px; max-width: none;
      }
      .screen-fc .row { gap: 10px; padding: 7px 16px 7px 18px; font-size: 13px; color: var(--bf-text); }
      .screen-fc .row.on {
        color: var(--bf-text); border-left-color: var(--bf-accent);
        background: linear-gradient(90deg, rgba(255, 187, 0, 0.16), rgba(255, 187, 0, 0) 48%);
      }
      .screen-fc .row-label { font-family: inherit; font-size: 13px; }
      .screen-fc .row-value {
        max-width: none; overflow: visible; text-overflow: clip; color: var(--bf-accent);
      }
      .screen-fc .row-grey { color: var(--bf-grey); }
      .screen-fc .row-grey .row-value { color: var(--bf-grey); }
      .screen-fc .row-gated .row-value { color: var(--bf-accent); }
      .screen-fc .fc-section {
        color: var(--bf-accent); font-size: 11px; font-weight: 800;
        letter-spacing: 0.12em; text-transform: uppercase;
        border-bottom: 1px solid #555; margin-top: 8px; pointer-events: none;
      }
      /*
       * PINNED. Save was a row inside the scrolling list, so after typing a
       * value into the last live field of the PID Profile page a pilot had
       * to arrow back up 96 rows to reach it. The bar is built into the
       * list so it keeps its place in the cursor order, and sticky is what
       * keeps it on screen without moving it out of that order.
       */
      .screen-fc .fc-bar {
        display: flex; gap: 8px; padding: 10px 12px 6px; flex-wrap: wrap;
        position: sticky; top: 0; z-index: 2;
        background: var(--bf-panel);
        box-shadow: 0 6px 10px -6px rgba(0, 0, 0, 0.55);
      }
      .screen-fc .fc-btn {
        background: var(--bf-accent); color: var(--bf-ink); font-weight: 700; margin: 0;
        border-radius: 3px; border-left: 0; flex: 1 1 6em; justify-content: center;
        padding: 8px 10px;
      }
      .screen-fc .fc-btn .row-label { color: var(--bf-ink); font-weight: 700; }
      .screen-fc .fc-btn.on { background: #ffd24d; color: var(--bf-ink); border-left: 0; }
      .fc-status {
        flex: 0 0 auto; background: var(--bf-accent); color: var(--bf-ink);
        font-size: 11px; font-weight: 650; letter-spacing: 0.04em; padding: 5px 14px;
        pointer-events: auto;
      }
      .fc-attitude {
        display: block; margin: 12px 16px; width: 220px; height: 220px;
        background: #2e2e2e; border: 1px solid #6b6b6b; pointer-events: none;
      }
      .fc-attitude[hidden] { display: none !important; }
      @media (max-width: 900px) {
        .screen-fc .menu-stage { grid-template-columns: minmax(0, 1fr); }
        .screen-fc .menu-help { grid-column: auto; max-width: none; border-left: none; }
        .fc-tabs { flex: 0 0 8.5em; }
        .fc-wordmark { font-size: 16px; }
      }
      .screen-maps {
        justify-content: flex-start;
        padding-top: 7vh;
      }
      .screen h1:not(.lockup) {
        margin: 0; font-size: clamp(44px, 8vw, 104px); font-weight: 800;
        letter-spacing: 0.08em; padding-left: 0.02em; color: var(--cream);
        line-height: 0.92;
        text-shadow: 3px 3px 0 rgba(20, 28, 20, 0.82), 0 10px 28px rgba(0, 0, 0, 0.32);
      }
      /*
       * THE NAME, as the owner's key art sets it: PARAGUAYAN thin and spaced
       * over a rule, DRONE COMBAT huge, bold and condensed on two lines,
       * SIMULATOR between two rules, and Paraguay's red, white and blue as
       * one slash down the left. One lockup, on the loading screen and as
       * the title's heading, sized by its font-size alone: every part is in
       * its em, so a page sets one number per window and nothing else.
       *
       * Still no webfont (the page's rule, see the top of this file): every
       * desktop has a narrow sans under one of these names, Android answers
       * to sans-serif-condensed, and font-stretch asks Apple's system face
       * for its condensed width.
       */
      .lockup {
        position: relative; display: inline-flex; flex-direction: column;
        margin: 0; padding: 0 0 0 0.7em;
        font-family: var(--ui-font); font-weight: 500; line-height: 1;
        letter-spacing: 0; color: #f7f2e6; text-shadow: none;
      }
      /* Skewed about its middle, so its foot sits on the box's left edge and
         its head just clear of the P: the padding above is that lean. */
      .lockup-slash {
        position: absolute; left: 0.29em; top: 0.02em; bottom: 0.02em;
        width: 0.07em;
        transform: skewX(-14deg);
        background: linear-gradient(180deg, #d52b1e 0 33.4%, #f4f1ea 33.4% 66.6%, #0038a8 66.6% 100%);
        box-shadow: 0 0 0.16em rgba(0, 0, 0, 0.45);
      }
      .lockup-over, .lockup-under {
        display: flex; align-items: center; gap: 0.9em;
        font-size: max(0.24em, 9px); line-height: 1;
        letter-spacing: 0.42em; text-transform: uppercase; white-space: nowrap;
        color: rgba(243, 234, 212, 0.9);
        text-shadow: 0 1px 8px rgba(0, 0, 0, 0.6);
      }
      .lockup-over::after, .lockup-under::before, .lockup-under::after {
        content: ""; flex: 1; min-width: 1.5em; height: 1px;
        background: rgba(243, 234, 212, 0.42);
      }
      /* The letter spacing trails the last letter, so the rule before the
         word takes the same space and the word sits in the middle. */
      .lockup-under::before { margin-right: 0.42em; }
      .lockup-name {
        margin: 0.1em 0 0.09em;
        font-family: "Arial Narrow", "Liberation Sans Narrow", "Nimbus Sans Narrow", "Roboto Condensed", sans-serif-condensed, var(--ui-font);
        font-stretch: condensed; font-weight: 700;
        line-height: 0.84; letter-spacing: 0.01em; text-transform: uppercase;
        text-shadow: 0 0.03em 0 rgba(8, 10, 9, 0.55), 0 0.08em 0.3em rgba(0, 0, 0, 0.5);
      }
      .lockup-name > span { display: block; }
      .screen-title .wordmark { font-size: clamp(44px, 4.6vw, 96px); }
      /* In a short window the gate's Beta line stands beside the name
         rather than under it, where it would take the height the cards and
         the rooms panel need: at 1280 by 720 it put the cards against it.
         A tall window has that height and keeps the line under the name,
         and an upright phone stacks them again (the 860 px rule). */
      @media (max-height: 820px) {
        .screen-title.is-gate .brand {
          display: grid; grid-template-columns: auto minmax(0, 16rem);
          justify-content: start; column-gap: clamp(18px, 2vw, 32px); align-items: end;
        }
        .screen-title.is-gate .brand .beta-note { margin: 0 0 0.2em; }
      }
      /* On a phone the rule after PARAGUAYAN runs under the sign in chip,
         which sits level with it in the top right corner and is wider in
         Spanish (Iniciar sesión con Google reaches x 181 of 390). The word
         keeps its place; the rule goes. */
      @media (max-width: 600px) {
        .screen-title .lockup-over::after { display: none; }
      }
      .screen h2 {
        margin: 0 0 18px; font-size: clamp(24px, 3.4vw, 40px); font-weight: 700;
        letter-spacing: 0.04em; color: var(--cream);
      }
      .screen-maps h2 {
        align-self: flex-start;
        margin-bottom: 8px;
      }
      .screen-maps h2::after {
        content: "";
        display: block;
        width: 36px; height: 2px;
        background: var(--sakura);
        margin-top: 10px;
      }
      .screen h3 {
        margin: 0 0 10px; font-size: 15px; font-weight: 700; color: var(--sakura);
        letter-spacing: 0.12em; text-transform: uppercase;
      }
      .brand { text-align: center; margin-bottom: 34px; }
      .screen-title .brand {
        text-align: left;
        margin-bottom: 0;
        max-width: 36em;
      }
      .brand-sub {
        display: flex; align-items: center; gap: 12px;
        margin-top: 12px; font-size: clamp(13px, 1.4vw, 16px); color: #d8d2c0;
        letter-spacing: 0.28em; text-transform: uppercase;
      }
      .brand-sub:empty, .brand-best:empty { display: none; }
      .brand-sub::before {
        content: "";
        width: 36px; height: 2px; flex: 0 0 auto;
        background: var(--sakura);
      }
      .brand-best {
        display: inline-flex; align-items: center; gap: 8px;
        margin-top: 16px; padding: 7px 14px; border-radius: 3px;
        font-size: 14px; color: var(--cream); letter-spacing: 0.05em;
        background: rgba(16, 22, 17, 0.62);
        box-shadow: inset 0 0 0 1px rgba(232, 168, 184, 0.45);
      }
      .brand-best-time { color: var(--mint); font-weight: 650; }
      /* The beta notice. Amber, because it is an instrument reading on
         the software rather than a record or a piece of chrome, and it
         keeps the same left edge as everything else in the brand block so
         it reads as part of the title rather than as a bolted on toast. */
      .beta-note {
        display: flex; align-items: baseline; gap: 10px;
        max-width: 34em; margin: 14px 0 0;
        font-size: 13.5px; line-height: 1.6; letter-spacing: 0.01em;
        color: rgba(235, 230, 215, 0.78);
      }
      .beta-tag {
        flex: 0 0 auto;
        padding: 3px 9px; border-radius: 3px;
        font-size: 11px; font-weight: 700; letter-spacing: 0.18em;
        text-transform: uppercase; color: var(--amber);
        background: rgba(16, 22, 17, 0.62);
        box-shadow: inset 0 0 0 1px rgba(255, 212, 92, 0.45);
      }
      .screen-title .beta-note { text-shadow: 0 1px 8px rgba(0, 0, 0, 0.65); }
      .keep-note {
        max-width: 34em; margin: 14px 0 0; color: rgba(235, 230, 215, 0.72);
        font-size: 13.5px; line-height: 1.6; letter-spacing: 0.01em;
      }
      /* First run swaps the storage warning, which is a returning pilot's
         problem, for the one sentence that gets somebody airborne. */
      /* :not(.first-note) because the first note IS a keep-note, so the
         plain .keep-note hide below would match it at the same specificity
         and, being later, win. */
      .first-note { display: none; }
      .screen-title.is-first .first-note { display: block; }
      .screen-title.is-first .keep-note:not(.first-note),
      .screen-title.is-first .brand-best,
      .screen-title.is-first .wiki-teaser { display: none; }
      /* The gate. Everything about a seat comes off the screen, because
         the pilot has not said yet whether they are flying it, and
         everything about the product comes off too: the gate is one
         question and the three cards under it are the whole answer. The
         Beta line stays, because a pilot about to meet a bug should be told
         before the lap and not after it. */
      .screen-title.is-gate .keep-note,
      .screen-title.is-gate .brand-sub,
      .screen-title.is-gate .wiki-teaser,
      .screen-title.is-gate .brand-best { display: none; }
      /*
       * THE GATE'S TWO CARDS.
       *
       * The first screen asks one question and these are the answer, so
       * they are the only thing on it that is not the wordmark. They are a
       * third child of `.title-copy` and `display: none` in every other
       * state, which is what keeps the two child `space-between` contract
       * the menu states depend on: a hidden flex child does not lay out.
       *
       * The pictures are assets/gate/*.jpg, frames of this renderer written
       * by scripts/gatecards.js. Regenerate them, do not edit them.
       *
       * `.screen` is pointer-events: none and every clickable thing on it
       * opts back in, so these do too.
       */
      .gate-cards { display: none; }
      /* The menu column is 36em of the window; the gate is the page, so it
         takes the width back. 64em was two cards' worth and left three of
         them huddled in the left two thirds of a wide screen, so it is the
         width three want. The world behind it still shows around and under
         them. */
      .screen-title.is-gate .title-copy {
        width: min(78em, 94vw);
        justify-content: flex-start;
      }
      .screen-title.is-gate .gate-cards {
        display: flex;
        align-items: stretch;
        gap: clamp(12px, 1.6vw, 24px);
        width: 100%;
        /* Pushed to the bottom of the column, which is where the menu is
           on every other state of this screen: answering the gate then
           swaps one block for another in the same place instead of moving
           the page. Auto only ever takes free space, so on a short window
           the gap closes to nothing rather than pushing the cards off. */
        margin: auto 0 0;
        pointer-events: auto;
      }
      /* An empty menu still paints its plate and its sakura top line, so
         a title screen with no rows shows a bar that means nothing. The
         gate is where that normally happens, because it has no rows unless
         a radio is in trouble, and this rule used to be scoped to it. That
         scope is what turned a wrong is-gate into the empty front page the
         owner reported: the cards were hidden by their own rule and this
         one did not fire, so a bare strip was the whole menu. Unscoped, an
         empty menu is invisible in EVERY title state, whatever answered
         which question, and the class of bug is ugly rather than fatal. */
      .screen-title .menu:empty { display: none; }
      /* The foot keeps its own auto margin in every other state, where it
         is what pins the menu to the bottom. Here the cards are that block,
         so the foot gives the space up rather than splitting it. */
      .screen-title.is-gate .title-foot { margin-top: 0; }
      /*
       * THE GATE'S ROOMS PANEL, beside the wordmark (src/ui/ui.js
       * renderTitleRooms). The brand and it share .title-top, which is a
       * plain block, the brand alone in it, in every state but the gate.
       * The panel stops short of the right edge, where the sign in chip and
       * the music dock sit over the page (.signin-chip, .music-dock): the
       * dock is at most about 190 px wide with its longest title, 16 px in.
       */
      .gate-rooms { display: none; }
      .screen-title.is-gate .title-top {
        display: flex; align-items: flex-end; gap: clamp(16px, 2.4vw, 40px);
      }
      .screen-title.is-gate .brand { flex: 0 1 auto; min-width: 0; }
      .screen-title.is-gate .gate-rooms:not([hidden]) {
        display: flex; flex-direction: column; gap: 7px;
        flex: 0 1 31em; min-width: 0;
        margin: 0 clamp(190px, 16vw, 210px) 0 auto;
        padding: 10px 12px 11px;
        border-radius: 4px;
        background: rgba(16, 22, 17, 0.8);
        border-top: 2px solid var(--mint);
        box-shadow: inset 0 0 0 1px rgba(244, 236, 214, 0.10);
        pointer-events: auto;
      }
      .gate-rooms-head { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
      .gate-rooms-title {
        flex: 0 0 auto;
        font-size: 12px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; color: var(--sakura);
      }
      .gate-rooms-count {
        min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        font-size: 14px; font-weight: 650; color: var(--mint);
      }
      .gate-rooms-list, .gate-rooms-buttons { display: flex; gap: 6px; min-width: 0; }
      .gate-room {
        flex: 1 1 0; min-width: 0;
        display: flex; flex-direction: column; justify-content: center; gap: 1px;
        padding: 6px 10px; border-radius: 3px; cursor: pointer;
        background: rgba(244, 236, 214, 0.06);
        box-shadow: inset 0 0 0 1px rgba(244, 236, 214, 0.12);
      }
      .gate-room-name, .gate-room-value { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .gate-room-name { font-size: 14.5px; font-weight: 650; color: var(--cream); }
      .gate-room-value { font-size: 12px; color: rgba(235, 230, 215, 0.72); }
      .gate-room-all, .gate-room-make { align-items: center; }
      .gate-room-make .gate-room-name { color: var(--mint); }
      .gate-room.on { background: rgba(125, 255, 180, 0.16); box-shadow: inset 0 0 0 2px var(--sakura); }
      .gate-room.on .gate-room-name { color: var(--sakura); }
      .gate-room:focus-visible { outline: 2px solid var(--mint); outline-offset: 2px; }
      .gate-card {
        flex: 1 1 0;
        min-width: 0;
        display: flex;
        flex-direction: column;
        cursor: pointer;
        border-radius: 4px;
        overflow: hidden;
        background: rgba(16, 22, 17, 0.78);
        border-top: 2px solid rgba(232, 168, 184, 0.28);
        box-shadow: inset 0 0 0 1px rgba(244, 236, 214, 0.10);
        transition: transform 0.14s ease, box-shadow 0.14s ease, border-color 0.14s ease;
      }
      /* Same lift and the same sakura ring the picker cards use, so a card
         that is chosen looks chosen in the same way everywhere. */
      .gate-card.on {
        transform: translateY(-4px);
        border-top-color: var(--sakura);
        box-shadow: inset 0 0 0 2px var(--sakura), 0 14px 32px rgba(0, 0, 0, 0.5);
      }
      .gate-card:focus-visible { outline: 2px solid var(--mint); outline-offset: 3px; }
      .gate-card-art {
        position: relative;
        width: 100%;
        height: clamp(120px, 24vh, 260px);
        background: #1a241c;
        overflow: hidden;
      }
      .gate-card-shot {
        width: 100%; height: 100%;
        display: block; object-fit: cover;
        /* The type sits under the picture, not on it, but the join is
           softened so the card reads as one object. */
        filter: saturate(1.02);
      }
      .gate-card-art::after {
        content: "";
        position: absolute; inset: 0;
        background: linear-gradient(180deg, rgba(12, 18, 14, 0) 52%, rgba(16, 22, 17, 0.85) 100%);
      }
      /* Above the gradient the rule before this one lays over the picture,
         which is the only reason this needs a stacking order at all. */
      .gate-card-mark { z-index: 1; }
      .gate-card-body {
        display: flex; flex-direction: column; gap: 7px;
        padding: 12px 16px 15px;
      }
      .gate-card-name {
        color: var(--cream);
        font-size: clamp(19px, 1.9vw, 26px);
        font-weight: 650;
        letter-spacing: 0.02em;
        line-height: 1.1;
      }
      .gate-card.on .gate-card-name { color: var(--sakura); }
      /* Five lines at most. Three cards share the width, and Free Flight's
         sentence is a list of every plane: at 1280 by 720 it ran to
         thirteen lines and put its own tags under the command bar. The
         name and the tags are the answer; the sentence is its gloss. */
      .gate-card-blurb {
        margin: 0;
        color: rgba(235, 230, 215, 0.74);
        font-size: 13.5px; line-height: 1.55; letter-spacing: 0.01em;
        display: -webkit-box;
        -webkit-box-orient: vertical;
        -webkit-line-clamp: 5;
        line-clamp: 5;
        overflow: hidden;
      }
      /* What each mode actually gives you, in three words each. Mint is the
         colour this product paints a record in, so it is Race's; Freestyle's
         are the cool mist that recedes, which is the point of them. */
      .gate-card-facts {
        display: flex; flex-wrap: wrap; gap: 4px 14px;
        margin-top: 2px;
        font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase;
      }
      .gate-card-race-5inch .gate-card-fact { color: var(--mint); }
      /* Defend Itaipu's picture is the map's poster, graded down to a cold
         grey so the one mature card reads as the odd one out in the row. */
      .gate-card-war .gate-card-shot { filter: saturate(0.35) contrast(1.12) brightness(0.86); }
      .gate-card-war .gate-card-fact { color: rgba(235, 230, 215, 0.62); }
      /*
       * The plan drawing over the corner of each photograph.
       *
       * Both machines are drawn in one 300 mm viewBox, so the whoop's mark
       * is a fifth of the width of the five inch's because it is a fifth of
       * the width of it on a bench. The BOX is the same size on all three
       * cards for exactly that reason: scale it to the drawing and the one
       * fact it is here to carry is the fact it throws away. See craftSvg in
       * src/ui/ui.js.
       */
      .gate-card-mark {
        position: absolute;
        left: 10px; bottom: 8px;
        width: clamp(52px, 5.2vw, 76px);
        height: clamp(52px, 5.2vw, 76px);
        display: grid; place-items: center;
        pointer-events: none;
        /* Over a lit field and over a dark room, so it carries its own
           ground rather than trusting whatever is behind it. */
        border-radius: 3px;
        background: radial-gradient(closest-side, rgba(12, 18, 14, 0.72), rgba(12, 18, 14, 0.18));
      }
      .craft-plan { width: 100%; height: 100%; color: var(--cream); }

      .wiki-teaser {
        display: inline-flex; align-items: center; gap: 10px;
        margin: 14px 0 0; padding: 0; border: 0; background: none;
        color: var(--sakura); font: inherit; font-size: 13.5px;
        letter-spacing: 0.12em; text-transform: uppercase;
        cursor: pointer; pointer-events: auto; text-align: left;
        text-shadow: 0 1px 8px rgba(0, 0, 0, 0.65);
      }
      .wiki-teaser:hover, .wiki-teaser:focus-visible { color: var(--cream); }
      .wiki-teaser::before {
        content: "";
        width: 28px; height: 2px; flex: 0 0 auto;
        background: var(--sakura);
      }
      .screen-title .brand-sub {
        text-shadow: 0 1px 8px rgba(0, 0, 0, 0.75);
      }
      .screen-title .keep-note {
        margin-left: 0;
        margin-right: auto;
        text-shadow: 0 1px 8px rgba(0, 0, 0, 0.65);
      }

      /* The menu is a fixed-width centre column. Help text lives in the
         right column so a long note cannot grow the list and shove the
         whole screen around. 1fr / auto / 1fr keeps the rows centred.
         The title pins the same note ABOVE the footer, out of flow, so
         a longer hover line cannot drop the rows. */
      /* SYMMETRIC, so the menu is centred where the heading says it is.
         The columns used to be 1.7fr / auto / 0.65fr, which put the panel
         195 px right of a centred h2 on a 1440 px screen: the heading and
         the thing it names did not line up on Paused or How to fly. The
         screens that fill column one (Settings' airframe studio) override
         this below; nothing else was using the extra width. */
      .menu-stage {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
        /*
         * 100% of the PADDED BOX, not a slice of the viewport.
         *
         * .screen already spends 6vw a side on padding, so a stage sized in
