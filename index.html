         * vw is wider than the box holding it and hangs off the edge: at
         * 390 px that is 8 px of the row list past the right of the window,
         * on a device with no horizontal scrollbar to find it with. The
         * Rates screen was pinned to 100% for exactly this reason and the
         * comment there says so; the rest of the screens were not.
         */
        width: 100%;
        max-width: 1600px;
        align-items: start;
        margin-top: 22px;
        pointer-events: none;
      }
      /*
       * QUAD, not Pilot. These two rules and the block under them size the
       * airframe showcase's column, and the showcase moved to the Quad room
       * with the machine it is a picture of. Left on .screen-pilot they gave
       * Pilot a 360 px first column with nothing in it, which is why its
       * menu sat right of centre, and gave Quad no column for the quad.
       */
      .screen-quad .menu-stage {
        width: 100%;
        max-width: 1600px;
        /*
         * The help column has a MINIMUM. At 1180 by 820 the first two
         * columns took 360 and 628 and left it 50 px, so the note wrapped
         * to one word per line and grew to 1451 px tall: the column that
         * exists to explain the row became the reason the row was off the
         * screen. A column that cannot do its job should push the layout to
         * stack instead, which is what a minimum makes it do.
         */
        grid-template-columns: minmax(360px, 1.7fr) auto minmax(210px, 0.65fr);
      }
      /*
       * The airframe is sized by the column's WIDTH and drawn square, so a
       * wide short window makes it taller than the window. At 1180 by 820
       * the first column is about 600 px, so the quad was 600 px tall in a
       * box 700 px high and pushed the help column 373 px past the bottom.
       * A height cap costs nothing on a tall window and is the whole fix on
       * a short one.
       */
      .screen-quad .craft-showcase-frame { max-height: min(46vh, 420px); }
      /*
       * THE QUAD LIST GETS THE ROOM THE COLUMN ALREADY HAS.
       *
       * The shared cap is min(58vh - bars, 34em), which on a 900 px window
       * is about 520 px. This screen draws that list BESIDE a square
       * airframe pose capped at 46vh, roughly 414 px, in a grid column of
       * its own, so the list was stopping 100 px short of the picture next
       * to it and scrolling for want of space nothing else wanted.
       *
       * The Aircraft row is what made anybody measure it: scripts/shell-check.js
       * records this screen's overflow and fails when it grows, and one more
       * row grew it by 45 px. The answer is not to take a control away and it
       * is not to re-record the baseline. It is that a three column screen
       * whose tallest element is 414 px should not cap its list at a height
       * that makes it scroll while the column beside it has slack.
       *
       * 68vh is still under the picture plus the heading, the lede and the
       * hint line on every window this screen draws three columns on, which
       * is 1281 px wide and up.
       */
      .screen-quad .menu-scroll { max-height: min(calc(68vh - var(--bars)), 40em); }
      /* In a room the Fly with friends screen has Fly, the Game heading and
         all three games' start rows to show before the first scroll (the
         owner hosted and never saw combat). The lede is about making and
         joining a room, so in one it goes and its height is the rows'. */
      .screen-friends.in-room .rates-lede { display: none; }
      .screen-friends.in-room .menu-scroll { max-height: min(calc(76vh - var(--bars)), 44em); }
      /*
       * The quad room on a laptop. Found by measuring the Rates screen
       * beside it: below about 1100 px the three columns cannot fit their
       * own minimums (360 for the quad plus 540 for the menu is already 900
       * before the note column), so the stage overflowed and the menu slid
       * off the right of the window entirely. One column, quad on top, same
       * fallback Rates takes.
       */
      /*
       * 1280, not 1100. Three columns need 360 for the quad, about 540 for
       * the list and 210 for the note, plus the gaps: a shade over 1150
       * before anything is comfortable. Stacking at 1100 meant a 1180 px
       * tablet in landscape got three columns that did not fit.
       */
      @media (max-width: 1280px) {
        .screen-quad .menu-stage { grid-template-columns: minmax(0, 1fr); }
        .screen-quad .craft-showcase {
          grid-column: 1; grid-row: 1;
          justify-self: center; width: min(100%, 420px); margin: 0 0 12px;
        }
        .screen-quad .menu-stage .menu { grid-column: 1; justify-self: center; }
        .screen-quad .menu-help {
          grid-column: 1; max-width: none; border-left: 0;
          padding: 8px 14px 0; margin-top: 6px; text-align: center;
        }
      }
      .title-foot {
        display: flex;
        flex-direction: column;
        align-items: stretch;
        justify-content: flex-end;
        gap: 14px;
        width: 100%;
        margin-top: auto;
        position: relative;
        /* Shrinkable, so the menu inside it can be. Without this the
         * column keeps its content height and the overflow just moves
         * up a level. */
        min-height: 0;
      }
      /*
       * ELEVEN ROWS AND A SHORT WINDOW. The title menu is taller than a
       * laptop window can hold: measured at 1536 by 776 the menu ran to
       * 914 px, so Leaderboard, Credits and the report row sat below the
       * fold, invisible and unreachable by mouse. The column above it is
       * fixed copy, so the menu is the part that yields: it shrinks and
       * scrolls rather than running off the bottom. On a window with room
       * for all of it nothing here changes anything, because a flex item
       * only shrinks once it has to.
       */
      .screen-title .menu-stage {
        display: flex;
        flex-direction: column;
        position: static;
        width: 100%;
        margin-top: 0;
        flex: 0 1 auto;
        min-height: 0;
      }
      .screen-title .menu {
        min-height: 0;
        overflow-y: auto;
        overscroll-behavior: contain;
        scrollbar-width: thin;
        scrollbar-color: rgba(232, 168, 184, 0.45) rgba(16, 22, 17, 0.55);
      }
      .menu {
        min-width: min(540px, 82vw);
        margin-top: 16px;
        pointer-events: auto;
        padding: 10px 0 12px;
        border-radius: 4px;
        background: rgba(16, 22, 17, 0.72);
        box-shadow: inset 0 0 0 1px rgba(244, 236, 214, 0.10);
        border-top: 2px solid rgba(232, 168, 184, 0.55);
      }
      .screen-title .menu { min-width: 0; width: 100%; margin-top: 0; background: rgba(16, 22, 17, 0.55); }
      .menu-stage .menu { grid-column: 2; margin-top: 0; }
      .menu-scroll {
        max-height: min(calc(58vh - var(--bars)), 34em);
        overflow-y: auto;
        overscroll-behavior: contain;
        scrollbar-width: thin;
        scrollbar-color: rgba(232, 168, 184, 0.45) rgba(16, 22, 17, 0.55);
      }
      .menu-help {
        grid-column: 3;
        padding: 12px 12px 8px 22px;
        margin-top: 8px;
        max-width: 26em;
        color: rgba(235, 230, 215, 0.72);
        font-size: 14px;
        line-height: 1.55;
        overflow-wrap: break-word;
        border-left: 1px solid rgba(244, 236, 214, 0.16);
      }
      .menu-help:empty { border-left-color: transparent; padding: 0; }
      .screen-title .menu-help {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 100%;
        width: auto;
        max-width: none;
        margin: 0;
        padding: 0 4px 10px;
        height: auto;
        text-align: left;
        border: none;
        overflow: visible;
        pointer-events: none;
        grid-column: auto;
        grid-row: auto;
        text-shadow: 0 1px 8px rgba(0, 0, 0, 0.65);
      }
      .screen-title .menu-help:empty {
        padding: 0;
      }
      /*
       * The handoff between the two blocks of body copy in this column.
       * The note above grows upward out of flow and used to be painted on
       * top of the keep note; see syncCursor in src/ui/ui.js for the
       * measurement. Opacity, not display, so nothing moves while it
       * happens and the text stays where a screen reader can find it.
       */
      .screen-title .keep-note,
      .screen-title .first-note {
        transition: opacity 140ms ease;
      }
      .screen-title.has-help .keep-note,
      .screen-title.has-help .first-note {
        opacity: 0;
      }
      /*
       * AND THE TEASER, which is the third block of copy in this column and
       * was left out of the handoff above. The note grows upward out of
       * flow from the menu's top edge and lands exactly on it, so the front
       * page drew two sentences on top of each other the moment the cursor
       * moved off Fly: "2022 AU Nationals, and every other track" printed
       * through "Simulating FPV, for nerds". Same transition as its two
       * neighbours so the three fade as one block.
       *
       * pointer-events with the opacity, because unlike the notes this one
       * is a BUTTON, and a button that is invisible but still clickable is
       * worse than one that is not there.
       */
      .screen-title .wiki-teaser {
        transition: opacity 140ms ease;
      }
      .screen-title.has-help .wiki-teaser {
        opacity: 0;
        pointer-events: none;
      }
      .craft-showcase {
        grid-column: 1;
        justify-self: end;
        align-self: center;
        width: min(100%, 760px);
        margin-right: 12px;
        pointer-events: auto;
        overflow: hidden;
        border-radius: 16px;
        background: #1a241c;
        box-shadow: 0 18px 32px rgba(0, 0, 0, 0.5), inset 0 0 0 1px rgba(244, 236, 214, 0.10);
      }
      /* ------------------------------------------------------------------
         THE TRICK LIST. A picture of every trick the town will score, drawn
         from the same definition the scorer matches against.

         The film is a canvas rather than a video or a sprite sheet: it is
         generated from the pattern, so it costs no asset, it can never fall
         out of step with the catalogue, and it is sharp at any size. It is
         also the only thing in this shell that asks for frames outside
         flight, which is why it lives on one screen and stops when that
         screen is left. See src/ui/trickfilm.js.
         ------------------------------------------------------------------ */
      .trick-stage {
        display: grid;
        /*
         * The film's column is the FILM'S WIDTH, not a fraction of the
         * page. It was 1.35fr, which was right while the film filled it,
         * and once the film was given a height budget the column stayed
         * the old width: the picture sat on the left, the words sat six
         * hundred pixels away on the right, and the middle of the screen
         * was empty. Naming the track with the same expression the film
         * is sized by keeps the two together at every window size.
         */
        grid-template-columns: calc(min(27vh, 280px) * 1.6) minmax(0, 1fr);
        gap: 22px;
        align-items: start;
        /* And the pair reads as one unit rather than as two things at
           opposite edges of a 1900 pixel window. */
        max-width: 1040px;
        margin: 4px auto 14px;
      }
      .trick-film {
        display: block;
        width: 100%;
        /*
         * A HEIGHT BUDGET, AND IT IS WRITTEN AS A WIDTH CAP.
         *
         * This had none. The film is a 16:10 box at 100 percent of a
         * column that is 1.35fr of the page, so on a 1920 wide window it
         * drew itself 600 pixels tall, and the list of tricks underneath
         * it started 867 pixels down a 919 pixel window. Measured at the
         * reporter's size: NOT ONE trick row was fully on screen, and at
         * 1080p only four of forty three were. The page does not scroll,
         * so there was no way down to them at all.
         *
         *   bug-f105cf4a, Fernando: "solo sale un truco y no puedo bajar
         *   con la ruedita del raton", only one trick appears and I cannot
         *   go down with the mouse wheel. Both halves are this rule.
         *
         * It is a max-width rather than a max-height because the aspect
         * ratio is fixed and the width is definite: capping the height of
         * a box whose width is already 100 percent does not shrink it, it
         * SQUASHES it, and the canvas inside would be drawn stretched.
         * Capping the width lets the ratio carry the height down with it.
         *
         * The number is the same shape as the menu's cap below, so the two
         * shrink together on a short window and the sum of film, list and
         * hint stays inside the viewport at every size measured: 780, 900,
         * 919 and 1080.
         */
        aspect-ratio: 16 / 10;
        background: #1a241c;
        /* The two pixel edge is the board's furniture and the town's ink:
           a cel shaded picture is a fill with a line round it. */
        box-shadow: 0 0 0 2px rgba(11, 17, 22, 0.9), 0 0 0 3px rgba(243, 234, 212, 0.16);
      }
      .trick-side { min-width: 0; padding-top: 2px; }
      .trick-name {
        font-size: clamp(19px, 2.3vw, 27px); font-weight: 700;
        letter-spacing: 0.02em; color: var(--cream); line-height: 1.1;
      }
      .trick-meta {
        margin-top: 5px; font-size: 12px; letter-spacing: 0.13em;
        text-transform: uppercase; color: var(--amber);
      }
      .trick-how {
        margin: 11px 0 0; font-size: 14px; line-height: 1.5;
        color: var(--cream); opacity: 0.92;
      }
      .trick-view {
        margin-top: 9px; font-size: 12px; line-height: 1.45; color: var(--slate);
      }
      /* Narrow: the film goes above the words, and shortens, because on a
         phone the list underneath is what the thumb is reaching for. */
      @media (max-width: 900px) {
        .trick-stage { grid-template-columns: 1fr; gap: 12px; }
        /* One column, so the film is bounded by the same budget directly
           rather than by its track, and stays centred over the words. */
        .trick-film {
          aspect-ratio: 2 / 1;
          max-width: calc(min(27vh, 280px) * 2);
          margin: 0 auto;
        }
      }
      /* 27vh rather than 34, so the film above and the list below share the
         window instead of competing for it, and the pair still fits at 720.
         See .trick-film. */
      .screen-tricks .menu-scroll { max-height: min(27vh, 300px); }

      .craft-showcase-frame {
        position: relative;
        width: 100%;
        aspect-ratio: 1 / 1;
        background: #1a241c;
      }
      .craft-view {
        position: absolute;
        inset: 0;
        display: block;
        width: 100%;
        height: 100%;
        border: 0;
        background: #1a241c;
        touch-action: none;
      }
      .craft-showcase-cap {
        margin-top: 4px;
        padding: 0 10px 12px;
        text-align: center;
        font-size: 11px;
        letter-spacing: 0.10em;
        text-transform: uppercase;
        color: #b7c4b0;
      }
      /* ---- THE FRAME ---------------------------------------------------
         Two bars outside every screen, in the same pixels on all of them.
         Absolutely positioned and cleared by the screens' own padding, so a
         bar can never render on top of a row. ------------------------------ */
      .frame-top, .frame-bot {
        position: absolute; left: 0; right: 0; z-index: 6;
        display: flex; align-items: center; gap: 14px;
        padding: 0 clamp(14px, 3vw, 34px);
        pointer-events: none;
      }
      .frame-top { top: 0; height: var(--bar-top);
        background: linear-gradient(180deg, rgba(8, 12, 9, 0.86), rgba(8, 12, 9, 0)); }
      .frame-bot { bottom: 0; height: var(--bar-bot);
        background: linear-gradient(0deg, rgba(8, 12, 9, 0.9), rgba(8, 12, 9, 0)); }
      .frame-top[hidden], .frame-bot[hidden] { display: none; }
      .frame-gap { flex: 1; }
      .crumb {
        display: flex; align-items: center; gap: 9px;
        font-size: 11.5px; letter-spacing: 0.15em; text-transform: uppercase;
      }
      .crumb-sep { color: #4a5a52; }
      .crumb-up { color: var(--slate); }
      .crumb-here { color: var(--cream); }
      .frame-context { display: flex; align-items: center; gap: 8px; }
      .frame-chip {
        display: flex; align-items: center; gap: 7px;
        height: 26px; padding: 0 11px; border-radius: 3px;
        background: rgba(20, 28, 22, 0.72);
        box-shadow: inset 0 0 0 1px rgba(244, 236, 214, 0.13);
        font-size: 12px; color: var(--slate); white-space: nowrap;
      }
      .frame-chip b { color: var(--cream); font-weight: 600; }
      .frame-chip-key { color: var(--slate); }
      .frame-legend { display: flex; align-items: center; gap: 16px; flex-wrap: nowrap; overflow: hidden; }
      .frame-legend i, .frame-legend .legend-act {
        display: flex; align-items: center; gap: 6px;
        font-style: normal; font-size: 12.5px; color: var(--slate);
      }
      /* The one legend entry that is a control rather than a label. It
       * reads exactly like its neighbours until it is pointed at, because
       * a legend where one item shouts is a legend that has stopped being
       * a legend. See legendFor: only entries carrying an action get this. */
      .frame-legend .legend-act {
        pointer-events: auto; appearance: none; background: none;
        border: 0; padding: 0; margin: 0; font-family: inherit;
        letter-spacing: inherit; cursor: pointer;
      }
      .frame-legend .legend-act:hover { color: var(--sakura); }
      .frame-legend .legend-act:focus-visible {
        outline: 2px solid var(--cream); outline-offset: 3px;
      }
      .frame-primary {
        pointer-events: auto; font: inherit; font-size: 15px; font-weight: 700;
        height: 36px; padding: 0 20px; border: 0; border-radius: 3px;
        background: var(--mint); color: var(--deep); cursor: pointer;
      }
      .frame-primary[hidden] { display: none; }
      .frame-primary:focus-visible { outline: 2px solid var(--cream); outline-offset: 2px; }

      /* ---- ROW GRAMMAR --------------------------------------------------
         The kind of a row is visible before Enter is pressed. A value row
         carries its control, a navigation row a chevron, a link row an
         arrow. See rowKind() in src/ui/ui.js. ----------------------------- */
      .row-nav::after {
        content: "\203A"; margin-left: 10px; color: #55665e;
        font-size: 19px; line-height: 1;
      }
      .row-nav.on::after { color: var(--sakura); }
      .row-link::after {
        content: "\2197"; margin-left: 10px; color: #55665e; font-size: 15px;
      }
      .row-link.on::after { color: var(--slate); }

      /* Touch. Every target reaches 44 px on a coarse pointer, and the row
         shrink below is removed there: on a phone the copy gets smaller, the
         target never does. */
      @media (pointer: coarse) {
        .row, .drop-opt, .fc-tab { min-height: 44px; }
        .step, .row-num, .sw-seg { min-height: 44px; }
        .frame-primary { height: 44px; }
      }

      .row {
        display: flex; justify-content: space-between; align-items: center; gap: 16px;
        padding: 10px 22px 10px 28px; border-left: 4px solid transparent;
        color: rgba(238, 232, 216, 0.78);
        font-size: clamp(16px, 1.9vw, 21px); cursor: pointer;
      }
      /* The cursor is a bar and a colour, not a slab. Sakura for chrome.
         Amber stays on the flight instruments, where it has to punch through
         whatever the camera is looking at. */
      .row.on {
        color: var(--cream); border-left-color: var(--sakura);
        background: linear-gradient(90deg, rgba(232, 168, 184, 0.12), rgba(232, 168, 184, 0) 48%);
      }
      /*
       * THE STANDINGS TABLE. Drawn above the actions, not as menu rows: a
       * leaderboard is read, and forty times as forty rows would make the
       * cursor walk all of them to reach Back. Three columns, because rank,
       * pilot and lap is what a standings table is.
       */
      .standings-table {
        grid-column: 1 / -1; justify-self: center;
        width: min(100%, 560px); margin: 0 0 14px;
        max-height: min(38vh, 20em); overflow-y: auto;
        pointer-events: auto;
        scrollbar-width: thin;
        scrollbar-color: rgba(232, 168, 184, 0.45) rgba(16, 22, 17, 0.55);
      }
      .standings-row {
        display: grid; grid-template-columns: 2.4em 1fr auto;
        align-items: baseline; gap: 12px;
        padding: 6px 14px;
        font-size: 15px; color: rgba(238, 232, 216, 0.82);
      }
      .standings-head {
        font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase;
        color: var(--slate); padding-bottom: 2px;
      }
      .standings-rank { color: var(--slate); font-variant-numeric: tabular-nums; }
      .standings-pilot { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .standings-lap { font-variant-numeric: tabular-nums; color: var(--cream); font-weight: 600; }
      /* Mint is what this product paints a record in, on the board and here. */
      .standings-row.is-record .standings-lap { color: var(--mint); }
      /* The one row a person looks for in a leaderboard is their own. */
      .standings-row.is-me {
        background: linear-gradient(90deg, rgba(232, 168, 184, 0.14), rgba(232, 168, 184, 0) 70%);
        box-shadow: inset 3px 0 0 var(--sakura);
      }
      .standings-row.is-me .standings-pilot { color: var(--cream); }
      .standings-ghost {
        margin-left: 8px; padding: 1px 6px; border-radius: 2px;
        font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase;
        background: rgba(157, 179, 200, 0.18); color: var(--slate);
      }
      .standings-note {
        padding: 10px 14px; color: var(--slate); font-size: 14px;
      }
      .row-info { cursor: default; }
      /*
       * The browser's focus ring is redundant with the cursor bar and lands
       * in the same place, so it is suppressed for a POINTER focus and kept
       * for a keyboard one. :focus-visible is exactly that distinction, and
       * a row focused by script during arrow travel is not focus-visible,
       * so arrow keys keep the bar alone and Tab gets the ring as well.
       */
      .row:focus { outline: none; }
      .row:focus-visible {
        outline: 2px solid var(--sakura); outline-offset: -2px;
      }
      .screen-fc .row:focus-visible { outline-color: var(--bf-accent); }
      /*
       * AMBER, which is the instrument colour, because this row is a reading
       * off the hardware rather than a thing the product wants you to do.
       * It is a row and not a floating panel so that it gets the cursor, the
       * help column and Enter for free: a banner a radio pilot cannot focus
       * would be the same joke twice. See padTroubleItem.
       */
      .row-warn {
        color: var(--amber);
        border-left-color: rgba(240, 178, 74, 0.55);
        background: linear-gradient(90deg, rgba(240, 178, 74, 0.1), rgba(240, 178, 74, 0) 52%);
      }
      .row-warn::before {
        content: "!"; flex: 0 0 auto; margin-right: 2px;
        width: 1.25em; height: 1.25em; border-radius: 50%;
        display: grid; place-items: center;
        font-size: 0.7em; font-weight: 800;
        background: var(--amber); color: #14180f;
      }
      .row-warn.on {
        color: var(--amber); border-left-color: var(--amber);
        background: linear-gradient(90deg, rgba(240, 178, 74, 0.22), rgba(240, 178, 74, 0) 52%);
      }
      .row-grey {
        color: rgba(157, 179, 200, 0.62);
        cursor: default;
      }
      .row-grey .row-value, .row-grey .drop-btn { color: var(--slate); opacity: 0.85; }
      .row-grey.on {
        color: rgba(157, 179, 200, 0.92);
        border-left-color: rgba(157, 179, 200, 0.55);
        background: linear-gradient(90deg, rgba(157, 179, 200, 0.10), rgba(157, 179, 200, 0) 48%);
      }
      /*
       * The one thing to press.
       *
       * Every row on every screen used to be the same size, weight and
       * colour, so Fly and Credits were typographic equals and the only
       * hierarchy was a 4 px cursor bar. Mint on dark ink is the treatment
       * the old track builder page gave Fly this track, and its rule was
       * one green button per screen, so there is exactly one of these in
       * any list.
       */
      /*
       * TWO HIGHLIGHTS, ONE CURSOR.
       *
       * This used to paint a filled mint slab whether or not the cursor was
       * on it, so the title screen showed Fly looking selected while the real
       * cursor sat three rows down on Track. Two things looked selected and
       * only one of them answered Enter. The primary now reads as the primary
       * (mint type, a mint edge) without claiming the selection, and the
       * command bar carries the filled button. Exactly one thing on any
       * screen is filled mint, and it is never a row.
       */
      .row-primary {
        margin: 4px 10px 8px;
        padding: 12px 18px;
        border-radius: 3px;
        border-left: 3px solid transparent;
        background: rgba(125, 255, 180, 0.10);
        box-shadow: inset 0 0 0 1px rgba(125, 255, 180, 0.42);
        color: var(--mint);
        font-weight: 700;
        letter-spacing: 0.02em;
      }
      .row-primary .row-label { font-weight: 700; color: var(--mint); }
      /* Selected, and only then, it fills. The cursor is the thing that
         decides, which is the whole point. */
      .row-primary.on {
        border-left-color: var(--sakura);
        background: var(--mint);
        color: var(--deep);
        box-shadow: 0 0 0 2px rgba(243, 234, 212, 0.55);
      }
      .row-primary.on .row-label { color: var(--deep); }
      /* Its value too, like its label: sakura on the mint fill was nearly
         unreadable (a room's "1 of 16" in the room browser). */
      .row-primary.on .row-value { color: var(--deep); }

      /* A group heading in a long settings list. Not a row: no cursor, no
         hover, no click. Twenty flat rows in one scroll is a list you read
         rather than a panel you operate. */
      .menu-section {
        margin: 14px 0 2px;
        padding: 0 22px 5px 28px;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--sakura);
        border-bottom: 1px solid rgba(232, 168, 184, 0.22);
        pointer-events: none;
      }
      .menu-scroll > .menu-section:first-child { margin-top: 4px; }

      /*
       * Rates. The one flight setting a pilot actually sets by hand, so it
       * gets a screen and a picture rather than a row buried in a list.
       *
       * House palette, not the Betaflight Configurator yellow that used to
       * live here. The flight-controller screen this replaces painted itself
       * #ffbb00 on #4d4d4d as a homage to Configurator 10.10, which was
       * honest about where its several hundred editable firmware keys came
       * from. There are five knobs now, they are ours, and they look it.
       */
      /*
       * SAFE centre, like every other page, and this line was the phone bug.
       *
       * `.screen-page` sets `safe center` precisely so a column taller than
       * the window falls back to flex-start instead of overflowing in both
       * directions, and the comment on `.screen` spells out why: the half
       * that goes off the TOP cannot be scrolled back to. This rule said
       * plain `center` and so opted the one screen with the most content
       * back into the bug. Measured at 390 by 844 the heading sat at
       * y = -53 and at 834 by 1112 at y = -26: the word "Rates" was off the
       * top of the window on a phone and a tablet, with no way to reach it.
       */
      .screen-rates { justify-content: safe center; }
      .rates-lede {
        max-width: 48em; margin: 0 auto;
        color: rgba(235, 230, 215, 0.78);
        font-size: 15px; line-height: 1.6; text-align: center;
      }
      /*
       * Column one of .menu-stage, the seat the quad takes on Settings.
       *
       * width is pinned to 100% rather than inherited, because the shared
       * rule is `min(1600px, 98vw)` and .screen already spends 6vw a side on
       * padding. At 1440 that is a stage 143 px wider than the box holding
       * it, centred, so the curve hung 70 px off the left of the window.
       * 100% is the padded content box, which is what the stage meant.
       */
      .screen-rates .menu-stage {
        width: 100%;
        max-width: 1600px;
        /* A real minimum, for the reason on .screen-quad .menu-stage. */
        grid-template-columns: minmax(320px, 1.5fr) auto minmax(210px, 0.7fr);
      }
      .rates-panel {
        grid-column: 1;
        justify-self: end;
        align-self: center;
        display: flex; flex-direction: column;
        width: min(100%, 620px);
        margin-right: 18px;
        pointer-events: none;
      }
      /* Same well the menu block sits in, so the two panels read as one
         surface over a bright world rather than two different glasses. */
      .rates-graph-wrap {
        height: clamp(180px, 26vh, 260px);
        border-radius: 4px;
        background: rgba(16, 22, 17, 0.72);
        box-shadow: inset 0 0 0 1px rgba(244, 236, 214, 0.10);
        overflow: hidden;
      }
      .rates-graph { display: block; width: 100%; height: 100%; }
      .rates-legend {
        display: flex; gap: 20px; flex-wrap: wrap;
        margin-top: 10px;
      }
      .rates-key { display: flex; align-items: baseline; gap: 7px; }
      .rates-key-dot {
        width: 9px; height: 9px; border-radius: 50%;
        align-self: center;
      }
      /* The dashed curve's key: a rule with gaps in it, not a dot, cut with
         a mask so it takes the same inline background colour as the dot. */
      .rates-key-dash {
        width: 18px; height: 2px; border-radius: 0;
        -webkit-mask-image: repeating-linear-gradient(to right, #000 0 5px, transparent 5px 9px);
        mask-image: repeating-linear-gradient(to right, #000 0 5px, transparent 5px 9px);
      }
      .rates-key-lab {
        font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase;
        color: rgba(235, 230, 215, 0.66);
      }
      .rates-key-val { font-size: 13px; font-weight: 650; color: var(--cream); }
      /* Four small facts under the curve. auto-fit rather than a fixed four
         columns, because this sits in a grid column whose width is a share
         of the window: at 1366 that column is 451 px, four columns of it are
         113 px each, and "19.5% stick" is wider than that, so the last cell
         used to spill out from under the curve and across the menu beside
         it. A track floor wraps instead of overflowing.

         The floor is 152 px rather than the 126 it was when a cell held at
         most two numbers. A split pitch puts three in it, "185 / 118 / 185
         deg/s", and the dd does not wrap, so at 126 the last cell was
         painted over the one beside it. Four across still fit at 1600; at
         1366 the fourth wraps under, which is the behaviour this floor is
         chosen for. */
      .rates-readout {
        display: grid; grid-template-columns: repeat(auto-fit, minmax(152px, 1fr));
        gap: 10px 14px; margin: 14px 0 0;
      }
      .rates-cell { min-width: 0; }
      .rates-readout dt {
        font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase;
        color: rgba(157, 179, 200, 0.85);
      }
      .rates-readout dd {
        margin: 3px 0 0; font-size: 14px; font-weight: 650;
        color: var(--cream); white-space: nowrap;
      }
      /* Each number in its own curve's colour, painted inline by
         src/ui/ratespanel.js, so a split reading needs no key. A number the
         same as the one before it is hidden rather than repeated. */
      .rates-num { color: var(--cream); }
      .rates-num-sep, .rates-num-unit { color: rgba(235, 230, 215, 0.6); font-weight: 500; }
      .rates-num[hidden], .rates-num-sep[hidden] { display: none; }
      /*
       * THE LIST TAKES THE ROOM THAT IS ACTUALLY THERE.
       *
       * 52vh and 30em were measured when this screen held sixteen rows. It
       * holds twenty now, because the Preset row and the three that save,
       * delete and revert a profile arrived with the preset library, and the
       * cap had 93 px of window sitting unused below it: measured at 1600 by
       * 900 the stage ended at y 745 and the bottom padding does not begin
       * until 838. Spending that on the list is two more rows visible
       * without scrolling.
       *
       * It does NOT make the screen fit. Twenty rows, a curve and a lede do
       * not fit a 900 px window and were never going to, so the scroller is
       * still the answer and the recorded overflow still grew. See
       * PROGRESS.md: the number moved because the screen gained a feature,
       * and stretching the list further to flatter the measurement would be
       * the fudge this note exists to not be.
       *
       * The shorter-window rules below still win, because they come later
       * and are the same property.
       */
      .screen-rates .menu-scroll { max-height: min(calc(62vh - var(--bars)), 36em); }
      /*
       * AND THE NOTE BESIDE IT MUST NOT BE ABLE TO MOVE THAT LIST.
       *
       * The note is column three of the stage and its text is whichever row
       * the cursor is on, so its HEIGHT CHANGES WITH THE CURSOR. A grid row
       * is as tall as its tallest item, and .screen-rates is `justify-content:
       * safe center`, so a taller note grew the stage and the centred column
       * pushed the list UP to keep the whole thing centred. Hovering a row
       * therefore moved that row, out from under the pointer, onto a
       * different row, with a different note, a different height and another
       * shift. That is a feedback loop and a pilot described it as one:
       *
       *   "when i move my mouse on on of the options in the settings the
       *    buttons moves away from my mouse"
       *
       * Measured at their own 1358 by 602, walking the cursor down the
       * seventeen stops: the note ran 0 to 432 px, the stage 221 to 440, and
       * A ROW MOVED 86 PX, which is two rows, when the cursor arrived on it.
       * The PIDs screen wears this class and had the same defect at 10 px.
       * Nothing else did: pilot, quad, launch and paused all measured 0,
       * because on those the menu is taller than any note it can hold.
       *
       * THE FIX IS NOT A CAP. Capping the note at the list's height is the
       * obvious answer and it was tried first: it took the 86 px to 51 and
       * stopped there, because the list's own cap is not one number. The
       * rule above is what it gets in a tall window and the shorter window
       * rules below replace it, so at 602 px the list was capped at 46vh and
       * the note at 62vh, and a note capped higher than the list still sized
       * the row. Any number typed here is a number that has to be kept in
       * step with three others, which is the arrangement that produced this
       * defect in the first place.
       *
       * So the note is taken OUT OF THE ROW'S SIZING instead. An absolutely
       * positioned grid child is laid out in the grid area it names and
       * contributes nothing to sizing it, so the row is whatever the curve
       * and the list make it, and top and bottom of 0 give the note exactly
       * that height, at every breakpoint, with nothing to keep in step. A
       * note longer than the room scrolls, which is what the narrow window
       * rule below has always done to it.
       *
       * left and right of 0 rather than auto: an absolutely positioned box
       * with both auto shrinks to fit, and this one was stretched to the
       * column and then held to max-width 26em. 0 and 0 is the same box.
       * The 8 px margin becomes padding for the same reason, so the text
       * starts where it always started; the border rule beside it is 8 px
       * taller, which is the whole visible cost of this.
       */
      .screen-rates .menu-stage { position: relative; }
      .screen-rates .menu-help {
        position: absolute;
        grid-column: 3;
        grid-row: 1;
        top: 0;
        bottom: 0;
        left: 0;
        right: 0;
        margin-top: 0;
        padding-top: 20px;
        overflow-y: auto;
        overscroll-behavior: contain;
        scrollbar-width: thin;
        scrollbar-color: rgba(232, 168, 184, 0.45) rgba(16, 22, 17, 0.55);
      }
      /* Empty, it is an invisible box the height of the stage over what
         reads as blank space. Nothing sits under it today, and a hit test
         of every row and every dropdown option said so, but a pointer over
         blank space should meet blank space, not a transparent scroller. */
      .screen-rates .menu-help:empty { pointer-events: none; }
      /*
       * The PIDs screen wears .screen-rates as well as .screen-pids, ON
       * PURPOSE: it is the Rates screen's layout with bars where the curve
       * is, and duplicating every stage, scroll and narrow-window rule for
       * a second class is how the two screens would drift apart. Only what
       * differs is named here.
       */
      .pids-caption {
        font-size: 12px; letter-spacing: 0.06em;
        color: rgba(235, 230, 215, 0.66);
        margin-bottom: 8px;
      }
      /* Three axes of five numbers each: one cell per axis, kept on one
         line by the shared dd nowrap, so the floor is wider than the rates
         cells' four-number floor. */
      .pids-readout { grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); }
      .row-label { min-width: 0; flex: 1 1 auto; }
      /*
       * THE SELECTED LABEL IS EMBOLDENED WITHOUT CHANGING ITS METRICS.
       *
       * This was font-weight: 650, and a heavier label is a WIDER label.
       * The menu sits in an `auto` grid track, so that track is sized to
       * the widest row it contains, and bolding whichever row the cursor
       * happens to be on grew the whole menu: 8 px on Settings, 19 px on
       * PIDs. That shoved the menu sideways and squeezed the columns
       * either side of it hard enough to resize the craft preview, which
       * changed the stage height and moved the menu vertically as well.
       * Measured per row, every row was identical except the one under
       * the cursor.
       *
       * It was reported as the note text moving the menu, because the note
       * changes at the same instant the cursor does. The note was never
       * the cause: its own height swings 0 to 302 px and moves nothing,
       * because the stage aligns to start and the menu is the taller of
       * the two.
       *
       * A text-shadow PAINTS the emphasis rather than re-setting the type,
       * so glyph advance widths cannot change and neither can the layout.
       * Two offsets rather than one so the thickening is symmetric and the
       * label does not appear to creep to the right. Measured after the
       * change: 0.00 px of movement on every menu screen.
       */
      .row.on .row-label {
        text-shadow: -0.02em 0 0 currentColor, 0.02em 0 0 currentColor;
      }
      .row-value {
        color: var(--sakura); font-size: 0.86em; font-weight: 600;
        letter-spacing: 0.03em; flex: 0 1 auto; min-width: 0;
        max-width: 52%; overflow: hidden; text-overflow: ellipsis;
        white-space: nowrap; text-align: right;
      }
      .row-control {
        display: flex; align-items: center; gap: 8px; flex: 0 1 auto; min-width: 0;
      }
      .step-col {
        display: inline-flex; flex-direction: column; gap: 2px;
      }
      .step {
        width: 1.35em; height: 1.05em; padding: 0; border: 0; border-radius: 3px;
        background: rgba(232, 168, 184, 0.16); color: var(--sakura); cursor: pointer;
        font-size: 9px; line-height: 1; display: grid; place-items: center;
      }
      .step:hover { background: rgba(232, 168, 184, 0.32); }
      /*
       * A SWITCH, not a popup listing On and Off. Two segments, the live one
       * lit, both clickable, both labelled, so a mouse can go straight to
       * the state it wants and a reader can see what the other state is
       * called without pressing anything.
       */
      .row-switch {
        gap: 0; border-radius: 4px; overflow: hidden;
        box-shadow: inset 0 0 0 1px rgba(232, 168, 184, 0.3);
      }
      .sw-seg {
        appearance: none; border: 0; margin: 0; cursor: pointer;
        background: transparent; color: var(--slate);
        font: inherit; font-size: 0.78em; font-weight: 650;
        letter-spacing: 0.05em; text-transform: uppercase;
        /* No taller than the drop button it replaces. The strip is drawn
           for twelve rows at once on Settings, so three pixels a row is
           thirty five pixels of list, and the shell check measures it. */
        padding: 2px 11px; line-height: 1.25;
      }
      .sw-seg:hover { color: var(--cream); background: rgba(232, 168, 184, 0.12); }
      .sw-seg.on {
        background: rgba(232, 168, 184, 0.9); color: #14180f;
      }
      /* On the bench the switch wears Betaflight's yellow, like every other
         control there, or it reads as the game's chrome floating on top of
         a tool, which is the thing the bench's own frame exists to stop. */
      .screen-fc .row-switch { box-shadow: inset 0 0 0 1px #6b6b6b; }
      .screen-fc .sw-seg { color: #b6b6b6; }
      .screen-fc .sw-seg:hover { color: #fff; background: rgba(255, 255, 255, 0.09); }
      .screen-fc .sw-seg.on { background: var(--bf-accent); color: var(--bf-ink); }
      .row-grey .sw-seg.on { background: rgba(232, 168, 184, 0.45); }
      /*
       * The typed value on the Rates screen.
       *
       * A real text field rather than a list, because a rate a pilot has in
       * their head has to be enterable and no list of a dozen steps carries
       * it. Sized in ch so 2.55 and 2000 both sit inside it, right aligned
       * so the digits line up down the column, and it wears the same sakura
       * the dropdown value does so a row reads the same whichever kind it
       * is. See makeNumber in src/ui/ui.js.
       */
      .row-num {
        width: 5ch; padding: 3px 6px; border: 0; border-radius: 3px;
        background: rgba(232, 168, 184, 0.10);
        box-shadow: inset 0 0 0 1px rgba(232, 168, 184, 0.28);
        color: var(--sakura); font: inherit; font-size: 0.86em; font-weight: 600;
        text-align: right; letter-spacing: 0.03em;
      }
      .row-num:focus {
        outline: none; background: rgba(232, 168, 184, 0.18);
        box-shadow: inset 0 0 0 1px var(--sakura);
        color: var(--cream);
      }
      .row-num-unit {
        font-size: 0.78em; color: rgba(157, 179, 200, 0.9);
        white-space: nowrap;
      }
      /*
       * A drag slider, the control Configurator gives its tuning sliders.
       * Native input[type=range] so drag, touch and focused arrow keys are
       * the browser's problem, restyled to the house: a thin cream track
       * with a mint thumb, and the number field beside it stays typable.
       * The .screen-fc block recolours the same control Configurator
       * yellow. Track and thumb need the vendor prefixes separately;
       * a shared rule silently drops the whole selector.
       */
      .row-slider { gap: 10px; }
      .row-range {
        appearance: none; -webkit-appearance: none;
        width: clamp(110px, 16vw, 220px); height: 18px;
        background: transparent; cursor: pointer;
        pointer-events: auto;
      }
      .row-range::-webkit-slider-runnable-track {
        height: 4px; border-radius: 2px;
        background: rgba(244, 236, 214, 0.22);
      }
      .row-range::-moz-range-track {
        height: 4px; border-radius: 2px;
        background: rgba(244, 236, 214, 0.22);
      }
      .row-range::-webkit-slider-thumb {
        -webkit-appearance: none; appearance: none;
        width: 14px; height: 14px; border-radius: 50%;
        margin-top: -5px;
        background: var(--mint); border: 0;
        box-shadow: 0 0 0 1px rgba(12, 18, 14, 0.6), 0 1px 4px rgba(0, 0, 0, 0.5);
      }
      .row-range::-moz-range-thumb {
        width: 14px; height: 14px; border-radius: 50%;
        background: var(--mint); border: 0;
        box-shadow: 0 0 0 1px rgba(12, 18, 14, 0.6), 0 1px 4px rgba(0, 0, 0, 0.5);
      }
      .row-range:focus-visible { outline: 1px solid var(--mint); outline-offset: 2px; }
      .row-range-num { width: 4ch; }
      .screen-fc .row-range::-webkit-slider-runnable-track { background: #2a2a2a; }
      .screen-fc .row-range::-moz-range-track { background: #2a2a2a; }
      .screen-fc .row-range::-webkit-slider-thumb { background: var(--bf-accent); }
      .screen-fc .row-range::-moz-range-thumb { background: var(--bf-accent); }
      .screen-fc .row-range:focus-visible { outline-color: var(--bf-accent); }
      .screen-fc .row-num {
        background: #2a2a2a; box-shadow: inset 0 0 0 1px #5a5a5a; color: #fff;
      }
      .screen-fc .row-num:focus { box-shadow: inset 0 0 0 1px var(--bf-accent); }
      /*
       * The bench's search field. AFTER .row-num, deliberately: it shares
       * that class for the palette and the focus ring, and .row-num sets
       * width: 5ch, which is right for a filter cutoff and useless for a
       * key name. Source order is what overrides it, both being one class
       * deep, and the first draft put these rules above it and got a five
       * character box nobody could see what they had typed in.
       */
      .row-search { flex: 1 1 auto; min-width: 0; }
      .row-textfield {
        width: 100%; min-width: 8em; text-align: left;
        font-variant-numeric: normal; letter-spacing: 0.01em;
      }
      .row-textfield::placeholder { color: #9a9a9a; opacity: 1; }
      .drop-btn {
        appearance: none; border: 0; background: transparent;
        color: var(--sakura); font: inherit; font-size: 0.86em;
        cursor: pointer; padding: 2px 2px 2px 8px;
        display: inline-flex; align-items: center; gap: 8px;
        max-width: 100%; text-align: right; line-height: 1.25;
      }
      .drop-btn::after {
        content: ""; width: 0; height: 0; flex: 0 0 auto;
        border-left: 4px solid transparent; border-right: 4px solid transparent;
        border-top: 5px solid var(--sakura); opacity: 0.85;
      }
      .drop-list {
        position: fixed; z-index: 20; pointer-events: auto;
        max-height: min(280px, calc(46vh - var(--bars))); overflow-y: auto;
        padding: 6px 0; border-radius: 4px;
        background: rgba(16, 22, 17, 0.97);
        box-shadow: inset 0 0 0 1px rgba(232, 168, 184, 0.28), 0 14px 32px rgba(0, 0, 0, 0.55);
        scrollbar-width: thin;
        scrollbar-color: rgba(232, 168, 184, 0.45) rgba(16, 22, 17, 0.55);
      }
      .drop-opt {
        display: block; width: 100%; box-sizing: border-box;
        border: 0; background: transparent; color: rgba(238, 232, 216, 0.78);
        font: inherit; font-size: 15px; text-align: left;
        padding: 7px 16px; cursor: pointer;
      }
      .drop-opt:hover, .drop-opt.on { color: var(--cream); background: rgba(232, 168, 184, 0.12); }
      /* A narrow window stacks the curve over the rows rather than
         squeezing both. Same breakpoint the rest of the page uses. */
      /* One column: the curve stacks over the rows rather than squeezing
         both, and the note moves under the list where there is width for
         it. Everything shrinks a little, because a window this size has to
         hold the curve, seven rows and the hint at once. */
      /*
       * A STACKED STAGE FITS ITS BOX, wherever it stacks.
       *
       * The two blocks above turn the Quad and Rates stages into one column
       * below 1100 px, and a one column GRID grows to its content: the
       * screen is a centred flex column with no scroller of its own, so
       * anything past the padded box is simply lost. Measured at 1180 by
       * 820 the Quad room's help column ran 373 px past the bottom of the
       * window, and the PIDs screen 105.
       *
       * The same three rules the narrow-window block uses, applied here:
       * the stage is a flex column capped at the box, the LIST is the part
       * that shrinks and scrolls, and the help keeps its natural height up
       * to a third. `max-height: none` on the list is what lets that
       * happen: the hand tuned vh caps above are a good guess for the
       * common window and the wrong answer for a short one, and flex knows
       * the real number.
       *
       * min-height: 0 on both is the half that makes a flex child shrink
       * instead of overflowing, which is the whole defect in one property.
       */
      @media (max-width: 1280px) {
        .screen-quad .menu-stage,
        .screen-rates .menu-stage {
          display: flex; flex-direction: column; align-items: stretch;
          max-height: 100%; min-height: 0;
        }
        .screen-quad .craft-showcase,
        .screen-rates .rates-panel {
          flex: 0 0 auto;
        }
        .screen-quad .menu-stage > .menu,
        .screen-rates .menu-stage > .menu {
          /* Three rows' worth of floor, for the reason on the narrow
           * window rule: the airframe and the curve are both `flex: 0 0
           * auto` and will otherwise take the whole box. */
          flex: 1 1 auto; min-height: min(200px, 100%);
          max-height: none; overflow-y: auto;
        }
        .screen-quad .menu-help,
        .screen-rates .menu-help {
          flex: 0 0 auto; max-height: 33%; overflow-y: auto;
        }
      }

      @media (max-width: 1280px) {
        .screen-rates .menu-stage { grid-template-columns: minmax(0, 1fr); }
        .rates-panel {
          grid-column: 1; grid-row: 1;
          justify-self: center; width: min(100%, 620px); margin: 0 0 12px;
        }
        .screen-rates .menu-stage .menu { grid-column: 1; justify-self: center; }
        .screen-rates .menu-help {
          /* Back in flow: this layout is one column with the note stacked
             under the list, where growing downward moves nothing. */
          position: static;
          grid-column: 1; max-width: none; border-left: 0;
          padding: 8px 14px 0; margin-top: 6px; text-align: center;
        }
        .rates-graph-wrap { height: clamp(140px, 20vh, 200px); }
        .screen-rates .menu-scroll { max-height: calc(34vh - var(--bars)); }
        /* The note moved under the list in this layout, so the hint no
           longer needs the full gap: at 900 by 760 the longest note pushed
           it three pixels below the fold. */
        .screen-rates .hint { margin-top: 12px; }
        /* Narrow enough to clear the music dock and the bug chip, which are
           fixed to the top right corner and sit over any screen. At 48em the
           last words of this sentence went under them. */
        .rates-lede { max-width: 34em; }
      }
      /*
       * A PHONE SCROLLS THE PAGE, NOT A BOX INSIDE THE PAGE.
       *
       * The blocks above cap the list and let it scroll inside the stage,
       * which is right on a laptop where the window is wide and short. On a
       * phone it is the nested-scroller trap: at 390 by 844 the list was
       * 224 px tall with 441 px hidden inside it, so four of the sixteen
       * rows were visible and the other twelve were behind a scroll gesture
       * that competes with the page's own. `.screen-page` already scrolls,
       * so the honest answer on a narrow window is to let everything take
       * its natural height and let the page carry it.
       *
       * 900 px, because that is where the stage is already one column and
       * the three-column reasoning above has stopped applying.
       */
      @media (max-width: 1280px) {
        .screen-rates .menu-stage,
        .screen-quad .menu-stage {
          max-height: none;
        }
        .screen-rates .menu-stage > .menu,
        .screen-quad .menu-stage > .menu {
          flex: 0 0 auto; min-height: 0; max-height: none; overflow-y: visible;
        }
        .screen-rates .menu-scroll,
        .screen-quad .menu-scroll {
          max-height: none; overflow-y: visible;
        }
        .screen-rates .menu-help,
        .screen-quad .menu-help {
          max-height: none; overflow-y: visible;
        }
        /*
         * The legend sits on its own patch once the PAGE is what scrolls.
         *
         * .frame-bot's scrim is a gradient that reaches zero at the top of
         * its own 44 px, which is fine on a window where the list scrolls
         * inside the padded box and nothing ever passes behind the bar. Here
         * the rows go under it, and a row reading through "Enter Choose" is
         * two sentences in the same pixels. Opaque where the words are, still
         * feathered at the top so it does not read as a second panel.
         */
        .frame-bot {
          background: linear-gradient(
            0deg,
            rgba(8, 12, 9, 0.97) 0%,
            rgba(8, 12, 9, 0.93) 62%,
            rgba(8, 12, 9, 0) 100%);
        }
      }
      /*
       * CLEAR THE FIXED CHIPS, which is a phone problem and only a phone
       * problem. The bug chip and the music dock are pinned to the top right
       * over every screen. On a wide window the centred copy is narrow enough
       * to pass beside them; on a phone nothing is, and measured at 390 by
       * 844 the lede spanned x 23..366 while the chip sat at x 151..374,
       * y 56..86, with the two drawn over each other. So the copy starts
       * below them instead of beside them.
       */
      @media (max-width: 900px) {
        .screen-rates .rates-lede,
        .screen-quad .rates-lede {
          max-width: none;
        }
        .screen-rates > h2,
        .screen-quad > h2 {
          margin-top: 76px;
        }
      }
      /* A short window spends its height on the curve and the rows: the
         lede is the one thing here that repeats what the row notes say, and
         the curve gives up the pixels the list needs to show all seven rows
         rather than six and a half. */
      @media (max-height: 820px) {
        .rates-graph-wrap { height: clamp(118px, 16vh, 160px); }
        .screen-rates .menu-scroll { max-height: calc(46vh - var(--bars)); }
      }
      /* Shorter still, and the lede is the first thing to go: it is the one
         line here that the row notes already say in more detail. */
      @media (max-height: 700px) {
        .rates-lede { display: none; }
        /* A 1024 by 700 window is 14 px short with the lede already gone and
           the longest note showing, so the curve gives up those pixels. It
           is a shape, not a table: it survives being short far better than
           the rows survive being cut. */
        .rates-graph-wrap { height: clamp(100px, 14vh, 140px); }
        .screen-rates .hint { margin-top: 8px; }
      }
      /* Superseded by the command bar, which says the same thing in the same
         place on every screen. Kept in the DOM so the screens that build one
         do not need surgery.

         IT USED TO SAY "and so a screen reader still finds the text", which
         was not true of the rule underneath it: display:none removes a node
         from the accessibility tree in every browser, so all fourteen hints
         were read by nobody. They are hidden from everybody now, which is at
         least honest, and the command bar carries the same words visibly.
         The pattern for text that IS meant to be heard and not seen is
         .sr-only below. */
      .hint { display: none; }

      /* Off screen, not gone: the clip keeps the node in the accessibility
         tree, which is the whole difference between this and the rule above.
         One user, the announcer that says a lap finished. */
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        margin: -1px;
        padding: 0;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
        border: 0;
      }
      .hint-legacy {
        display: flex; align-items: center; gap: 12px;
        margin-top: 22px; min-height: 1.4em; max-width: 42em;
        font-size: 13px; color: rgba(235, 230, 215, 0.6); letter-spacing: 0.02em; text-align: center;
        pointer-events: none;
      }
      .screen-modal .hint {
        margin-left: auto;
        margin-right: auto;
        color: rgba(235, 230, 215, 0.8);
      }
      .title-foot .hint {
        margin-top: 0; text-align: left; max-width: none;
      }
      .hint-keys { display: inline-flex; gap: 4px; flex: 0 0 auto; }
      .hint kbd {
        font-family: inherit; font-size: 11px; font-weight: 650;
        padding: 2px 7px; border-radius: 3px;
        border: 1px solid rgba(235, 230, 215, 0.35);
        color: #e8e2d0; background: rgba(20, 28, 22, 0.55);
      }
      .screen-calibrate {
        pointer-events: auto;
      }
      .cal-kicker {
        font-size: 12px; letter-spacing: 0.16em; text-transform: uppercase;
        color: var(--sakura); margin-bottom: 10px;
      }
      .cal-prompt {
        margin: 0; max-width: 28em; text-align: center;
        font-size: clamp(18px, 2.4vw, 28px); font-weight: 600;
        line-height: 1.35; color: var(--cream);
      }
      .cal-hint {
        margin: 10px 0 0; min-height: 1.4em; text-align: center;
        font-size: 14px; color: var(--slate);
      }
      .cal-sticks {
        display: flex; align-items: flex-end; gap: 36px;
        margin: 28px 0 16px;
      }
      .screen-calibrate .osd-gimbal-plate {
        width: 120px; height: 120px;
        background: rgba(12, 18, 14, 0.55);
      }
      /*
       * ONE CELL PER AXIS THE RADIO REPORTS. See setCalAxes in src/ui/ui.js
       * for why this strip exists at all: the gimbals above it can only
       * show four channels and do not yet know which four axes those are.
       *
       * Slate for the track, which is the colour type that should recede,
       * amber for the live dot, which is what an instrument reads in, mint
       * for an axis a channel has already claimed, which is the colour a
       * finished thing wears everywhere else in this shell.
       */
      .cal-axes {
        display: flex; flex-wrap: wrap; justify-content: center;
        gap: 6px 12px; margin: 0 0 18px; max-width: 34em;
      }
      .cal-axis { display: flex; align-items: center; gap: 6px; }
      .cal-axis-n {
        font-size: 10px; letter-spacing: 0.08em;
        color: rgba(235, 230, 215, 0.45); min-width: 0.8em; text-align: right;
      }
      .cal-axis-track {
        position: relative; display: block;
        width: 54px; height: 4px; border-radius: 2px;
        background: rgba(235, 230, 215, 0.14);
      }
      .cal-axis-span {
        position: absolute; top: 0; height: 100%; border-radius: 2px;
        background: rgba(232, 168, 184, 0.30);
      }
      .cal-axis-dot {
        position: absolute; top: 50%; width: 6px; height: 6px;
        margin: -3px 0 0 -3px; border-radius: 50%;
        background: rgba(235, 230, 215, 0.55);
      }
      .cal-axis.is-live .cal-axis-n { color: var(--amber); }
      .cal-axis.is-live .cal-axis-dot { background: var(--amber); }
      .cal-axis.is-mapped .cal-axis-n { color: var(--mint); }
      .cal-axis.is-mapped .cal-axis-dot { background: var(--mint); }
      .cal-axis.is-mapped .cal-axis-span { background: rgba(125, 255, 180, 0.24); }
      .cal-steps {
        list-style: none; display: flex; flex-wrap: wrap;
        justify-content: center; gap: 8px 14px;
        padding: 0; margin: 4px 0 16px;
        font-size: 11px; letter-spacing: 0.10em; text-transform: uppercase;
        /* 0.38 measured 3.1 to 1 against the panel, under the 4.5 floor for
           small text; 0.55 is 5.0 to 1 and still recedes behind the live
           step. */
        color: rgba(235, 230, 215, 0.55);
      }
      .cal-steps li.on { color: var(--amber); }
      .cal-steps li.done { color: var(--mint); }
      .cal-actions { display: flex; gap: 10px; margin-top: 4px; }
      .cal-actions .name-dialog-btn:disabled { opacity: 0.35; cursor: default; }
      .screen-padpick {
        pointer-events: auto;
        padding: 4vh 4vw 3vh;
      }
      .pad-cards {
        display: flex; flex-wrap: wrap; justify-content: center;
        gap: 16px; margin: 28px 0 18px; max-width: 1100px;
      }
      .pad-card {
        width: 220px;
        padding: 14px 14px 12px;
        border-radius: 8px;
        border: 1px solid rgba(243, 234, 212, 0.16);
        background: rgba(12, 18, 14, 0.62);
        text-align: center;
        transition: border-color 0.12s linear, box-shadow 0.12s linear;
      }
      .pad-card.is-live {
        border-color: var(--amber);
        box-shadow: 0 0 0 1px rgba(255, 212, 92, 0.55);
      }
      .pad-card.is-on {
        border-color: var(--mint);
        box-shadow: 0 0 0 2px rgba(125, 255, 180, 0.7);
      }
      .pad-card-title {
        font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase;
        color: var(--sakura); margin-bottom: 10px;
      }
      .pad-card-art {
        display: flex; justify-content: center; gap: 18px;
        margin-bottom: 10px;
      }
      .pad-card .osd-gimbal-plate {
        width: 72px; height: 72px;
        background: rgba(12, 18, 14, 0.55);
      }
      .pad-card .osd-gimbal-cap { display: none; }
      .pad-card-name {
        font-size: 13px; color: var(--cream);
        min-height: 2.4em; line-height: 1.3;
      }
      .pad-card-status {
        margin-top: 4px; font-size: 12px; letter-spacing: 0.08em;
        text-transform: uppercase; color: var(--slate);
      }
      .pad-card.is-live .pad-card-status { color: var(--amber); }
      .pad-card.is-on .pad-card-status { color: var(--mint); }
      .pad-actions { flex-wrap: wrap; justify-content: center; }
      @media (max-width: 860px) {
        .menu-stage {
          display: flex; flex-direction: column; align-items: stretch;
          position: relative;
          width: 100%;
          max-width: 540px;
          /*
           * THE STAGE FITS ITS BOX, so the help column survives a phone.
           *
           * Measured at 390 by 844: the airframe took 372 px, the list took
           * 434, and the help ran from 853 to 926, which is to say entirely
           * below a window 844 tall. The one column everybody praises about
           * this product, the plain English explanation beside the row, was
           * not on screen at all on a phone, and the command bar was drawn
           * over the bottom of the list.
           *
           * .screen is a centred flex column whose padding already reserves
           * both bars, so the fix is to stop the stage growing past that
           * box: cap it, let the LIST be the part that shrinks, and let the
           * help keep its natural height. min-height: 0 is the half that
           * makes a flex child actually shrink rather than overflow.
           */
          max-height: 100%;
          min-height: 0;
          /*
           * The stage is not squeezed by a SIBLING. max-height still caps
           * it against the box, which is the fix above; this stops How to
           * fly's body, which is the tall thing on that screen, from
           * shrinking the stage to nothing. It went to zero height and took
           * the Back row with it, and the row was the only one there.
           * The screen scrolls, so the body keeps everything it needs.
           */
          flex: 0 0 auto;
        }
        .menu {
          min-width: 0; width: 100%;
          /*
           * A FLOOR, or the list disappears entirely.
           *
           * `min-height: 0` is what lets a flex child shrink past its
           * content, and it shrinks all the way: on How to fly the body
           * took the box and left the menu 22 px, one third of one row, so
           * Back could not be scrolled to. Same on Rates in landscape,
           * where the curve took it.
           *
           * Three rows' worth is the floor. The screen scrolls now, so
           * whatever does not fit above the list is still reachable, which
           * is the trade: the LIST is the thing you came for and it is the
           * thing that keeps its space.
           */
          flex: 1 1 auto; min-height: min(200px, 100%);
          max-height: none; overflow-y: auto;
        }
        .menu-help {
          max-width: none; margin-top: 10px;
          padding: 8px 16px 0; border-left: none;
          /* Never squeezed to nothing, and never more than a third of the
           * stage: a note is sometimes four lines and the list is what the
           * pilot came for. */
          flex: 0 0 auto; max-height: 33%; overflow-y: auto;
        }
        .menu-help:empty { padding: 8px 16px 0; }
        /*
         * The airframe stops being a square as wide as the phone. At 390 px
         * a 1:1 frame is 344 px tall, 44 percent of the window, above a
         * six row list. It is a nice thing to look at and it is not what
         * the screen is for.
         */
        .craft-showcase { flex: 0 0 auto; width: min(100%, 340px); align-self: center; }
        .craft-showcase-frame { aspect-ratio: auto; height: clamp(110px, 21vh, 210px); }
        .craft-showcase-cap { padding-bottom: 8px; }
        .screen-title {
          padding: 2.6vh 4.5vw 2vh;
          background:
            linear-gradient(180deg, rgba(12, 18, 14, 0.70) 0%, rgba(12, 18, 14, 0.18) 16%, rgba(12, 18, 14, 0.04) 38%, rgba(12, 18, 14, 0.12) 58%, rgba(12, 18, 14, 0.84) 100%);
        }
        .title-copy {
          width: 100%;
        }
        .screen-title .wordmark {
          font-size: clamp(34px, 11vw, 56px);
        }
        .screen-title.is-gate .brand { display: block; }
        .screen-title.is-gate .brand .beta-note { margin: 10px 0 0; }
        .screen-title .keep-note,
        .screen-title .wiki-teaser { display: none; }
        /* The storage note above goes at this width. The beta notice does
           not: a phone hits the same bugs a desktop does, and it is one
           line where that note was four. */
        .screen-title .beta-note { gap: 8px; margin-top: 10px; font-size: 12.5px; }
        .screen-title .brand-best {
          margin-top: 8px;
          padding: 5px 10px;
          font-size: 12px;
        }
        .screen-title .title-foot {
          flex-direction: column;
          align-items: stretch;
          gap: 8px;
        }
        .screen-title .menu-stage {
          display: block;
          position: static;
          width: 100%;
        }
        .screen-title .menu-scroll {
          max-height: min(calc(32vh - var(--bars)), 14em);
        }
        .screen-title .menu-help {
          position: absolute;
          left: 0;
          right: 0;
          bottom: 100%;
          width: auto;
          max-width: none;
          text-align: left;
          border: none;
          padding: 0 4px 10px;
        }
        /* A phone gets one column, so a card lies on its side: the picture
           on the left at a fixed share of the width, the words to the right
           of it. Two upright cards stacked would be taller than the window
           and this screen does not scroll. */
        /* And the gate puts the command bar back into the bottom padding.
           Under 860 px the title stops reserving it, which is survivable
           for a menu that scrolls and is not for a block pinned to the
           bottom of the column: the last 52 px would be under the bar. */
        .screen-title.is-gate { padding-bottom: calc(2vh + var(--bar-bot)); }
        .screen-title.is-gate .title-copy { width: 100%; }
        .screen-title.is-gate .title-top { flex-direction: column; align-items: stretch; gap: 10px; }
        .screen-title.is-gate .gate-rooms:not([hidden]) { flex: 0 0 auto; margin: 0; padding: 8px 10px 9px; gap: 6px; }
        .gate-room { padding: 4px 8px; }
        .gate-room-name { font-size: 13.5px; }
        .gate-room-value { font-size: 11px; }
        .gate-rooms-buttons .gate-room { padding: 5px 8px; }
        .screen-title.is-gate .gate-cards {
          flex-direction: column;
          gap: 10px;
        }
        /* flex: 0 0 auto, because the base rule's `flex: 1 1 0` is a basis
           on the MAIN axis and the stack has just turned that axis
           vertical: left as it was, each card starts from a zero height and
           collapses to the two pixels of its own border. */
        .gate-card { flex: 0 0 auto; flex-direction: row; align-items: stretch; }
        .gate-card-art { flex: 0 0 38%; width: 38%; height: auto; min-height: 96px; }
        .gate-card-art::after {
          background: linear-gradient(90deg, rgba(12, 18, 14, 0) 55%, rgba(16, 22, 17, 0.75) 100%);
        }
        .gate-card-body {
          flex: 1 1 auto;
          gap: 5px;
          padding: 10px 13px 11px;
          justify-content: center;
        }
        /* Three lines here. Free Flight's sentence ran to twenty in this
           column, which put its tags and every card under it below the
           window of an upright phone, and this screen does not scroll. */
        .gate-card-blurb {
          font-size: 12.5px; line-height: 1.5;
          -webkit-line-clamp: 3;
          line-clamp: 3;
        }
        /* The art is a third of the card's width here, so the mark comes
           down with it. Same box on all three, as ever. */
        .gate-card-mark { width: 42px; height: 42px; left: 7px; bottom: 6px; }
        /* FIVE CARDS ON AN UPRIGHT PHONE, stacked as ever, because a column
           is what the arrows and a thumb both walk, and a sideways scroller
           would hide three of the five answers. They fit by losing the
           sentence: the name, the picture and the tags carry the choice,
           the same trade the landscape rule below already makes, and the
           whole sentence is on any wider screen. 360 by 640 is the floor. */
        .gate-cards:is([data-count="5"], [data-count="6"], [data-count="7"]) { gap: 7px; }
        .gate-cards:is([data-count="5"], [data-count="6"], [data-count="7"]) .gate-card-blurb { display: none; }
        .gate-cards:is([data-count="5"], [data-count="6"], [data-count="7"]) .gate-card-art { flex-basis: 34%; width: 34%; min-height: 70px; }
        .gate-cards:is([data-count="5"], [data-count="6"], [data-count="7"]) .gate-card-body { gap: 4px; padding: 8px 12px 9px; }
        .gate-cards:is([data-count="5"], [data-count="6"], [data-count="7"]) .gate-card-name { font-size: 18px; }
        .gate-cards:is([data-count="5"], [data-count="6"], [data-count="7"]) .gate-card-facts { gap: 2px 10px; font-size: 10.5px; letter-spacing: 0.1em; }
        .gate-cards:is([data-count="5"], [data-count="6"], [data-count="7"]) .gate-card-mark { width: 34px; height: 34px; left: 5px; bottom: 5px; }
        /* SIX, with Defend Itaipu: tighter type again, because six at the
           five card size ran 4 px under the command bar at 360 by 640. */
        .gate-cards:is([data-count="6"], [data-count="7"]) { gap: 5px; }
        .gate-cards:is([data-count="6"], [data-count="7"]) .gate-card-body { gap: 3px; padding: 6px 12px 7px; }
        .gate-cards:is([data-count="6"], [data-count="7"]) .gate-card-name { font-size: 17px; }
        /* SIX OR SEVEN (six since Defend Itaipu left the title on
           2026-09-30), with Defend the Paraná: one tag line and a shorter
           picture, because seven at the six card size ran 81 px under the
           command bar at 360 by 640, their tags wrapping to two lines
           (scripts/campaign-check.js). The first tag is the card's own.
           The picture is laid over its box rather than sizing it, or its
           own aspect holds every card at 70 px whatever the rule says. */
        .gate-cards:is([data-count="6"], [data-count="7"]) { gap: 4px; }
        .gate-cards:is([data-count="6"], [data-count="7"]) .gate-card-art { min-height: 56px; }
        .gate-cards:is([data-count="6"], [data-count="7"]) .gate-card-shot { position: absolute; inset: 0; }
        .gate-cards:is([data-count="6"], [data-count="7"]) .gate-card-fact:nth-child(n+2) { display: none; }
        .screen-maps .menu-stage {
          display: block;
          position: relative;
          width: 100%;
          max-width: 540px;
        }
        .screen-maps .menu { grid-column: auto; }
        .howto-body { gap: 18px; }
        .howto-keys { min-width: 0; }
        .screen-maps .menu-help {
          position: absolute;
          left: 0; right: 0;
          bottom: calc(100% + 8px);
          margin: 0;
          padding: 0 8px 8px;
          border-left: none;
        }
        /* My tracks has its card strip and its notes right above the list,
           so a line hung above the list lands on them. It goes under. */
        .screen-courses .menu-help { position: static; padding: 8px 8px 0; }
        .title-foot .hint { text-align: left; max-width: none; }
        .craft-showcase {
          width: min(420px, 88vw);
          align-self: center;
          justify-self: center;
          margin: 0 auto 6px;
        }
      }
      /* AN UPRIGHT PHONE UNDER 700 PX with the rooms panel over six or seven cards:
         at 360 by 640 the panel took the 120 px the cards had to spare
         and more, so the cards' pictures come down a size, the panel
         sits tighter and the name, four lines since the rename, comes down
         a size too (scripts/mode-cards-check.js). */
      @media (max-width: 860px) and (min-height: 521px) and (max-height: 700px) {
        .screen-title.is-gate .gate-cards:is([data-count="6"], [data-count="7"]) { gap: 4px; }
        .gate-cards:is([data-count="6"], [data-count="7"]) .gate-card-art { min-height: 38px; }
        .gate-cards:is([data-count="6"], [data-count="7"]) .gate-card-body { gap: 1px; padding: 4px 12px 5px; }
        .gate-cards:is([data-count="6"], [data-count="7"]) .gate-card-name { font-size: 16px; }
        .gate-cards:is([data-count="6"], [data-count="7"]) .gate-card-mark { width: 28px; height: 28px; bottom: 3px; }
        .screen-title.is-gate .title-top { gap: 6px; }
        .screen-title .wordmark { font-size: clamp(30px, 9.5vw, 48px); }
        .screen-title.is-gate .gate-rooms:not([hidden]) { padding: 6px 8px 7px; gap: 5px; }
        .gate-room { padding: 3px 7px; }
        .gate-rooms-buttons .gate-room { padding: 4px 7px; }
      }
      @media (max-height: 520px) {
        .screen-title {
          padding: 1.6vh 3.5vw 1.4vh;
        }
        .screen-title .brand-sub,
        .screen-title .brand-best,
        .screen-title .keep-note,
        .screen-title .wiki-teaser,
        .screen-title .title-foot .hint {
          display: none;
        }
        /* Under 520 px of height the menu barely fits, so the sentence
           goes and the tag stays: the word is the part that has to
           survive, and it costs one line. */
        .screen-title .beta-note { margin-top: 8px; }
        .screen-title .beta-note span:not(.beta-tag) { display: none; }
        /* The name on three lines rather than four, and the Beta tag, all
           that is left of that line here, beside it: stacked, the lockup
           took the height the gate's cards and the menu's rows need at 844
           by 390. Whatever else the brand shows runs full width under both. */
        .screen-title .wordmark {
          font-size: clamp(28px, 9vh, 44px);
        }
        .screen-title .lockup-name > span { display: inline; }
        .screen-title .brand,
        .screen-title.is-gate .brand {
          display: grid; grid-template-columns: auto minmax(0, 16rem);
          justify-content: start; column-gap: 18px; align-items: end;
        }
        .screen-title .brand .beta-note,
        .screen-title.is-gate .brand .beta-note { margin: 0 0 0.2em; }
        .screen-title .brand > :not(.wordmark, .beta-note) { grid-column: 1 / -1; }
        .screen-title .menu-scroll {
          max-height: min(calc(52vh - var(--bars)), 11em);
        }
        .screen-title .row {
          padding: 7px 18px 7px 22px;
          font-size: 15px;
        }
        .screen-title.is-gate { padding-bottom: calc(1.4vh + var(--bar-bot)); }
        /* The rooms panel on a phone on its side is one line under the
           brand: its count, the rooms, and its two buttons. Three lines
           of it put the cards under the command bar at 844 by 390. It
           stops short of the music dock, which reaches down to it. */
        .screen-title.is-gate .gate-rooms:not([hidden]) {
          flex-direction: row; align-items: stretch; padding: 5px 8px; gap: 6px;
          margin: 0 190px 0 0;
        }
        .gate-rooms-head { flex: 0 0 8.5em; flex-direction: column; align-items: flex-start; justify-content: center; gap: 0; overflow: hidden; }
        .gate-rooms-count { font-size: 11.5px; line-height: 1.15; white-space: normal; }
        .gate-rooms-list { flex: 1 1 auto; }
        .gate-rooms-buttons { flex: 0 0 auto; }
        .gate-rooms-buttons .gate-room { flex: 0 0 auto; justify-content: center; }
        /* A landscape phone is 390 px tall and matches the width rule above
           as well, so this undoes the stacking: side by side is the only way
           two cards fit in that height, and the sentence goes so that the
           name and the three words under it survive. This block is later in
           the sheet than that one, which is what makes it win. */
        .screen-title.is-gate .gate-cards {
          flex-direction: row;
          gap: 10px;
        }
        /* Back to a row, so back to sharing the width evenly: the stacked
           block above turned this off. */
        .gate-card { flex: 1 1 0; flex-direction: column; }
        .gate-card-art {
          flex: 0 0 auto; width: 100%;
          height: clamp(70px, 24vh, 120px); min-height: 0;
        }
        .gate-card-art::after {
          background: linear-gradient(180deg, rgba(12, 18, 14, 0) 52%, rgba(16, 22, 17, 0.85) 100%);
        }
        .gate-card-body { padding: 8px 12px 10px; gap: 4px; }
        .gate-card-blurb { display: none; }
        .gate-card-name { font-size: clamp(17px, 4.4vh, 22px); }
        .gate-card-mark { width: 38px; height: 38px; left: 6px; bottom: 5px; }
        /* Five in a row on a phone on its side: the upright phone's five
           card rules above are more specific than this block's, so the
           picture is put back across the card here, and the names come
           down a size so two words fit a fifth of the width. */
        .gate-cards:is([data-count="5"], [data-count="6"], [data-count="7"]) .gate-card-art {
          flex: 0 0 auto; width: 100%;
          height: clamp(60px, 20vh, 110px); min-height: 0;
        }
        .gate-cards:is([data-count="5"], [data-count="6"], [data-count="7"]) .gate-card-body { padding: 7px 10px 8px; }
        .gate-cards:is([data-count="5"], [data-count="6"], [data-count="7"]) .gate-card-name { font-size: clamp(15px, 4vh, 19px); }
      }

      /* The map screen. One card per world, each playing a short flight
