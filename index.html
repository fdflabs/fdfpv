      /* My Hangar's Save as a build (src/ui/hangar.js startMine): a name in
         the line the buttons leave. */
      .hangar-buttons[hidden], .hangar-mine-form[hidden], .hangar-mine[hidden] { display: none; }
      .hangar-mine-row { display: flex; align-items: center; justify-content: flex-end; gap: 10px; flex-wrap: wrap; }
      .hangar-mine-label { font: 600 13px/1 var(--ui-font); letter-spacing: 0.04em; color: var(--slate); }
      .hangar-mine-field { flex: 0 1 18em; }
      .hangar-mine-form .carousel-warn { text-align: right; }
      @media (max-width: 760px) {
        .hangar-buttons-end { flex-wrap: wrap; justify-content: flex-end; }
        .hangar-mine-field { flex: 1 1 100%; }
      }
      /*
       * THE PAINT SHOP (src/ui/hangar-paint.js): the Colours tab's three
       * pages on a segmented switch, the finish chips with a ball of each
       * finish, the decal tiles with the decal's own picture, the aim over
       * the plane while one is placed, and the saved liveries.
       */
      .paint-pages {
        display: grid; grid-template-columns: repeat(3, 1fr); gap: 3px; padding: 3px; margin: 0 0 6px;
        border-radius: 12px; background: rgba(0, 0, 0, 0.32); border: 1px solid rgba(243, 234, 212, 0.1);
      }
      .paint-page {
        appearance: none; border: 0; border-radius: 9px; padding: 9px 6px; cursor: pointer;
        background: transparent; color: var(--slate); font: 700 12px/1 var(--ui-font);
        letter-spacing: 0.12em; text-transform: uppercase;
        transition: background 180ms, color 180ms, transform 220ms var(--hg-spring);
      }
      .paint-page:hover, .paint-page:focus-visible { color: var(--cream); }
      .paint-page.on { background: var(--cream); color: var(--deep); box-shadow: 0 2px 10px rgba(243, 234, 212, 0.2); }
      .paint-chips, .paint-row, .paint-views { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
      .paint-row + .paint-row, .paint-row + .hangar-palette, .hangar-palette + .paint-steps { margin-top: 12px; }
      .paint-views { margin-bottom: 4px; }
      .paint-label {
        font: 700 10px/1 var(--ui-font); letter-spacing: 0.16em; text-transform: uppercase; color: var(--slate);
        min-width: 58px;
      }
      .paint-chip, .paint-wide {
        appearance: none; display: inline-flex; align-items: center; gap: 7px;
        padding: 7px 12px; border-radius: 999px; cursor: pointer; color: var(--cream);
        border: 1px solid rgba(243, 234, 212, 0.18); background: rgba(243, 234, 212, 0.03);
        font: 600 13px/1 var(--ui-font);
        transition: transform 240ms var(--hg-spring), background 160ms, border-color 160ms, color 160ms;
      }
      .paint-chip:hover, .paint-chip:focus-visible, .paint-wide:hover, .paint-wide:focus-visible {
        transform: translateY(-1px); border-color: rgba(243, 234, 212, 0.55);
      }
      .paint-chip.on { background: var(--cream); border-color: var(--cream); color: var(--deep); }
      .paint-chip.paint-danger { color: #ff9b8a; border-color: rgba(255, 120, 100, 0.3); }
      .paint-chip.paint-danger:hover, .paint-chip.paint-danger:focus-visible { background: rgba(255, 110, 90, 0.14); border-color: #ff9b8a; }
      .paint-wide { width: 100%; justify-content: center; padding: 11px 12px; border-style: dashed; margin-bottom: 10px; }
      /* A ball of each finish, lit from the top left like the plane. */
      .paint-finish .paint-chip::before {
        content: ""; width: 14px; height: 14px; border-radius: 50%; flex: none;
        box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.35);
        background: radial-gradient(circle at 34% 30%, #fff8 0 18%, transparent 19%), #b9a88a;
      }
      .paint-finish .paint-finish-film::before {
        background: repeating-linear-gradient(90deg, #6b533488 0 2px, #ffdb1a99 2px 5px);
      }
      .paint-finish .paint-finish-gloss::before {
        background: radial-gradient(circle at 34% 30%, #fff 0 16%, #d5271f 17% 60%, #7a120d 100%);
      }
      .paint-finish .paint-finish-matte::before { background: radial-gradient(circle at 38% 34%, #c9453d, #862a24); }
      .paint-finish .paint-finish-metallic::before {
        background: radial-gradient(circle at 34% 30%, #ffe0d8 0 12%, #e25a4f 22%, #5a1612 80%);
      }
      .paint-finish .paint-finish-chrome::before {
        background: linear-gradient(180deg, #f4f8ff 0 38%, #7d8da3 44%, #fffbe8 50%, #3a332b 56%, #15130f 100%);
      }
      .paint-decals { display: flex; flex-wrap: wrap; gap: 8px; }
      .paint-decal, .paint-kind {
        appearance: none; display: flex; flex-direction: column; align-items: center; gap: 5px;
        padding: 7px 7px 8px; border-radius: 11px; cursor: pointer; color: var(--cream);
        border: 1px solid rgba(243, 234, 212, 0.14); background: rgba(0, 0, 0, 0.28);
        font: 600 11px/1.15 var(--ui-font);
        transition: transform 240ms var(--hg-spring), border-color 160ms, background 160ms;
      }
      .paint-decal { width: 76px; }
      .paint-decal:hover, .paint-decal:focus-visible, .paint-kind:hover, .paint-kind:focus-visible {
        transform: translateY(-2px); border-color: rgba(243, 234, 212, 0.5);
      }
      .paint-decal.on {
        border-color: var(--mint); background: rgba(125, 255, 180, 0.1);
        box-shadow: 0 0 0 1px rgba(125, 255, 180, 0.35), 0 6px 18px rgba(125, 255, 180, 0.12);
      }
      .paint-add { justify-content: center; min-height: 64px; border-style: dashed; font-size: 13px; color: var(--mint); }
      .paint-add.on { background: rgba(125, 255, 180, 0.08); border-color: var(--mint); }
      .paint-decal-name, .paint-kind-name { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .paint-thumb {
        width: 54px; height: 34px; border-radius: 5px;
        background: linear-gradient(180deg, #8d949b, #6c737a); box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.3);
      }
      .paint-kind .paint-thumb { width: 64px; height: 40px; }
      .paint-kinds {
        display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 12px;
      }
      .hangar-tab .paint-kind { animation: hg-pop 380ms var(--hg-spring) both; animation-delay: calc(var(--i, 0) * 22ms); }
      .paint-editor, .paint-placing {
        margin-top: 14px; padding: 12px; border-radius: 12px;
        background: rgba(0, 0, 0, 0.26); border: 1px solid rgba(243, 234, 212, 0.1);
      }
      .paint-placing { display: flex; flex-direction: column; align-items: flex-start; gap: 10px; border-color: rgba(125, 255, 180, 0.35); }
      .paint-placing .hangar-note { margin: 0; }
      .paint-steps { display: grid; grid-template-columns: auto 34px 1fr 34px; align-items: center; gap: 6px 8px; }
      .paint-step {
        appearance: none; width: 34px; height: 30px; border-radius: 8px; cursor: pointer;
        border: 1px solid rgba(243, 234, 212, 0.18); background: rgba(243, 234, 212, 0.05); color: var(--cream);
        font: 700 16px/1 var(--ui-font);
        transition: transform 200ms var(--hg-spring), border-color 160ms;
      }
      .paint-step:hover, .paint-step:focus-visible { transform: scale(1.08); border-color: rgba(243, 234, 212, 0.55); }
      .paint-value { text-align: center; font: 700 14px/1 var(--ui-font); color: var(--amber); font-variant-numeric: tabular-nums; }
      .paint-digits, .paint-name-field, .paint-code {
        box-sizing: border-box; border-radius: 8px; border: 1px solid rgba(243, 234, 212, 0.25);
        background: rgba(0, 0, 0, 0.4); color: var(--cream); font: 700 16px/1.2 var(--ui-font); user-select: text;
      }
      .paint-digits { width: 64px; height: 30px; text-align: center; font-size: 18px; font-variant-numeric: tabular-nums; }
      .paint-name-field { flex: 1; min-width: 120px; height: 34px; padding: 0 10px; font-weight: 600; font-size: 14px; }
      .paint-code { width: 100%; margin-top: 10px; padding: 8px 10px; resize: vertical; font: 500 12px/1.4 ui-monospace, monospace; word-break: break-all; }
      .paint-digits:focus, .paint-name-field:focus, .paint-code:focus { outline: 2px solid var(--amber); outline-offset: 1px; }
      .paint-acts { margin-top: 14px; }
      .paint-slot .hangar-dot { width: 14px; height: 14px; }
      .paint-saved { display: flex; flex-direction: column; gap: 6px; }
      .paint-saved-row {
        display: flex; align-items: center; gap: 6px; padding: 5px 5px 5px 4px; border-radius: 11px;
        background: rgba(0, 0, 0, 0.24); border: 1px solid rgba(243, 234, 212, 0.08);
      }
      .paint-saved-row.confirm { border-color: rgba(255, 120, 100, 0.45); background: rgba(255, 110, 90, 0.08); padding-left: 12px; }
      .paint-saved-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font: 700 14px/1.2 var(--ui-font); }
      .paint-wear {
        appearance: none; text-align: left; border: 0; background: transparent; color: var(--cream); cursor: pointer;
        padding: 8px 10px; border-radius: 8px; transition: background 160ms;
      }
      .paint-wear:hover, .paint-wear:focus-visible { background: rgba(243, 234, 212, 0.08); }
      .paint-error { margin: 8px 0 0; font: 600 13px/1.4 var(--ui-font); color: #ff9b8a; }
      /* The aim over the plane while a decal is placed: a ring and a dot,
       * mint once it is over the plane. */
      .paint-reticle {
        position: absolute; left: 0; top: 0; width: 0; height: 0; pointer-events: none; z-index: 2;
      }
      .paint-reticle[hidden] { display: none; }
      .paint-reticle::before, .paint-reticle::after {
        content: ""; position: absolute; border-radius: 50%; transform: translate(-50%, -50%);
      }
      .paint-reticle::before {
        width: 34px; height: 34px; border: 2px solid rgba(243, 234, 212, 0.75);
        box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.5), 0 0 16px rgba(0, 0, 0, 0.4);
        transition: border-color 140ms, width 200ms var(--hg-spring), height 200ms var(--hg-spring);
      }
      .paint-reticle::after { width: 4px; height: 4px; background: var(--cream); }
      .paint-reticle.on::before { border-color: var(--mint); width: 26px; height: 26px; }
      .hangar.entering .hangar-head { animation: hg-drop 560ms var(--hg-ease) both; }
      .hangar.entering .hangar-side { animation: hg-from-right 620ms var(--hg-ease) 90ms both; }
      .hangar.entering .hangar-foot { animation: hg-rise 560ms var(--hg-ease) 160ms both; }
      .hangar.entering .hangar-scheme, .hangar.entering .hangar-card, .hangar.entering .hangar-swatch {
        animation: hg-pop 420ms var(--hg-spring) both; animation-delay: calc(260ms + var(--i, 0) * 22ms);
      }
      @keyframes hg-drop { from { opacity: 0; transform: translateY(-16px); } to { opacity: 1; transform: none; } }
      @keyframes hg-rise { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
      @keyframes hg-from-right { from { opacity: 0; transform: translateX(36px); } to { opacity: 1; transform: none; } }
      @keyframes hg-from-left { from { opacity: 0; transform: translateX(-36px); } to { opacity: 1; transform: none; } }
      @keyframes hg-pop { from { opacity: 0; transform: scale(0.7); } to { opacity: 1; transform: none; } }
      @keyframes hg-breathe {
        0%, 100% { box-shadow: 0 0 0 0 rgba(125, 255, 180, 0.0); }
        50% { box-shadow: 0 0 0 6px rgba(125, 255, 180, 0.18), 0 0 24px rgba(125, 255, 180, 0.35); }
      }
      @media (prefers-reduced-motion: reduce) {
        .hangar *, .hangar-tab-pill { animation: none !important; transition: none !important; }
        .hangar-side { scroll-behavior: auto; }
      }
      /* A phone upright: the plane over the panel. */
      @media (max-width: 760px) {
        .hangar-body { grid-template-columns: 1fr; grid-template-rows: minmax(150px, 32vh) minmax(0, 1fr); gap: 10px; }
        .hangar-schemes { grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); }
        .hangar-panel { gap: 8px; padding-left: 16px; padding-right: 16px; }
        .hangar-facts:not(:has(.hangar-floats)), .hangar-facts .carousel-fact { display: none; }
      }
      /* A short screen, a phone on its side: the words give way. */
      @media (max-height: 520px) {
        .hangar-panel { gap: 6px; padding-top: max(8px, env(safe-area-inset-top)); padding-bottom: max(8px, env(safe-area-inset-bottom)); }
        .hangar-name { font-size: 22px; margin-top: 4px; }
        .hangar-facts:not(:has(.hangar-floats)), .hangar-facts .carousel-fact, .hangar .carousel-hint { display: none; }
        .hangar .carousel-choose, .hangar .carousel-back { padding: 9px 22px; }
      }

      .music-dock.on-flight {
        right: auto; left: 16px; top: 16px;
        background: rgba(16, 22, 17, 0.38);
      }
      .music-dock.is-muted { opacity: 0.5; }
      .music-dock[hidden] { display: none; }
      .music-skip {
        appearance: none; border: 0; border-radius: 3px;
        width: 26px; height: 24px; padding: 0;
        background: rgba(232, 168, 184, 0.14); color: var(--cream);
        font: 700 16px/1 var(--ui-font); cursor: pointer;
      }
      .music-skip:hover { background: rgba(232, 168, 184, 0.32); color: var(--sakura); }
      /* The name is the mute, so it is a button and has to stop looking
         like one: no border, no fill, the dock's own ground. The padding
         is what makes it a hit box rather than a line of text, and it is
         the only thing here that is not what a div would have given. */
      .music-title {
        appearance: none; border: 0; background: none; border-radius: 3px;
        max-width: 11em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        padding: 4px 6px; cursor: pointer;
        font: 11px/1.2 var(--ui-font); letter-spacing: 0.04em; color: var(--cream);
      }
      .music-title:hover { background: rgba(232, 168, 184, 0.14); color: var(--sakura); }
      /* Muted. The dock is already at half opacity, so the line through the
         name is what says this is a state and not a dim screen: a reader
         who cannot see the difference between 0.5 and 1.0 can see a rule
         through a word. */
      .music-dock.is-muted .music-title { text-decoration: line-through; }
      @media (max-width: 520px) {
        .music-title { max-width: 6.5em; font-size: 10px; }
      }

      /* The target mark. A bracket on the next gate while it is in frame,
         a chevron pinned inside the edge while it is not, and the range
         under either. Green while the pilot is on the side the gate is
         flown from, red while they are not, which is the same half space
         the gate itself is coloured by: the display and the world must
         never disagree about which way through.

         currentColor everywhere, so the side is one class on the root and
         not four colour writes a frame. Transform only, no width or top,
         so tracking a gate at 30 m/s costs a composite and not a layout. */
      .lock {
        position: absolute; left: 0; top: 0; pointer-events: none;
        color: #39ff8b;
        filter: drop-shadow(0 1px 3px rgba(0, 0, 0, 0.9));
        will-change: transform;
      }
      .lock.is-off { display: none; }
      .lock.is-wrong { color: #ff5a5a; }
      .lock-box {
        position: absolute; left: 0; top: 0;
        transform: translate(-50%, -50%);
      }
      .lock.is-edge .lock-box { display: none; }
      /* Corner ticks, not a closed rectangle. A box drawn round an opening
         reads as a second gate; four ticks read as an instrument. */
      .lock-box .lc {
        position: absolute; width: 24%; height: 24%;
        border: 2px solid currentColor;
      }
      .lock-box .lc.tl { left: 0; top: 0; border-right: 0; border-bottom: 0; }
      .lock-box .lc.tr { right: 0; top: 0; border-left: 0; border-bottom: 0; }
      .lock-box .lc.bl { left: 0; bottom: 0; border-right: 0; border-top: 0; }
      .lock-box .lc.br { right: 0; bottom: 0; border-left: 0; border-top: 0; }
      /* The chevron is the state where the pilot cannot see the target at
         all, so it is the loudest thing this mark ever draws: bigger than
         the bracket's ticks, and breathing, because a still triangle on the
         edge of a moving frame is a thing the eye stops reporting. */
      .lock-arrow {
        position: absolute; left: 0; top: 0; display: none;
        width: 0; height: 0;
        border-left: 15px solid transparent;
        border-right: 15px solid transparent;
        border-bottom: 27px solid currentColor;
        transform-origin: 50% 50%;
      }
      .lock.is-edge .lock-arrow { display: block; }
      /* Shallow on purpose. Deep enough to catch the eye at the edge of the
         frame, never so deep that the chevron is missing from a frame: a
         marker that is sometimes absent is a marker a pilot learns to
         distrust, and a capture of one is evidence of nothing. */
      .lock.is-edge { animation: lock-hunt 1.15s ease-in-out infinite; }
      @keyframes lock-hunt {
        50% { opacity: 0.72; }
      }
      .lock-dist {
        position: absolute; left: 0; top: 0;
        font-size: 12px; font-weight: 600; letter-spacing: 0.1em;
        color: currentColor; white-space: nowrap;
      }
    </style>

         for the post processing chain; nothing else is on the render
         side. See PROGRESS.md. -->
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",

          "mp4-muxer": "https://cdn.jsdelivr.net/npm/mp4-muxer@5.2.2/build/mp4-muxer.mjs",

        }
      }
    </script>

  <body>
    <canvas id="view"></canvas>
    <div id="ui"></div>
    <div id="loading">
      <div class="loading-col">
        <div class="loading-brand">
          <div class="lockup">
            <span class="lockup-slash" aria-hidden="true"></span>
            <span class="lockup-over">Paraguayan</span>
            <span class="lockup-name"><span>Drone</span> <span>Combat</span></span>
            <span class="lockup-under">Simulator</span>
          </div>
          <div class="loading-tag">Real Betaflight in your browser</div>
        </div>
        <div class="loading-status">
          <div class="loading-row">
            <div class="loading-stage">loading</div>
            <div class="loading-meta"><span class="loading-step"></span><span class="loading-elapsed"></span></div>
          </div>
          <div class="loading-track"><div class="loading-fill"></div><div class="loading-sweep"></div></div>
          <div class="loading-joke">"I complimented my quad on its propellers. It said thanks for the props."</div>
        </div>
        <!-- Empty until something fails. See fail() in src/ui/loading.js: a
             boot that dies used to leave a red bar, a sentence and no way
             out, which is a dead end on the one screen a stranded visitor is
             looking at. aria-live so a screen reader hears the failure. -->
        <div class="loading-help" hidden role="alert" aria-live="assertive"></div>
      </div>
    </div>
    <!-- boot.js, not main.js. It imports nothing at module scope except the
         loading screen, so the screen is alive and reporting BEFORE the
         three.js fetch begins. main.js imports three statically and is itself
         one of boot's stages. -->
    <script type="module" src="src/boot.js"></script>
