<!doctype html>
<!--
  index.html: where the track builder's page was, forwarding to Track mode.

  Tracks are built inside the simulator now, in the world they are raced
  in, so the separate builder page is gone. The board still links here:
  Build a track, and a card's remix link with ?share= and ?board=. Those
  links are deployed, so this address forwards them to the simulator's
  Track mode rather than to a 404, carrying the track, the board and the
  language. A track drawn for the old race field is refused there, with
  the reason.

<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>FDFPV</title>
    <link rel="icon" href="../../favicon.ico" sizes="any" />
    <meta http-equiv="refresh" content="0; url=../../index.html?map=track" />
    <script>
      const from = new URLSearchParams(window.location.search);
      const to = new URLSearchParams({ map: 'track' });
      for (const key of ['share', 'board', 'lang']) {
        if (from.get(key)) {
          to.set(key, from.get(key));
        }
      }
      window.location.replace(`../../index.html?${to}`);
    </script>
  </head>
</html>
