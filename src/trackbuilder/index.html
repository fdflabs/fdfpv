<!doctype html>
<!--
  index.html: the old track builder address, now a forward to Track mode.

  The builder lives inside the simulator, in the world each track is raced
  in. The board's deployed links still point here (Build a track, and a
  card's remix link carrying ?share= and ?board=), so this page sends them
  on to Track mode with the track, the board and the language intact. A
  track drawn for the retired race field is refused there, with a reason.
  The meta refresh covers a browser with scripts off, without the extras.

<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Paraguayan Drone Combat Simulator</title>
    <link rel="icon" href="../../favicon.ico" sizes="any" />
    <meta http-equiv="refresh" content="0; url=../../index.html?map=track" />
    <script>
      (() => {
        const incoming = new URLSearchParams(window.location.search);
        const carried = [['map', 'track']];
        for (const name of ['share', 'board', 'lang']) {
          const value = incoming.get(name);
          if (value) {
            carried.push([name, value]);
          }
        }
        window.location.replace(`../../index.html?${new URLSearchParams(carried)}`);
      })();
    </script>
  </head>
</html>
