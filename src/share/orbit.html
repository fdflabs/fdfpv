  plays the kept clip after that, so a thumbnail is the game's own
  renderer, camera and world without a second copy of any of them.

<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Paraguayan Drone Combat Simulator, orbit</title>
    <link rel="icon" href="data:," />
    <style>
      :root { --ground: #141c16; --hint: #8a9a86; }
      html, body { height: 100%; width: 100%; margin: 0; overflow: hidden; background: var(--ground); }
      /* The canvas while recording, then the clip in its place: either one
       * covers the whole frame. */
      #view, .orbit-clip {
        position: fixed; inset: 0; display: block;
        width: 100%; height: 100%;
        background: var(--ground); object-fit: cover;
      }
      #status {
        position: fixed; inset: 0; box-sizing: border-box; padding: 12px;
        display: grid; place-items: center; text-align: center;
        font: 13px/1.45 system-ui, sans-serif; color: var(--hint);
        pointer-events: none;
      }
      #status.gone { display: none; }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <canvas id="view"></canvas>
    <div id="status">Loading the world.</div>
    <script type="module" src="./orbit.js"></script>
  </body>
</html>
