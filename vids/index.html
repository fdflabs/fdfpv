<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Paraguayan Drone Combat Simulator: films in development</title>
<style>
  :root { color-scheme: dark; --bg: #0d1110; --fg: #e3e8e4; --muted: #94a199; --line: #26302b; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.5 system-ui, sans-serif; }
  main { max-width: 980px; margin: 0 auto; padding: 28px 16px 64px; display: grid; gap: 32px; }
  h1 { margin: 0; font-size: clamp(22px, 4vw, 32px); }
  p { margin: 0; color: var(--muted); }
  section { display: grid; gap: 8px; border-top: 1px solid var(--line); padding-top: 18px; }
  h2 { margin: 0; font-size: 18px; }
  video { width: 100%; height: auto; background: #000; border-radius: 6px; }
  a { color: var(--fg); }
</style>
</head>
<body>
<main>
  <header>
    <h1>The Interior: films in development</h1>
    <p>Rendered from the game engine. Not final: the map's look, the voices and the music are still being worked on.</p>
  </header>
  <section>
    <h2>Prologue</h2>
    <video controls preload="metadata" src="https://api.paraguayandronecombatsimulator.com/vids/interior-prologue.mp4"></video>
    <p><a href="https://api.paraguayandronecombatsimulator.com/vids/interior-prologue-1080.mp4">1080p</a></p>
  </section>
  <section>
    <h2>Mission 1, The Old War: intro</h2>
    <video controls preload="metadata" src="https://api.paraguayandronecombatsimulator.com/vids/int1-intro.mp4"></video>
    <p><a href="https://api.paraguayandronecombatsimulator.com/vids/int1-intro-1080.mp4">1080p</a></p>
  </section>
  <section>
    <h2>Mission 1, The Old War: intro (Spanish)</h2>
    <video controls preload="metadata" src="https://api.paraguayandronecombatsimulator.com/vids/int1-intro-es.mp4"></video>
    <p><a href="https://api.paraguayandronecombatsimulator.com/vids/int1-intro-es-1080.mp4">1080p</a></p>
  </section>
  <section>
    <h2>Mission 1, The Old War: outro</h2>
    <video controls preload="metadata" src="https://api.paraguayandronecombatsimulator.com/vids/int1-outro.mp4"></video>
    <p><a href="https://api.paraguayandronecombatsimulator.com/vids/int1-outro-1080.mp4">1080p</a></p>
  </section>
</main>
</body>
</html>
