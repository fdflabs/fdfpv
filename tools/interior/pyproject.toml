# Python environment for the Interior map's data pipeline. The wheels bring
# their own GDAL and PROJ, so nothing needs installing on the host.
#
# This file is part of WebFPVSimulator, licensed GPLv3 or later.

[project]
name = "fdfpv-interior-data"
version = "0.1.0"
description = "Builds the Interior map's shared ground: ANADEM elevation and ESA WorldCover land cover"
license = "GPL-3.0-or-later"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2",
  "pyproj>=3.6",
  "rasterio>=1.4",
  "shapely>=2",
  "pillow>=10",
  "scipy>=1.13",
]

[tool.uv]
package = false
