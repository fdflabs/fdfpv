# Python environment for the Yellowstone data pipeline. The wheels bring
# their own GDAL and PROJ, so nothing needs installing on the host.
#
# This file is part of WebFPVSimulator, licensed GPLv3 or later.

[project]
name = "fdfpv-yellowstone-data"
version = "0.1.0"
description = "Builds the Yellowstone map's data folder from public domain sources"
license = "GPL-3.0-or-later"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2",
  "pyproj>=3.6",
  "rasterio>=1.4",
  "shapely>=2",
  "pyogrio>=0.10",
  "pillow>=10",
]

[tool.uv]
package = false
